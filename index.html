    function getProjectSiteGeo(p) {
      if (!p) return null;
      const base = DEFAULT_SITE_GEO[p.id] || {};
      if (p.siteGeo && typeof p.siteGeo.lat === "number" && typeof p.siteGeo.lng === "number") {
        const g = Object.assign({}, base, p.siteGeo);
        if (!g.parcelLabel && base.parcelLabel) g.parcelLabel = base.parcelLabel;
        if (!g.areaLabel && base.areaLabel) g.areaLabel = base.areaLabel;
        if (!g.roadNote && base.roadNote) g.roadNote = base.roadNote;
        if (!g.neighborNote && base.neighborNote) g.neighborNote = base.neighborNote;
        if ((!Array.isArray(g.neighborBoxes) || g.neighborBoxes.length === 0) && Array.isArray(base.neighborBoxes) && base.neighborBoxes.length > 0) {
          const dx = g.lng - (base.lng || g.lng);
          const dy = g.lat - (base.lat || g.lat);
          g.neighborBoxes = base.neighborBoxes.map(nb => ({
            label: nb.label,
            kind: nb.kind,
            poly: (nb.poly || []).map(pt => [+(pt[0] + dx).toFixed(6), +(pt[1] + dy).toFixed(6)])
          }));
        }
        if (!Array.isArray(g.parcelPoly) || g.parcelPoly.length < 4) {
          const dLng = 0.00018, dLat = 0.00015;
          g.parcelPoly = [
            [g.lng - dLng, g.lat - dLat],
            [g.lng + dLng, g.lat - dLat],
            [g.lng + dLng, g.lat + dLat],
            [g.lng - dLng, g.lat + dLat],
            [g.lng - dLng, g.lat - dLat]
          ];
        }
        return g;
      }
      if (DEFAULT_SITE_GEO[p.id]) return DEFAULT_SITE_GEO[p.id];
      return null;
    }

    function loadMapLibreAssets() {
      if (window.maplibregl) return Promise.resolve(true);
      return new Promise(resolve => {
        const css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css";
        document.head.appendChild(css);

        const sc = document.createElement("script");
        sc.src = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js";
        sc.onload = () => resolve(!!window.maplibregl);
        sc.onerror = () => {
          const sc2 = document.createElement("script");
          sc2.src = "https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js";
          sc2.onload = () => resolve(!!window.maplibregl);
          sc2.onerror = () => resolve(false);
          document.head.appendChild(sc2);
        };
        document.head.appendChild(sc);
      });
    }

    function buildMapGeoJsonCollections() {
      const parcelFeatures = [];
      const roadFeatures = [];
      const neighborFeatures = [];

      getAuthorizedMapProjects().forEach(p => {
        const g = getProjectSiteGeo(p);
        if (!g) return;
        if (Array.isArray(g.parcelPoly) && g.parcelPoly.length >= 4) {
          parcelFeatures.push({
            type: "Feature",
            properties: { id: p.id, code: p.code, name: p.shortName, label: g.parcelLabel || p.shortName },
            geometry: { type: "Polygon", coordinates: [g.parcelPoly] }
          });
        }
        if (Array.isArray(g.roadLine) && g.roadLine.length >= 2) {
          roadFeatures.push({
            type: "Feature",
            properties: { id: p.id, roadNote: g.roadNote || "" },
            geometry: { type: "LineString", coordinates: g.roadLine }
          });
        }
        (g.neighborBoxes || []).forEach(nb => {
          if (Array.isArray(nb.poly) && nb.poly.length >= 4) {
            neighborFeatures.push({
              type: "Feature",
              properties: { id: p.id, label: nb.label || "", kind: nb.kind || "neighbor" },
              geometry: { type: "Polygon", coordinates: [nb.poly] }
            });
          }
        });
      });

      return {
        parcels: { type: "FeatureCollection", features: parcelFeatures },
        roads: { type: "FeatureCollection", features: roadFeatures },
        neighbors: { type: "FeatureCollection", features: neighborFeatures }
      };
    }

    async function toggleMap3DMode(forceState) {
      ensureMap3DDomAndCss();
      const targetOpen = typeof forceState === "boolean" ? forceState : !window._yxMap3DOpen;

      if (targetOpen && store.vault && store.vault.enabled && !hasAnyUnlockedKey()) {
        openUnlockModal("", () => toggleMap3DMode(true));
        return;
      }

      window._yxMap3DOpen = targetOpen;
      const stage = document.getElementById("map3dStage");
      const topBtn = document.getElementById("topMap3DBtn");
      if (topBtn) topBtn.classList.toggle("active", targetOpen);

      if (!targetOpen) {
        stage.classList.remove("open");
        cancelMapPinPicking();
        return;
      }

      stage.classList.add("open");
      renderMapTopSitePills();

      const ok = await loadMapLibreAssets();
      if (!ok) {
        _mapOfflineFallback = true;
        renderOffline3DTaiwanBlueprint();
        return;
      }

      if (!_mlMap) {
        initMapLibre3DInstance();
      } else {
        refreshMap3DDataAndMarkers();
        _mlMap.resize();
      }
    }

    function refreshMap3DDataAndMarkers() {
      renderMapTopSitePills();
      if (_mapOfflineFallback) {
        renderOffline3DTaiwanBlueprint();
        return;
      }
      if (!_mlMap) return;

      const geo = buildMapGeoJsonCollections();
      if (_mlMap.getSource("yx-parcels")) _mlMap.getSource("yx-parcels").setData(geo.parcels);
      if (_mlMap.getSource("yx-roads")) _mlMap.getSource("yx-roads").setData(geo.roads);
      if (_mlMap.getSource("yx-neighbors")) _mlMap.getSource("yx-neighbors").setData(geo.neighbors);

      _mlMarkers.forEach(m => m.remove());
      _mlMarkers = [];

      getAuthorizedMapProjects().forEach(p => {
        const g = getProjectSiteGeo(p);
        if (!g) return;
        const pct = typeof p.progressPct === "number" ? p.progressPct : 40;
        const el = document.createElement("div");
        el.className = "yx-3d-beacon" + (_mapSelectedPjId === p.id ? " selected" : "");
        el.dataset.pjid = p.id;
        el.innerHTML = `
          <div class="yx-beacon-card">
            <span class="mono" style="font-size:11px;color:#FBBF24;font-weight:800;">${esc(p.code)}</span>

          </div>
          <div class="yx-beacon-pillar"></div>
          <div class="yx-beacon-ring"></div>
        `;
        el.addEventListener("click", ev => {
          ev.stopPropagation();
          flyToSiteOnMap(p.id);
        });
        const mk = new maplibregl.Marker({ element: el, anchor: "bottom" })
          .setLngLat([g.lng, g.lat])
          .addTo(_mlMap);
        _mlMarkers.push(mk);
      });

      if (_mapSelectedPjId) renderMapSiteDrawer(_mapSelectedPjId);
    }

    function renderMapTopSitePills() {
      const host = document.getElementById("map3dSitePills");
      if (!host) return;
      const list = getAuthorizedMapProjects();
      const badge = document.getElementById("map3dAuthBadge");
      const lockBtn = document.getElementById("map3dQuickLockBtn");
      const vaultOn = !!(store && store.vault && store.vault.enabled);
      if (badge) {
        if (!vaultOn) {
          badge.style.color = "#FCA5A5";
          badge.style.borderColor = "rgba(248,113,113,0.5)";
          badge.textContent = "未啟用金庫鎖（全公開）";
        } else if (typeof isMasterUnlocked === "function" && isMasterUnlocked()) {
          badge.style.color = "#FDE68A";
          badge.style.borderColor = "rgba(251,191,36,0.5)";
          badge.textContent = `視角：總經理全區（顯示 ${list.length} 座據點）`;
        } else {
          const roleName = (typeof sessionUnlockedBy !== "undefined" && sessionUnlockedBy) ? sessionUnlockedBy : "受限視角";
          const finOpen = !!(typeof sessionKeks !== "undefined" && sessionKeks["財務部"]);
          badge.style.color = "#7DD3FC";
          badge.style.borderColor = "rgba(56,189,248,0.45)";
          badge.textContent = `隔離視角：${roleName}（僅顯示 ${list.length} 座授權據點${finOpen ? "" : " · 財務已加密"}）`;
        }
      }
      if (lockBtn) {
        lockBtn.style.display = (vaultOn && typeof hasAnyUnlockedKey === "function" && hasAnyUnlockedKey()) ? "inline-flex" : "none";
      }
      host.innerHTML = list.length ? list.map(p => {

    function flyToSiteOnMap(pjId) {
      const p = projects.find(x => x.id === pjId);
      if (!p) return;
      if (typeof canAccessProjectByDept === "function" && !canAccessProjectByDept(p)) {
        openUnlockModal(p.leadDept || "僅總經理", () => flyToSiteOnMap(pjId));
        return;
      }
      const g = getProjectSiteGeo(p);
      if (!g) {
        toastMsg("此專案尚未設定基地座標，請點「📍 插旗／標定據點」標定位置");
        return;
      }

      _mapSelectedPjId = p.id;
      renderMapTopSitePills();
      document.querySelectorAll(".yx-3d-beacon").forEach(el => {
        el.classList.toggle("selected", el.dataset.pjid === p.id);
      });

      if (_mlMap) {
        _mlMap.flyTo({
          center: [g.lng, g.lat],
          zoom: g.zoom || 18.3,
          pitch: _mapLayerFlags.pitch3d ? (g.pitch || 60) : 0,
          bearing: _mapLayerFlags.pitch3d ? (g.bearing || 16) : 0,
          speed: 1.35,
          curve: 1.45,
          essential: true
        });
      } else if (_mapOfflineFallback) {
        renderOffline3DTaiwanBlueprint();
      }

      renderMapSiteDrawer(p.id);

    function toggleMapSubLayer(key) {
      _mapLayerFlags[key] = !_mapLayerFlags[key];
      const btnMap = { cadastral: "mLyrCad", neighbors: "mLyrBld", roads: "mLyrRd", pitch3d: "mLyr3d" };
      const btn = document.getElementById(btnMap[key]);
      if (btn) btn.classList.toggle("on", _mapLayerFlags[key]);

      if (!_mlMap) return;
      const vis = flag => (flag ? "visible" : "none");
      if (key === "cadastral") {
        ["lyr-nlsc-landsect", "lyr-yx-parcel-fill", "lyr-yx-parcel-halo", "lyr-yx-parcel-line"].forEach(id => {
          if (_mlMap.getLayer(id)) _mlMap.setLayoutProperty(id, "visibility", vis(_mapLayerFlags.cadastral));
        });
      } else if (key === "neighbors") {
        ["lyr-nlsc-buildx", "lyr-yx-neighbor-fill", "lyr-yx-neighbor-line"].forEach(id => {
          if (_mlMap.getLayer(id)) _mlMap.setLayoutProperty(id, "visibility", vis(_mapLayerFlags.neighbors));
        });
      } else if (key === "roads") {
        ["lyr-nlsc-emap2", "lyr-yx-road-glow", "lyr-yx-road-line"].forEach(id => {
          if (_mlMap.getLayer(id)) _mlMap.setLayoutProperty(id, "visibility", vis(_mapLayerFlags.roads));
        });
      } else if (key === "pitch3d") {
        _mlMap.easeTo({ pitch: _mapLayerFlags.pitch3d ? 60 : 0, duration: 700 });
      }
    }

    function submitSaveSiteGeoModal(e) {
      e.preventDefault();
      const pjId = document.getElementById("sg_pjid").value;
      const lat = parseFloat(document.getElementById("sg_lat").value);
      const lng = parseFloat(document.getElementById("sg_lng").value);
      const p = projects.find(x => x.id === pjId);
      if (!p || isNaN(lat) || isNaN(lng)) return;

      const dLng = 0.00020, dLat = 0.00016;
      p.siteGeo = {
        lat,
        lng,
        zoom: 18.2,
        pitch: 60,
        bearing: 15,
        parcelLabel: document.getElementById("sg_parcel").value.trim(),
        areaLabel: p.scale || "",
        roadNote: document.getElementById("sg_road").value.trim(),
        neighborNote: document.getElementById("sg_nb").value.trim(),
        parcelPoly: [
          [lng - dLng, lat - dLat],
          [lng + dLng, lat - dLat],
          [lng + dLng, lat + dLat],
          [lng - dLng, lat + dLat],
          [lng - dLng, lat - dLat]
        ],
        roadLine: [[lng - dLng * 1.4, lat - dLat * 1.2], [lng + dLng * 1.4, lat - dLat * 1.2]],
        neighborBoxes: []
      };

      const baseMetaVer = p._metaVer || 1;
      commitStore(true);
      if (nasServerActive) {
        const diskSafe = serializeStoreForDisk("encrypted");
        const diskP = diskSafe.projects.find(x => x.id === p.id);
        if (diskP) nasSendOp({ op: "upsert_project", baseMetaVer, project: diskP });
      }
      closeSheet();
      refreshMap3DDataAndMarkers();
      flyToSiteOnMap(p.id);
      toastMsg(`✓ 已為「${p.shortName}」插旗點亮 3D 實景光柱！`);
    }

    /* ---------- Web Speech API Voice Input (Mandarin zh-TW) ---------- */
    function toggleJarvisSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        toastMsg("此瀏覽器未啟用語音辨識引擎，請直接輸入問題");
        return;
      }
      if (_jarvisListening) {
        stopJarvisSpeech();
        return;
      }
      _jarvisSpeechRec = new SR();
      _jarvisSpeechRec.lang = "zh-TW";
      _jarvisSpeechRec.interimResults = false;
      _jarvisListening = true;
      const btn = document.getElementById("jarvisMicBtn");
      if (btn) { btn.classList.add("rec"); btn.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:#FF3B5C;"></span><span>聆聽中...</span>`; }

      _jarvisSpeechRec.onresult = ev => {
        const txt = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : "";
        stopJarvisSpeech();
        if (txt) {
          const inp = document.getElementById("jarvisQueryInput");
          if (inp) inp.value = txt;
          executeJarvisBrainQuery(txt);
        }
      };
      _jarvisSpeechRec.onerror = () => stopJarvisSpeech();
      _jarvisSpeechRec.onend = () => stopJarvisSpeech();
      _jarvisSpeechRec.start();
    }

    function stopJarvisSpeech() {
      _jarvisListening = false;
      if (_jarvisSpeechRec) {
        try { _jarvisSpeechRec.stop(); } catch (e) {}
        _jarvisSpeechRec = null;
      }
      const btn = document.getElementById("jarvisMicBtn");
      if (btn) { btn.classList.remove("rec"); btn.innerHTML = `<svg class="ic-sm" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg><span>語音</span>`; }

    /* ---------- Core Semantic + Causal + Comparison Brain ---------- */
    function expandQueryTerms(rawQ) {
      const q = rawQ.toLowerCase();
      const terms = new Set();
      const segs = q.split(/[\s,，、？?！!。：:「」『』（）()\/／]+/).filter(Boolean);
      segs.forEach(s => terms.add(s));

      // Extract key 2~4 char Chinese n-grams & domain keywords
      const domainWords = [
        "岡山", "馬稠後", "大寮", "仁義", "仁怡", "余公館", "地下室", "合庫", "合作金庫",
        "授信", "貸款", "土融", "建融", "土建融", "額度", "條件", "下水道", "專下", "預鑄槽",
        "搭排", "出流管制", "滯洪", "單層", "多層", "冷鏈", "冷凍", "精實", "鋼構", "無柱",
        "落柱", "走廊", "鋐毅", "世峯", "預付款", "終止", "危老", "翻修", "拆除", "新建",
        "估值", "容獎", "鄰房", "鑑定", "建照", "進度", "預算", "造價", "欣陽", "食安"
      ];
      domainWords.forEach(w => { if (q.includes(w)) terms.add(w); });

      JARVIS_SYNONYM_CLUSTERS.forEach(cluster => {
        if (cluster.some(w => q.includes(w))) {
          cluster.forEach(w => terms.add(w));
        }
      });
      return Array.from(terms);
    }

    function detectMentionedProjects(q, authProjects) {
      const ql = q.toLowerCase();
      const aliasMap = {
        "machouhou": ["馬稠後", "食品廠", "朴子", "鹿草", "1-2-2", "pj-01"],
        "gangshan": ["岡山", "鹽埔", "81-2", "綜合宿舍", "pj-02"],
        "daliao": ["大寮", "上寮", "頂樓", "5f", "pj-03"],
        "renyi": ["仁義", "仁怡", "余公館", "仁武", "危老", "pj-04"]
      };
      return authProjects.filter(p => {
        if (ql.includes((p.shortName || "").toLowerCase()) || ql.includes((p.code || "").toLowerCase())) return true;
        const aliases = aliasMap[p.id] || [];
        return aliases.some(a => ql.includes(a));
      });
    }

    function executeJarvisBrainQuery(rawQuery) {
      ensureJarvisDomAndCss();
      const authProjects = projects.filter(p =>
        (typeof canAccessProjectByDept !== "function" || canAccessProjectByDept(p)) &&
        !(p._locked && p.secMode === "full")
      );
      if (!authProjects.length) {
        openUnlockModal("", () => executeJarvisBrainQuery(rawQuery));
        return;
      }

      const ql = rawQuery.toLowerCase();
      const terms = expandQueryTerms(rawQuery);
      const mentionedPjs = detectMentionedProjects(rawQuery, authProjects);
      const targetPjs = mentionedPjs.length ? mentionedPjs : authProjects;

      const isFinQuestion = /授信|合庫|合作金庫|貸款|土融|建融|土建融|額度|利率|成數|自備|預算|總價|造價|估值|多少錢|差多少|金額/.test(ql);
      const anyTargetFinLocked = targetPjs.some(p => p._locked && p.secMode === "finance");

      // Score all events across targetPjs
      const scoredHits = [];
      targetPjs.forEach(p => {
        const sortedEvs = getSortedEvents(p);
        sortedEvs.forEach((ev, evIdx) => {
          if (ev._lockedEv) {
            if (isFinQuestion) {
              scoredHits.push({ p, ev, evIdx, score: 18, lockedFinNode: true });
            }
            return;
          }
          const pm = ev.pivotMeta || {};
          const hay = [
            ev.title, ev.summary, ev.metrics, ev.docs, ev.note, ev.phase, ev.date, ev.rocDate,
            pm.fromPlan, pm.trigger, pm.toDecision, pm.delta, pm.budgetTag
          ].join(" ").toLowerCase();

          let score = 0;
          terms.forEach(t => {
            if (t.length >= 2 && hay.includes(t)) {
              score += (ev.title || "").toLowerCase().includes(t) ? 9 : 4;
              if ((pm.trigger || "").toLowerCase().includes(t) || (pm.toDecision || "").toLowerCase().includes(t)) score += 6;
            }
          });
          if (/為什麼|原因|當初|取消|改採|轉折|拍板/.test(ql) && ev.pivotMeta) score += 7;
          if (/哪時候|何時|時間|日期|拍板/.test(ql) && ev.isKey) score += 4;
          if (mentionedPjs.some(mp => mp.id === p.id)) score += 5;

          if (score > 0) scoredHits.push({ p, ev, evIdx, score, lockedFinNode: false });
        });
      });

      scoredHits.sort((a, b) => b.score - a.score);
      const isComparison = mentionedPjs.length >= 2 || (/差在哪|比較|對照|兩案|各案/.test(ql) && targetPjs.length >= 2);

      closeJarvisHud();
      renderJarvisDockAndFly(rawQuery, {
        isComparison,
        isFinQuestion,
        anyTargetFinLocked,
        targetPjs: isComparison ? (mentionedPjs.length >= 2 ? mentionedPjs : targetPjs.slice(0, 3)) : (scoredHits[0] ? [scoredHits[0].p] : targetPjs.slice(0, 1)),
        hits: scoredHits.slice(0, 5)
      });
    }

    function loadPdfJsEngine() {
      if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
      return new Promise(resolve => {
        const sc = document.createElement("script");
        sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
        sc.onload = () => {
          if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
            resolve(window.pdfjsLib);
          } else resolve(null);
        };
        sc.onerror = () => resolve(null);
        document.head.appendChild(sc);
      });
    }

    function renderSyntheticDocCoverDataUrl(fileName, meta, excerptLines) {
      const cv = document.createElement("canvas");
      cv.width = 760;
      cv.height = 1040;
      const ctx = cv.getContext("2d");

      // Crisp official A4 archival paper style with stamp & metadata header
      ctx.fillStyle = "#FAF8F5";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.strokeStyle = "#1E3A5F";
      ctx.lineWidth = 4;
      ctx.strokeRect(28, 28, cv.width - 56, cv.height - 56);
      ctx.strokeStyle = "#94A3B8";
      ctx.lineWidth = 1;
      ctx.strokeRect(36, 36, cv.width - 72, cv.height - 72);

      ctx.fillStyle = "#0F2942";
      ctx.fillRect(36, 36, cv.width - 72, 86);
      ctx.fillStyle = "#F8FAFC";
      ctx.font = "bold 22px 'Microsoft JhengHei', sans-serif";
      ctx.fillText("有興國際 · 原始公文／報告書首頁數位存證快照", 58, 76);
      ctx.fillStyle = "#7DD3FC";
      ctx.font = "15px Consolas, 'Microsoft JhengHei', sans-serif";
      ctx.fillText(`原始檔名：${fileName.slice(0, 44)}`, 58, 104);

      ctx.fillStyle = "#0F172A";
      ctx.font = "bold 24px 'Microsoft JhengHei', sans-serif";
      const titleTxt = (meta.title || fileName).slice(0, 26);
      ctx.fillText(titleTxt, 58, 172);

      const kv = [
        ["歸屬專案", meta.pjName || "自動辨識"],
        ["發文／核定日期", `${meta.date || ''}（民國 ${meta.rocDate || ''}）`],
        ["擷取文號／字號", meta.docNo || "詳內文摘錄"],
        ["關鍵量化數據", meta.metrics || "詳內文摘錄"]
      ];
      let y = 212;
      kv.forEach(([k, v]) => {
        ctx.fillStyle = "#E2E8F0";
        ctx.fillRect(58, y, cv.width - 116, 38);
        ctx.fillStyle = "#1E3A5F";
        ctx.font = "bold 15px 'Microsoft JhengHei', sans-serif";
        ctx.fillText(k, 70, y + 25);
        ctx.fillStyle = "#0F172A";
        ctx.font = "15px 'Microsoft JhengHei', sans-serif";
        ctx.fillText(String(v || "").slice(0, 38), 205, y + 25);
        y += 46;
      });

      ctx.fillStyle = "#334155";
      ctx.font = "bold 16px 'Microsoft JhengHei', sans-serif";
      ctx.fillText("【原始文件首頁關鍵內容摘錄】", 58, y + 26);
      y += 54;

      ctx.fillStyle = "#1E293B";
      ctx.font = "15px 'Microsoft JhengHei', sans-serif";
      excerptLines.slice(0, 18).forEach(ln => {
        const clean = String(ln).trim();
        if (!clean) return;
        for (let i = 0; i < clean.length && y < 945; i += 36) {
          ctx.fillText(clean.slice(i, i + 36), 62, y);
          y += 26;
        }
      });

      // Red archival seal
      ctx.save();
      ctx.translate(585, 895);
      ctx.rotate(-0.14);
      ctx.strokeStyle = "rgba(220, 38, 38, 0.78)";
      ctx.lineWidth = 3;
      ctx.strokeRect(-78, -32, 156, 64);
      ctx.fillStyle = "rgba(220, 38, 38, 0.82)";
      ctx.font = "bold 16px 'Microsoft JhengHei', sans-serif";
      ctx.fillText("JARVIS 原件存證", -64, -4);
      ctx.font = "13px Consolas, sans-serif";
      ctx.fillText(new Date().toISOString().slice(0, 10), -42, 18);
      ctx.restore();

      return cv.toDataURL("image/jpeg", 0.82);
    }

    async function extractPdfTextAndSnapshot(file) {
      const buf = await file.arrayBuffer();
      const pdfjs = await loadPdfJsEngine();
      if (pdfjs) {
        try {
          const doc = await pdfjs.getDocument({ data: new Uint8Array(buf) }).promise;
          const maxPages = Math.min(doc.numPages, 30);
          const pageTexts = [];
          let page1DataUrl = "";

          for (let pNo = 1; pNo <= maxPages; pNo++) {
            const page = await doc.getPage(pNo);
            if (pNo === 1) {
              const vp0 = page.getViewport({ scale: 1 });
              const scale = Math.min(1.8, 1060 / Math.max(1, vp0.height));
              const vp = page.getViewport({ scale });
              const cv = document.createElement("canvas");
              cv.width = Math.round(vp.width);
              cv.height = Math.round(vp.height);
              const ctx = cv.getContext("2d");
              ctx.fillStyle = "#FFFFFF";
              ctx.fillRect(0, 0, cv.width, cv.height);
              await page.render({ canvasContext: ctx, viewport: vp }).promise;
              page1DataUrl = cv.toDataURL("image/jpeg", 0.82);
            }
            const tc = await page.getTextContent();
            const txt = tc.items.map(it => it.str).join(" ");
            if (txt.trim()) pageTexts.push(txt);
          }
          return { text: pageTexts.join("\n"), snapshotDataUrl: page1DataUrl, pageCount: doc.numPages };
        } catch (e) {}
      }

      // Offline fallback if CDN unreachable: ask nas_server /api/parse_doc or decode printable UTF-8/Latin strings
      let fallbackText = "";
      if (nasServerActive) {
        try {
          const b64 = VaultCrypto.toB64(new Uint8Array(buf));
          const r = await fetch("/api/parse_doc", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fileName: file.name, dataB64: b64 })
          });
          const j = await r.json();
          if (j && j.ok && j.text) fallbackText = j.text;
        } catch (e) {}
      }
      if (!fallbackText) {
        fallbackText = new TextDecoder("utf-8", { fatal: false }).decode(new Uint8Array(buf)).replace(/[^\u4e00-\u9fa5A-Za-z0-9.,:/\-()（）%㎡m³\s]/g, " ");
      }
      return { text: fallbackText, snapshotDataUrl: "", pageCount: 1 };
    }

    async function extractDocxTextAndSnapshot(file) {
      const buf = await file.arrayBuffer();
      let fullText = "";
      try {
        const entries = await unzipXlsxEntries(buf);
        const rawXml = entries["word/document.xml"];
        if (rawXml) {
          const xmlStr = typeof rawXml === "string" ? rawXml : new TextDecoder("utf-8").decode(rawXml);
          const dom = new DOMParser().parseFromString(xmlStr, "application/xml");
          const paras = Array.from(dom.getElementsByTagNameNS("*", "p")).map(p =>
            Array.from(p.getElementsByTagNameNS("*", "t")).map(t => t.textContent).join("")
          ).filter(Boolean);
          fullText = paras.join("\n");
        }
      } catch (e) {}

      if (!fullText && nasServerActive) {
        try {
          const b64 = VaultCrypto.toB64(new Uint8Array(buf));
          const r = await fetch("/api/parse_doc", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fileName: file.name, dataB64: b64 })
          });
          const j = await r.json();
          if (j && j.ok && j.text) fullText = j.text;
        } catch (e) {}
      }

      return { text: fullText, snapshotDataUrl: "", pageCount: 1 };
    }

    function analyzeOfficialDocumentToDraft(fileName, rawText, authProjects) {
      const cleanName = fileName.replace(/\.[^.]+$/, "");
      const combined = `${cleanName}\n${rawText || ""}`;
      const lower = combined.toLowerCase();

      // 1. Auto-identify target project
      let bestPj = null;
      let bestScore = -1;
      const pjKeywords = {
        "machouhou": ["馬稠後", "朴子", "鹿草", "1-2-2", "新庄段", "佳禾小段", "食品廠", "欣陽", "冷鏈"],
        "gangshan": ["岡山", "鹽埔", "81-2", "白米里", "典寶溪", "央廚", "51巷", "預鑄槽"],
        "daliao": ["大寮", "上寮", "世峯", "鋐毅", "頂樓", "台科電", "建字第35號"],
        "renyi": ["仁義", "仁怡", "仁武", "灣內", "余公館", "危老", "老透天"]
      };

      authProjects.forEach(p => {
        let sc = 0;
        if (p.shortName && combined.includes(p.shortName)) sc += 25;
        if (p.code && lower.includes(p.code.toLowerCase())) sc += 20;
        (pjKeywords[p.id] || []).forEach(kw => {
          if (lower.includes(kw.toLowerCase())) sc += 12;
        });
        if (p.location) {
          p.location.split(/[（()）、，\s]+/).filter(x => x.length >= 3).forEach(tok => {
            if (combined.includes(tok)) sc += 8;
          });
        }
        if (sc > bestScore) { bestScore = sc; bestPj = p; }
      });
      if (!bestPj) bestPj = getCurrentProject() || authProjects[0];

      // 2. Extract Date (ROC 民國 or Western)
      let westDate = "";
      let rocDate = "";
      const mRocFull = combined.match(/(?:中華民國|民國)?\s*(1[012]\d)\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
      const mRocSlash = combined.match(/\b(1[012]\d)[./](\d{1,2})(?:[./](\d{1,2}))?\b/);
      const mWest = combined.match(/\b(202\d)[./\-年](\d{1,2})(?:[./\-月](\d{1,2}))?/);
      const mRocCompact = combined.match(/(?:^|[^0-9])(1[012]\d)(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(?:[^0-9]|$)/);
      const mWestCompact = combined.match(/(?:^|[^0-9])(202\d)(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(?:[^0-9]|$)/);

      if (mRocFull) {
        const ry = parseInt(mRocFull[1], 10), rm = String(mRocFull[2]).padStart(2, "0"), rd = String(mRocFull[3]).padStart(2, "0");
        westDate = `${ry + 1911}-${rm}`;
        rocDate = `${ry}/${rm}/${rd}`;
      } else if (mWest) {
        const wy = parseInt(mWest[1], 10), wm = String(mWest[2]).padStart(2, "0");
        const wd = mWest[3] ? `/${String(mWest[3]).padStart(2, "0")}` : "";
        westDate = `${wy}-${wm}`;
        rocDate = `${wy - 1911}/${wm}${wd}`;
      } else if (mRocSlash) {
        const ry = parseInt(mRocSlash[1], 10), rm = String(mRocSlash[2]).padStart(2, "0");
        const rd = mRocSlash[3] ? `/${String(mRocSlash[3]).padStart(2, "0")}` : "";
        westDate = `${ry + 1911}-${rm}`;
        rocDate = `${ry}/${rm}${rd}`;
      } else if (mRocCompact) {
        const ry = parseInt(mRocCompact[1], 10), rm = mRocCompact[2], rd = mRocCompact[3];
        westDate = `${ry + 1911}-${rm}`;
        rocDate = `${ry}/${rm}/${rd}`;
      } else if (mWestCompact) {
        const wy = parseInt(mWestCompact[1], 10), wm = mWestCompact[2], wd = mWestCompact[3];
        westDate = `${wy}-${wm}`;
        rocDate = `${wy - 1911}/${wm}/${wd}`;
      } else {
        const now = new Date();
        const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        westDate = ym;
        rocDate = `${now.getFullYear() - 1911}/${String(now.getMonth() + 1).padStart(2, "0")}`;
      }

      // 3. Extract Official Permit / Document Number (核准文號)
      const docNoMatch = combined.match(/([\u4e00-\u9fa5]{2,10}字第\s*[0-9A-Za-z\-號]{5,22}號|\(\d{2,3}\)[\u4e00-\u9fa5]{1,8}建字第\s*\d+\s*號|契約編號[：:\s]*[A-Za-z0-9\-]+)/);
      const docNo = docNoMatch ? docNoMatch[1].replace(/\s+/g, "") : "";

      // 4. Extract Quantitative Engineering / Hydraulic / Financial Metrics (滯洪量 / 流量 / 面積 / 金額 / 床位)
      const metricTokens = [];
      if (docNo) metricTokens.push(docNo);

      const mDetention = combined.match(/(?:滯洪量|滯洪體積|滯洪池容量|調節體積)[^\d]{0,8}([0-9,.]+\s*(?:m3|m³|立方公尺|噸))/i);
      if (mDetention) metricTokens.push(`滯洪量 ${mDetention[1].replace(/\s+/g, " ")}`);

      const mPeak = combined.match(/(?:洪峰流量|排放流量|容許出流|削減率)[^\d]{0,8}([0-9,.]+\s*(?:cms|m³\/s|%))/i);
      if (mPeak) metricTokens.push(`水理指標 ${mPeak[1]}`);

      const mArea = combined.match(/(?:基地面積|總樓地板面積|核准面積)[^\d]{0,8}([0-9,.]+\s*(?:㎡|平方公尺|坪|公頃))/);
      if (mArea) metricTokens.push(`面積 ${mArea[1]}`);

      const mMoney = combined.match(/(?:核准|授信|總價|合約金額|預算|貸款|工程費)[^\d]{0,8}([0-9,.]+\s*(?:億元|億|萬元|萬)|NT\$\s*[0-9,]+)/);
      if (mMoney) metricTokens.push(mMoney[1].replace(/\s+/g, " "));
      else {
        const mAnyCurr = combined.match(/[0-9][0-9,.]*\s*(?:億元|億|萬元)/);
        if (mAnyCurr && metricTokens.length < 3) metricTokens.push(mAnyCurr[0]);
      }

      const mWorkers = combined.match(/([0-9,]+\s*(?:名移工|床|人份|日曆天))/);
      if (mWorkers && metricTokens.length < 3) metricTokens.push(mWorkers[1]);

      const metricsStr = metricTokens.slice(0, 3).join("｜") || "已納管公文原件與首頁快照";

      // 5. Infer Phase & Title & Summary
      let phase = "建照與圖審";
      if (/授信|貸款|銀行|合庫|融資|撥款/.test(combined)) phase = "財務與決策";
      else if (/出流管制|水理|建築執照|建照|使用執照|都審|消防|下水道/.test(combined)) phase = "建照與圖審";
      else if (/契約|合約|報價|決標|發包|承攬/.test(combined)) phase = "技師與營造發包";
      else if (/驗收|竣工|會勘|結算/.test(combined)) phase = "施工與驗收";
      else if (/招募|引進|選工|認證|委任/.test(combined)) phase = "招募許可與配額";
      else if (/函覆|申報|評鑑/.test(combined)) phase = "機關公文函覆";

      const headlineClean = cleanName.replace(/^[0-9_\-\s]+/, "").slice(0, 34);
      const title = docNo
        ? `取得《${headlineClean}》（${docNo}）`
        : `完成《${headlineClean}》審查與歸檔`;

      const lines = (rawText || "")
        .split(/[\r\n]+/)
        .map(s => s.replace(/\s+/g, " ").trim())
        .filter(s => s.length >= 10);
      const keyBody = lines.slice(0, 4).join("；").slice(0, 210);
      const summary = keyBody
        ? `依據《${cleanName}》自動建檔${docNo ? `（文號：${docNo}）` : ""}。重點摘錄：${keyBody}。`
        : `已匯入《${cleanName}》${docNo ? `（${docNo}）` : ""}並鎖定公文首頁存證快照。`;

      const isSecret = /授信|貸款|融資|薪資|獵才|考績/.test(combined);

      return {
        pjId: bestPj.id,
        pjName: bestPj.shortName,
        fileName,
        date: westDate,
        rocDate,
        phase,
        title,
        summary,
        metrics: metricsStr,
        docNo,
        docs: docNo ? `${cleanName}（${docNo}）` : cleanName,
        isKey: true,
        isSecret,
        excerptLines: lines.length ? lines : [summary]
      };
    }

    async function handleJarvisDroppedDocument(file) {
      ensureJarvisDomAndCss();
      const authProjects = projects.filter(p =>
        (typeof canAccessProjectByDept !== "function" || canAccessProjectByDept(p)) &&
        !(p._locked && p.secMode === "full")
      );
      if (!authProjects.length) {
        openUnlockModal("", () => handleJarvisDroppedDocument(file));
        return;
      }

      openJarvisHud();
      const host = document.getElementById("jarvisIngestPreviewHost");
      if (host) {
        host.innerHTML = `
          <div style="padding:16px;border-radius:16px;background:rgba(56,189,248,0.10);border:1px solid rgba(56,189,248,0.4);color:#7DD3FC;font-weight:700;text-align:center;">
            ⚡ JARVIS 正在讀取《${esc(file.name)}》、自動辨識歸屬專案並擷取公文首頁快照...
          </div>
        `;
      }

      const lowerName = file.name.toLowerCase();
      let extracted = { text: "", snapshotDataUrl: "", pageCount: 1 };

      try {
        if (lowerName.endsWith(".pdf")) {
          extracted = await extractPdfTextAndSnapshot(file);
        } else if (lowerName.endsWith(".docx")) {
          extracted = await extractDocxTextAndSnapshot(file);
        } else if (/\.(png|jpe?g|webp)$/i.test(lowerName)) {
          const dataUrl = await new Promise((res, rej) => {
            const fr = new FileReader();
            fr.onload = () => res(fr.result);
            fr.onerror = rej;
            fr.readAsDataURL(file);
          });
          extracted = { text: file.name, snapshotDataUrl: dataUrl, pageCount: 1 };
        } else {
          extracted = { text: await file.text(), snapshotDataUrl: "", pageCount: 1 };
        }
      } catch (err) {
        extracted = { text: file.name, snapshotDataUrl: "", pageCount: 1 };
      }

      // If scanned PDF or image has minimal selectable text, run NAS OCR on page-1 snapshot automatically!
      if (nasServerActive && extracted.snapshotDataUrl && (extracted.text || "").trim().length < 24) {
        try {
          const r = await fetch("/api/ocr", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dataUrl: extracted.snapshotDataUrl })
          });
          const j = await r.json();
          if (j && j.ok && j.text) extracted.text = `${extracted.text || ""}\n${j.text}`.trim();
        } catch (e) {}
      }

      const draft = analyzeOfficialDocumentToDraft(file.name, extracted.text, authProjects);
      if (!extracted.snapshotDataUrl) {
        extracted.snapshotDataUrl = renderSyntheticDocCoverDataUrl(file.name, draft, draft.excerptLines);
      }
      draft.snapshotDataUrl = extracted.snapshotDataUrl;
      draft.pageCount = extracted.pageCount || 1;
      _jarvisPendingDocDraft = draft;

      renderJarvisIngestPreviewCard(draft, authProjects);
    }

    async function commitJarvisIngestedDocument() {
      const d = _jarvisPendingDocDraft;
      if (!d) return;
      const pjId = document.getElementById("jd_pjid").value;
      const p = projects.find(x => x.id === pjId);
      if (!p) return;

      let photoEntry = {
        id: "ph-" + Date.now(),
        dataUrl: d.snapshotDataUrl,
        caption: `📄《${d.fileName}》公文首頁存證快照`,
        stageLabel: "公文原件首頁"
      };

      // Upload snapshot to NAS /api/media automatically if connected to Synology NAS!
      if (nasServerActive && d.snapshotDataUrl && d.snapshotDataUrl.startsWith("data:image/")) {
        try {
          const resp = await fetch("/api/media", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dataUrl: d.snapshotDataUrl, ext: "jpg" })
          });
          const rj = await resp.json();
          if (rj && rj.ok && rj.url) {
            const fn = rj.url.split("/").pop();
            photoEntry = {
              id: "ph-" + Date.now(),
              nasUrl: rj.url,
              standaloneUrl: `./有興國際_NAS多人同步伺服器/data/media/${fn}`,
              caption: `📄《${d.fileName}》公文首頁存證快照`,
              stageLabel: "公文原件首頁"
            };
          }
        } catch (e) {}
      }

      const newEv = {
        id: "ev-" + Date.now(),
        _ver: 1,
        _touchedAt: Date.now(),
        date: document.getElementById("jd_date").value.trim() || d.date,
        rocDate: document.getElementById("jd_roc").value.trim() || d.rocDate,
        phase: document.getElementById("jd_phase").value.trim() || d.phase,
        isKey: true,
        isSecret: !!d.isSecret,
        title: document.getElementById("jd_title").value.trim() || d.title,
        summary: document.getElementById("jd_summary").value.trim() || d.summary,
        metrics: document.getElementById("jd_metrics").value.trim() || d.metrics,
        docs: d.docs,
        docLinks: {},
        photos: [photoEntry],
        pivotMeta: null,
        note: "由 JARVIS 公文智慧引擎自動解析建檔並鎖定首頁快照"
      };

      if (!Array.isArray(p.events)) p.events = [];
      p.events.push(newEv);
      if (typeof recordLocalItemRevision === "function") {
        recordLocalItemRevision("event", "JARVIS 公文自動建檔", p, null, newEv);
      }

      commitStore(true);
      if (nasServerActive) {
        const diskSafe = serializeStoreForDisk("encrypted");
        const diskP = diskSafe.projects.find(x => x.id === p.id);
        if (p.secMode === "full" && diskP) {
          nasSendOp({ op: "upsert_project", overwriteEvents: true, project: diskP });
        } else {
          const diskEv = diskP && (diskP.events || []).find(x => x.id === newEv.id);
          if (diskEv) nasSendOp({ op: "upsert_event", pjId: p.id, baseEvVer: 1, event: diskEv });
        }
      }

      _jarvisPendingDocDraft = null;
      closeJarvisHud();
      refreshAllLayers();
      flyStageToJarvisEvidence(p.id, newEv.id);
      toastMsg(`⚡ 已將《${d.fileName}》煉成「${p.shortName}」履歷節點並鎖定公文首頁快照！`);
    }

    function renderProgressHaloSvg(pctRaw, statusColor) {
      const pct = Math.max(0, Math.min(100, Number(pctRaw) || 0));
      const r = 25;
      const circ = +(2 * Math.PI * r).toFixed(2);
      const offset = +(circ * (1 - pct / 100)).toFixed(2);
      const strokeMap = {
        green: "#2DD4BF",
        teal: "#2DD4BF",
        amber: "#FBBF24",
        purple: "#A78BFA",
        blue: "#38BDF8"
      };
      const stroke = strokeMap[statusColor] || "#38BDF8";
      return `
        <svg width="64" height="64" viewBox="0 0 64 64" style="flex-shrink:0;" aria-label="進度 ${pct}%">
          <circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="5.5" />
          <circle cx="32" cy="32" r="${r}" fill="none" stroke="${stroke}" stroke-width="5.5"
            stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
            transform="rotate(-90 32 32)" />
          <text x="32" y="36" text-anchor="middle" fill="currentColor" font-size="14" font-weight="800" font-family="ui-monospace, Consolas, monospace">${pct}%</text>
        </svg>
      `;
    }

    function getCurrentCheckinTimestamps() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mi = String(now.getMinutes()).padStart(2, "0");
      return {
        westYm: `${yyyy}-${mm}`,
        rocYmd: `${yyyy - 1911}/${mm}/${dd}`,
        hhmm: `${hh}:${mi}`
      };
    }

    async function compressFileToLightweightWebp(file, maxBytes = 285 * 1024) {
      const rawDataUrl = await new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });

      const img = await new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = reject;
        im.src = rawDataUrl;
      });

      let bestDataUrl = rawDataUrl;
      for (const maxDim of [1560, 1240, 960]) {
        const ratio = Math.min(1, maxDim / Math.max(1, img.width, img.height));
        const w = Math.max(1, Math.round(img.width * ratio));
        const h = Math.max(1, Math.round(img.height * ratio));
        const cv = document.createElement("canvas");
        cv.width = w;
        cv.height = h;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        for (const q of [0.80, 0.68, 0.56, 0.44]) {
          let cand = cv.toDataURL("image/webp", q);
          if (!cand.startsWith("data:image/webp")) {
            cand = cv.toDataURL("image/jpeg", q);
          }
          bestDataUrl = cand;
          const approxBytes = Math.round((cand.length - cand.indexOf(",") - 1) * 0.75);
          if (approxBytes <= maxBytes) {
            return { dataUrl: cand, sizeKb: Math.max(1, Math.round(approxBytes / 1024)) };
          }
        }
      }
      const approx = Math.round((bestDataUrl.length - bestDataUrl.indexOf(",") - 1) * 0.75);
      return { dataUrl: bestDataUrl, sizeKb: Math.max(1, Math.round(approx / 1024)) };
    }

    async function onMfcFilesSelected(fileList) {
      if (!fileList || !fileList.length) return;
      const incoming = Array.from(fileList).filter(f => f.type.startsWith("image/"));
      if (!incoming.length) return;

      for (const f of incoming) {
        if (_mfcPendingPhotos.length >= 2) {
          toastMsg("最多精選 2 張關鍵現場照片");
          break;
        }
        try {
          const compressed = await compressFileToLightweightWebp(f, 285 * 1024);
          _mfcPendingPhotos.push({
            id: "mfc-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
            name: f.name || "現場照片",
            dataUrl: compressed.dataUrl,
            sizeKb: compressed.sizeKb
          });
        } catch (err) {
          toastMsg("⚠️ 照片讀取失敗，請重試");
        }
      }
      renderMfcPreviewGrid();
    }

    function inferFieldCheckinPhase(note) {
      if (/會勘|建照|使照|都審|消防|出流|水保|核發|核准|掛件/.test(note)) return "建照與圖審";
      if (/灌漿|鋼筋|開挖|模板|吊裝|施工|驗收|竣工|查驗|修繕|進場/.test(note)) return "施工與驗收";
      if (/發包|決標|簽約|報價|評選/.test(note)) return "技師與營造發包";
      if (/移工|宿舍|床位|入國|體檢/.test(note)) return "現場查核與營運";
      return "現場進度打卡";
    }

    async function submitMobileFieldCheckin() {
      const pjSel = document.getElementById("mfcPjSelect");
      const noteEl = document.getElementById("mfcNoteInput");
      const submitBtn = document.getElementById("mfcSubmitBtn");
      if (!pjSel) return;

      const p = projects.find(x => x.id === pjSel.value);
      if (!p) return;

      const rawNote = (noteEl ? noteEl.value : "").trim();
      if (!rawNote && !_mfcPendingPhotos.length) {
        toastMsg("請先拍一張現場照片或輸入一行說明！");
        if (noteEl) noteEl.focus();
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ 正在壓縮 WebP 並同步至伺服器...";
      }

      const ts = getCurrentCheckinTimestamps();
      const finalPhotos = [];

      for (let i = 0; i < _mfcPendingPhotos.length; i++) {
        const ph = _mfcPendingPhotos[i];
        let uploaded = null;
        if (typeof nasServerActive !== "undefined" && nasServerActive) {
          try {
            const resp = await fetch("/api/media", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                dataUrl: ph.dataUrl,
                toWebp: true,
                maxKb: 300
              })
            });
            const rj = await resp.json();
            if (rj && rj.ok && rj.url) {
              const fn = rj.url.split("/").pop();
              uploaded = {
                id: "ph-" + Date.now() + "-" + i,
                nasUrl: rj.url,
                standaloneUrl: `./有興國際_NAS多人同步伺服器/data/media/${fn}`,
                caption: rawNote ? rawNote.slice(0, 28) : `現場打卡照 (${ts.rocYmd})`,
                stageLabel: "現場打卡"
              };
            }
          } catch (e) {}
        }
        if (!uploaded) {
          uploaded = {
            id: "ph-" + Date.now() + "-" + i,
            dataUrl: ph.dataUrl,
            caption: rawNote ? rawNote.slice(0, 28) : `現場打卡照 (${ts.rocYmd})`,
            stageLabel: "現場打卡"
          };
        }
        finalPhotos.push(uploaded);
      }

      const cleanOneLiner = rawNote || "現場施工／會勘進度拍照打卡紀錄";
      const conciseTitle = cleanOneLiner.length <= 32
        ? cleanOneLiner
        : cleanOneLiner.split(/[。；！？\n]/)[0].slice(0, 34);
      const isKeyCheckin = /通過|核准|核發|完成|決標|定案|上樑|竣工/.test(cleanOneLiner);

      const newEv = {
        id: "ev-" + Date.now(),
        _ver: 1,
        _touchedAt: Date.now(),
        isFieldCheckin: true,
        date: ts.westYm,
        rocDate: ts.rocYmd,
        phase: inferFieldCheckinPhase(cleanOneLiner),
        isKey: isKeyCheckin,
        isSecret: false,
        title: conciseTitle,
        summary: `${cleanOneLiner}（現場打卡時間：民國 ${ts.rocYmd} ${ts.hhmm}）`,
        metrics: finalPhotos.length ? `現場實況打卡 · ${finalPhotos.length} 張 WebP 輕量照片` : `現場實況打卡 (${ts.hhmm})`,
        docs: "",
        docLinks: {},
        photos: finalPhotos,
        pivotMeta: null,
        note: `手機現場打卡直傳（${ts.rocYmd} ${ts.hhmm}）`
      };

      if (!Array.isArray(p.events)) p.events = [];
      // Insert directly at the very front of the timeline!
      p.events.unshift(newEv);

      if (typeof recordLocalItemRevision === "function") {
        recordLocalItemRevision("event", "手機現場打卡", p, null, newEv);
      }

      commitStore(true);
      if (typeof nasServerActive !== "undefined" && nasServerActive) {
        const diskSafe = serializeStoreForDisk("encrypted");
        const diskP = diskSafe.projects.find(x => x.id === p.id);
        if (p.secMode === "full" && diskP) {
          await nasSendOp({ op: "upsert_project", overwriteEvents: true, project: diskP });
        } else {
          const diskEv = diskP && (diskP.events || []).find(x => x.id === newEv.id);
          if (diskEv) await nasSendOp({ op: "upsert_event", pjId: p.id, baseEvVer: 1, event: diskEv });
        }
      }

      _mfcPendingPhotos = [];
      closeMobileFieldCheckin();

      if (window._yxMobileMode) {
        openMobileProjectTimeline(p.id, false);
        setTimeout(() => {
          const cardEl = document.getElementById("mob-ev-" + newEv.id);
          if (cardEl) cardEl.classList.add("yx-amber-box-pulse");
        }, 60);
      } else {
        openDetailForEvent(p.id, newEv.id);
      }
      toastMsg(`✓ 已將現場打卡插入「${p.shortName}」時間軸最前端並同步全公司！`);
    }

    /* ==========================================================================
       PART 3: 🔍 FULL-DB PENETRATING DEEP SEARCH + AMBER HIGHLIGHT PULSE
       ========================================================================== */
    function escapeRegExpV19(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function buildSnippetWithInlineMark(fullText, rawQuery, radius = 42) {
      const txt = String(fullText || "").replace(/\s+/g, " ").trim();
      if (!txt) return "";
      const terms = rawQuery.trim().split(/\s+/).filter(Boolean);
      if (!terms.length) return esc(txt.slice(0, 90));

      const lower = txt.toLowerCase();
      let firstPos = -1;
      for (const t of terms) {
        const idx = lower.indexOf(t.toLowerCase());
        if (idx >= 0 && (firstPos < 0 || idx < firstPos)) firstPos = idx;
      }
      const start = firstPos > radius ? firstPos - radius : 0;
      const end = Math.min(txt.length, (firstPos >= 0 ? firstPos : 0) + radius * 2);
      const slice = (start > 0 ? "…" : "") + txt.slice(start, end) + (end < txt.length ? "…" : "");

      const pattern = new RegExp("(" + terms.map(escapeRegExpV19).join("|") + ")", "gi");
      return slice.split(pattern).map((part, i) =>
        i % 2 === 1 ? `<mark class="yx-amber-inline">${esc(part)}</mark>` : esc(part)
      ).join("");
    }

    function collectDeepSearchHits(rawQuery) {
      const qTrim = String(rawQuery || "").trim();
      if (!qTrim) return [];
      const terms = qTrim.toLowerCase().split(/\s+/).filter(Boolean);
      const matchesAll = text => {
        const hay = String(text || "").toLowerCase();
        return terms.every(t => hay.includes(t));
      };

      const hits = [];

      (projects || []).forEach(p => {
        if (typeof canAccessProjectByDept === "function" && !canAccessProjectByDept(p)) return;
        if (p._locked && p.secMode === "full") return;
        const finLocked = !!(p._locked && p.secMode === "finance");
        const maskIfFin = s => finLocked ? maskCurrencyText(s || "") : String(s || "");

        // --- A. Project-Layer Penetrating Fields ---
        const siteGeoParcel = (typeof getProjectSiteGeo === "function" && getProjectSiteGeo(p)?.parcelLabel) || "";
        const unlockedQids = (p.quickIds || []).filter(qi => !(finLocked && (qi.isFinSecret || hasCurrencyText(qi.v))));

        const parcelQids = unlockedQids.filter(qi => /地號|基地|坐落|門牌|區位/.test(qi.k)).map(qi => `${qi.k}：${qi.v}`).join("｜");
        const partnerQids = unlockedQids.filter(qi => /建築師|技師|營造|廠商|設計|監造/.test(qi.k)).map(qi => `${qi.k}：${qi.v}`).join("｜");
        const loanQids = !finLocked
          ? unlockedQids.filter(qi => /授信|合庫|銀行|貸款|融資|利率|成數/.test(qi.k)).map(qi => `${qi.k}：${qi.v}`).join("｜")
          : "";

        const pjBuckets = [
          {
            badge: `[${p.shortName} · 專案地號]`,
            title: `${p.code} · ${p.fullName || p.shortName}`,
            text: [p.location, siteGeoParcel, parcelQids].filter(Boolean).join("｜"),
            targetTab: (p.location && matchesAll(p.location)) ? "dossier" : (parcelQids && matchesAll(parcelQids) ? "quickid" : "dossier")
          },
          {
            badge: `[${p.shortName} · 合作廠商]`,
            title: `${p.code} · 合作建築師／技師／廠商團隊`,
            text: [p.partners, partnerQids].filter(Boolean).join("｜"),
            targetTab: (p.partners && matchesAll(p.partners)) ? "dossier" : (partnerQids ? "quickid" : "dossier")
          },
          {
            badge: `[${p.shortName} · 專案全銜]`,
            title: `${p.code} · ${p.fullName || p.shortName}`,
            text: [p.code, p.shortName, p.fullName, p.leadDept, ...(p.sharedDepts || []), p.scale].filter(Boolean).join("｜"),
            targetTab: "dossier"
          },
          {
            badge: `[${p.shortName} · 戰略轉折摘要]`,
            title: `${p.code} · 核心戰略轉折與待辦`,
            text: [maskIfFin(p.pivotSummary), maskIfFin(p.nextSteps), maskIfFin(p.microTag)].filter(Boolean).join("｜"),
            targetTab: "dossier"
          }
        ];

        if (!finLocked) {
          pjBuckets.push(
            {
              badge: `[${p.shortName} · 合庫／授信條件]`,
              title: `${p.code} · 銀行授信條件與融資結構`,
              text: [p.finance, loanQids].filter(Boolean).join("｜"),
              targetTab: (p.finance && matchesAll(p.finance)) ? "dossier" : (loanQids ? "quickid" : "dossier")
            },
            {
              badge: `[${p.shortName} · 預算金額]`,
              title: `${p.code} · 預算金額與關鍵指標`,
              text: [p.heroNum, p.budget, ...(p.quickStats || []).map(s => `${s.k}:${s.v}`)].filter(Boolean).join("｜"),
              targetTab: "dossier"
            }
          );
        }

        // Remaining Quick IDs (e.g. 免出流管制, 建照字號, etc.)
        const otherQids = unlockedQids.filter(qi => !/地號|基地|坐落|門牌|區位|建築師|技師|營造|廠商|設計|監造|授信|合庫|銀行|貸款|融資|利率|成數/.test(qi.k));
        otherQids.forEach(qi => {
          pjBuckets.push({
            badge: `[${p.shortName} · 速查(${qi.k})]`,
            title: `${p.code} · ${qi.k}`,
            text: `${qi.k}：${qi.v}`,
            targetTab: "quickid"
          });
        });

        pjBuckets.forEach(b => {
          if (b.text && matchesAll(b.text)) {
            hits.push({
              kind: "project",
              pjId: p.id,
              badge: b.badge,
              title: b.title,
              snippetHtml: buildSnippetWithInlineMark(b.text, qTrim),
              targetTab: b.targetTab,
              query: qTrim
            });
          }
        });

        // --- B. Milestone / Node-Layer Penetrating Fields ---
        const sorted = getSortedEvents(p);
        sorted.forEach((ev, idx) => {
          if (ev._lockedEv) return;
          const maskEv = s => (finLocked || ev._lockedEvFields) ? maskCurrencyText(s || "") : String(s || "");
          const nodeNo = idx + 1;

          const docKeys = Object.keys(ev.docLinks || {}).join(" ");
          const docsField = maskEv([ev.docs, docKeys].filter(Boolean).join("｜"));
          const titleField = maskEv(ev.title);
          const metricsField = maskEv(ev.metrics);
          const pmText = ev.pivotMeta
            ? maskEv([ev.pivotMeta.fromPlan, ev.pivotMeta.trigger, ev.pivotMeta.toDecision, ev.pivotMeta.delta].filter(Boolean).join("｜"))
            : "";
          const summaryField = [maskEv(ev.summary), maskEv(ev.note), pmText].filter(Boolean).join("｜");
          const combinedEv = [titleField, docsField, metricsField, summaryField, ev.date, ev.rocDate, ev.phase].join(" ");

          if (!matchesAll(combinedEv)) return;

          let srcSuffix = "紀要";
          let bestText = summaryField || titleField;
          if (docsField && matchesAll(docsField)) {
            srcSuffix = "公文";
            bestText = `${docsField} — ${summaryField}`;
          } else if (/字第\s*[0-9A-Za-z\-]+號/.test(combinedEv) && (matchesAll(titleField) || matchesAll(metricsField))) {
            srcSuffix = "公文";
            bestText = [metricsField, titleField, docsField].filter(Boolean).join("｜");
          } else if (titleField && matchesAll(titleField)) {
            srcSuffix = "標題";
            bestText = `${titleField} — ${summaryField}`;
          } else if (metricsField && matchesAll(metricsField)) {
            srcSuffix = "指標";
            bestText = `${metricsField} — ${summaryField}`;
          }

          hits.push({
            kind: "event",
            pjId: p.id,
            evId: ev.id,
            nodeNo,
            date: ev.date,
            rocDate: ev.rocDate,
            badge: `[${p.shortName}第${nodeNo}節點${srcSuffix}]`,

    function clearExistingAmberHighlights() {
      if (_amberPulseClearTimer) {
        clearTimeout(_amberPulseClearTimer);
        _amberPulseClearTimer = null;
      }
      document.querySelectorAll(".yx-amber-box-pulse").forEach(el => el.classList.remove("yx-amber-box-pulse"));
      document.querySelectorAll("mark.yx-amber-pulse").forEach(m => {
        const parent = m.parentNode;
        if (parent) {
          parent.replaceChild(document.createTextNode(m.textContent), m);
          parent.normalize();
        }
      });
    }

    function applyAmberHighlightPulseInContainer(rootEl, rawQuery) {
      if (!rootEl || !rawQuery) return;
      clearExistingAmberHighlights();

      const terms = String(rawQuery).trim().split(/\s+/).filter(Boolean);
      if (!terms.length) return;
      const regex = new RegExp("(" + terms.map(escapeRegExpV19).join("|") + ")", "gi");

      const textNodes = [];
      const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          const pTag = node.parentElement ? node.parentElement.tagName : "";
          if (pTag === "SCRIPT" || pTag === "STYLE" || pTag === "MARK") return NodeFilter.FILTER_REJECT;
          regex.lastIndex = 0;
          return regex.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      let firstMark = null;
      textNodes.forEach(tNode => {
        const val = tNode.nodeValue;
        regex.lastIndex = 0;
        const parts = val.split(regex);
        if (parts.length <= 1) return;
        const frag = document.createDocumentFragment();
        parts.forEach((pt, idx) => {
          if (!pt) return;
          if (idx % 2 === 1) {
            const mk = document.createElement("mark");
            mk.className = "yx-amber-pulse";
            mk.textContent = pt;
            if (!firstMark) firstMark = mk;
            frag.appendChild(mk);
          } else {
            frag.appendChild(document.createTextNode(pt));
          }
        });
        if (tNode.parentNode) tNode.parentNode.replaceChild(frag, tNode);
      });

      if (firstMark) {
        const blockEl = firstMark.closest("article, .id-copy-chip, p, div");
        if (blockEl && blockEl !== rootEl) blockEl.classList.add("yx-amber-box-pulse");
        setTimeout(() => {
          try {
            firstMark.scrollIntoView({ behavior: "smooth", block: "center" });
          } catch (e) {
            firstMark.scrollIntoView();
          }
        }, 50);
      } else {
        rootEl.classList.add("yx-amber-box-pulse");
      }

      _amberPulseClearTimer = setTimeout(() => {
        document.querySelectorAll(".yx-amber-box-pulse").forEach(el => el.classList.remove("yx-amber-box-pulse"));
      }, 6500);
    }

    function jumpToDeepSearchHit(hitIdx) {
      const hit = _lastDeepSearchHits[hitIdx];
      if (!hit) return;
      const p = projects.find(x => x.id === hit.pjId);
      if (!p) return;

      closeSearch();

      // A. Mobile Vertical War Room Path
      if (window._yxMobileMode) {
        if (hit.kind === "project") {
          openMobileProjectTimeline(p.id, true);
          setTimeout(() => {
            const box = document.getElementById("mobPjDossierBox");
            applyAmberHighlightPulseInContainer(box, hit.query);
          }, 60);
        } else {
          openMobileProjectTimeline(p.id, false);
          setTimeout(() => {
            const evEl = document.getElementById("mob-ev-" + hit.evId);
            if (evEl) {
              evEl.classList.add("yx-amber-box-pulse");
              applyAmberHighlightPulseInContainer(evEl, hit.query);
            }
          }, 60);
        }
        return;
      }

      // B. Desktop 3D / List Stage Path
      let vis = getVisibleProjects();
      let pIdx = vis.findIndex(x => x.id === p.id);
      if (pIdx < 0) {
        const targetDept = p.leadDept || (store.departments && store.departments[0]) || "工務部";
        activeDept = targetDept;
        const dItems = getDeptDeckItems();
        activeDeptIdx = Math.max(0, dItems.findIndex(x => x.key === targetDept));
        vis = getVisibleProjects(targetDept);
        pIdx = Math.max(0, vis.findIndex(x => x.id === p.id));
      }
      activePj = pIdx;

      if (hit.kind === "event") {
        const sorted = getSortedEvents(p);
        const eIdx = sorted.findIndex(e => e.id === hit.evId);
        if (eIdx >= 0) activeMs = eIdx;
        detailTab = "event";
      } else {
        detailTab = hit.targetTab || "dossier";
      }

      if (viewMode === "list") setViewMode("card");
      refreshAllLayers();
      diveToDepth(3);

      setTimeout(() => {
        const detBody = document.getElementById("detScrollBody") || document.getElementById("detailStageCard");
        applyAmberHighlightPulseInContainer(detBody, hit.query);
      }, 80);
    }

      if (typeof canManageProjectSharing === "function" && !canManageProjectSharing(p)) {
        toastMsg(`僅主責部門「${p.leadDept}」與總經理可變更主責歸屬`);
        openSharingMatrix();
        return;
      }
      if (!isMasterUnlocked() && !canAccessDepartment(newLead)) {
        toastMsg("僅總經理可將專案移交至其他部門主責");
        openSharingMatrix();
        return;
      }
      p.leadDept = newLead;
      p.sharedDepts = (p.sharedDepts || []).filter(d => d !== newLead);
      commitStore(true);
      if (nasServerActive) nasSendOp({ op: "update_matrix", pjId: p.id, leadDept: p.leadDept, sharedDepts: p.sharedDepts });
      refreshAllLayers();
      openSharingMatrix();
    }

    function toggleMatrixShare(pjId, dept) {
      const p = projects.find(x => x.id === pjId);
      if (!p || p.leadDept === dept) return;
      if (typeof canManageProjectSharing === "function" && !canManageProjectSharing(p)) {
        toastMsg(`僅主責部門「${p.leadDept}」與總經理可勾選跨部門共用`);
        return;
      }
      if (!Array.isArray(p.sharedDepts)) p.sharedDepts = [];
      if (p.sharedDepts.includes(dept)) p.sharedDepts = p.sharedDepts.filter(d => d !== dept);
      else p.sharedDepts.push(dept);
      commitStore(true);
      if (nasServerActive) nasSendOp({ op: "update_matrix", pjId: p.id, leadDept: p.leadDept, sharedDepts: p.sharedDepts });
      refreshAllLayers();
      openSharingMatrix();
    }

    /* ==========================================================================
       PURE-JS OFFLINE EXCEL (.XLSX) READER — V11/V12 (16-col) + V10 + V9
       ========================================================================== */
    async function inflateRaw(uint8) {
      const ds = new DecompressionStream("deflate-raw");
      const writer = ds.writable.getWriter();
      writer.write(uint8);
      writer.close();
      const buf = await new Response(ds.readable).arrayBuffer();
      return new TextDecoder("utf-8").decode(buf);
    }

    async function unzipXlsxEntries(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(arrayBuffer);

      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error("不是有效的 .xlsx 檔案");

      const totalEntries = view.getUint16(eocd + 10, true);
      let cdPos = view.getUint32(eocd + 16, true);
      const files = {};

      for (let e = 0; e < totalEntries; e++) {
        if (view.getUint32(cdPos, true) !== 0x02014b50) break;
        const method = view.getUint16(cdPos + 10, true);
        const compSize = view.getUint32(cdPos + 20, true);
        const nameLen = view.getUint16(cdPos + 28, true);
        const extraLen = view.getUint16(cdPos + 30, true);
        const commentLen = view.getUint16(cdPos + 32, true);
        const localOff = view.getUint32(cdPos + 42, true);

        const name = new TextDecoder("utf-8").decode(bytes.subarray(cdPos + 46, cdPos + 46 + nameLen));
        cdPos += 46 + nameLen + extraLen + commentLen;

        if (name.endsWith(".xml") || name.endsWith(".rels")) {
          const lNameLen = view.getUint16(localOff + 26, true);
          const lExtraLen = view.getUint16(localOff + 28, true);
          const dataStart = localOff + 30 + lNameLen + lExtraLen;
          const slice = bytes.subarray(dataStart, dataStart + compSize);
          if (method === 0) files[name] = new TextDecoder("utf-8").decode(slice);
          else if (method === 8) files[name] = await inflateRaw(slice);
        }
      }
      return files;
    }

    function xmlTags(node, localName) {
      return Array.from(node.getElementsByTagNameNS("*", localName));
    }

    function parseSheetCells(xmlText, sharedStrings) {
      const doc = new DOMParser().parseFromString(xmlText, "application/xml");
      const map = {};
      xmlTags(doc, "c").forEach(c => {
        const ref = c.getAttribute("r");
        if (!ref) return;
        const t = c.getAttribute("t");
        let val = "";
        if (t === "inlineStr") {
          val = xmlTags(c, "t").map(n => n.textContent).join("");
        } else {
          const vNodes = xmlTags(c, "v");
          if (!vNodes.length) return;
          const raw = vNodes[0].textContent || "";
          if (t === "s") {
            const idx = parseInt(raw, 10);
            val = sharedStrings[idx] !== undefined ? sharedStrings[idx] : "";
          } else {
            val = raw;
          }
        }
        map[ref] = String(val).trim();
      });
      return map;
    }

    function parseSharedDeptsList(rawStr, leadDept) {
      if (!rawStr) return [];
      return String(rawStr)
        .split(/[、,，/／;；\s]+/)
        .map(s => s.trim())
        .filter(s => s && s !== "無" && s !== leadDept)
        .map(s => {
          if (s === "數發" || s === "數發部" || s === "數位發展") return "數位發展部";
          if (s === "宿服" || s === "宿服部" || s === "總務" || s === "總務部" || s === "宿服總務") return "宿服總務部";
          if (s === "人資" || s === "人事" || s === "人事部" || s === "管理" || s === "管理部") return "人資部";
          if (!s.endsWith("部") && store.departments.includes(s + "部")) return s + "部";
          return s;
        });
    }

    function parseSecModeZh(raw) {
      const s = String(raw || "").trim();
      if (s.includes("整案")) return "full";
      if (s.includes("財務") || s.includes("金額")) return "finance";
      return "none";
    }

    async function parseXlsxBufferToPayload(arrayBuffer) {
      const files = await unzipXlsxEntries(arrayBuffer);

      const sharedStrings = [];
      if (files["xl/sharedStrings.xml"]) {
        const ssDoc = new DOMParser().parseFromString(files["xl/sharedStrings.xml"], "application/xml");
        xmlTags(ssDoc, "si").forEach(si => {
          sharedStrings.push(xmlTags(si, "t").map(t => t.textContent).join(""));
        });
      }

      const relMap = {};
      if (files["xl/_rels/workbook.xml.rels"]) {
        const relDoc = new DOMParser().parseFromString(files["xl/_rels/workbook.xml.rels"], "application/xml");
        xmlTags(relDoc, "Relationship").forEach(r => {
          let target = (r.getAttribute("Target") || "").replace(/^\/+/, "");
          if (!target.startsWith("xl/")) target = "xl/" + target;
          relMap[r.getAttribute("Id")] = target;
        });
      }

      const wbDoc = new DOMParser().parseFromString(files["xl/workbook.xml"], "application/xml");
      const sheetDefs = [];
      xmlTags(wbDoc, "sheet").forEach(sh => {
        const name = sh.getAttribute("name");
        const rId = sh.getAttribute("r:id") || sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
        const path = relMap[rId] || `xl/worksheets/sheet${sheetDefs.length + 1}.xml`;
        if (files[path]) sheetDefs.push({ name, cells: parseSheetCells(files[path], sharedStrings) });
      });

      if (!sheetDefs.length) throw new Error("找不到工作表資料");

      const ov = sheetDefs[0].cells;

      const isV11VaultFormat = !!(ov["E4"] && ov["E4"].includes("保密等級"));
      const isV10DeptFormat = !isV11VaultFormat && !!(ov["C4"] && ov["C4"].includes("主責部門"));
      const isV9SyncFormat = !isV11VaultFormat && !isV10DeptFormat && !!(ov["D4"] && ov["D4"].includes("燈號"));

      const zhToColor = { "藍": "blue", "綠": "teal", "金": "amber", "紫": "purple" };
      const newProjects = [];

      for (let r = 5; r <= 65; r++) {
        const code = ov[`A${r}`];
        const shortName = ov[`B${r}`];
        if (!code || !shortName || code === "PJ-XX") continue;
        if (code.includes("累計收錄") || code.includes("部門名稱") || code.includes("七大部門")) continue;

        const existing = projects.find(x => x.code === code || x.shortName === shortName) || {};
        const prevEvents = Array.isArray(existing.events) ? existing.events : [];
        const pObj = JSON.parse(JSON.stringify(existing));
        delete pObj._locked;
        delete pObj.encPayload;
        pObj.id = pObj.id || ("pj-" + r + "-" + Date.now());
        pObj.code = code;
        pObj.shortName = shortName;
        pObj.events = [];

        if (isV11VaultFormat) {
          pObj.leadDept = ov[`C${r}`] || pObj.leadDept || "工務部";
          pObj.sharedDepts = parseSharedDeptsList(ov[`D${r}`], pObj.leadDept);
          pObj.secMode = parseSecModeZh(ov[`E${r}`]);
          pObj.vaultDept = ov[`F${r}`] || pObj.vaultDept || "財務部";
          pObj.statusShort = ov[`G${r}`] || pObj.statusShort || "推進中";
          pObj.status = pObj.statusShort;
          pObj.statusColor = zhToColor[ov[`H${r}`]] || pObj.statusColor || "blue";
          const parsedPct = parseFloat(String(ov[`I${r}`] || "").replace("%", ""));
          if (!isNaN(parsedPct)) {
            pObj.progressPct = parsedPct <= 1 && parsedPct > 0 ? Math.round(parsedPct * 100) : Math.round(parsedPct);
            pObj.stageIndex = Math.max(1, Math.min(5, Math.round(pObj.progressPct / 20) || 1));
          }
          pObj.heroNum = ov[`J${r}`] || pObj.heroNum || "評估中";
          pObj.heroUnit = ov[`K${r}`] || pObj.heroUnit || "預算／規模";
          pObj.microTag = ov[`L${r}`] || pObj.microTag || shortName;
          pObj.oneLiner = pObj.microTag;
          pObj.tagLoc = ov[`M${r}`] || pObj.tagLoc || pObj.leadDept;
          if (ov[`N${r}`]) pObj.pivotSummary = ov[`N${r}`];
          if (ov[`O${r}`]) pObj.nextSteps = ov[`O${r}`];
        } else if (isV10DeptFormat) {
          pObj.leadDept = ov[`C${r}`] || pObj.leadDept || "工務部";
          pObj.sharedDepts = parseSharedDeptsList(ov[`D${r}`], pObj.leadDept);
          pObj.secMode = pObj.secMode || "none";
          pObj.vaultDept = pObj.vaultDept || "財務部";
          pObj.statusShort = ov[`E${r}`] || pObj.statusShort || "推進中";
          pObj.status = pObj.statusShort;
          pObj.statusColor = zhToColor[ov[`F${r}`]] || pObj.statusColor || "blue";
          const parsedPct = parseFloat(String(ov[`G${r}`] || "").replace("%", ""));
          if (!isNaN(parsedPct)) {
            pObj.progressPct = parsedPct <= 1 && parsedPct > 0 ? Math.round(parsedPct * 100) : Math.round(parsedPct);
            pObj.stageIndex = Math.max(1, Math.min(5, Math.round(pObj.progressPct / 20) || 1));
          }
          pObj.heroNum = ov[`H${r}`] || pObj.heroNum || "評估中";
          pObj.heroUnit = ov[`I${r}`] || pObj.heroUnit || "預算／規模";
          pObj.microTag = ov[`J${r}`] || pObj.microTag || shortName;
          pObj.oneLiner = pObj.microTag;
          pObj.tagLoc = ov[`K${r}`] || pObj.tagLoc || pObj.leadDept;
          if (ov[`L${r}`]) pObj.pivotSummary = ov[`L${r}`];
          if (ov[`M${r}`]) pObj.nextSteps = ov[`M${r}`];
        } else if (isV9SyncFormat) {
          pObj.leadDept = pObj.leadDept || "工務部";
          pObj.sharedDepts = Array.isArray(pObj.sharedDepts) ? pObj.sharedDepts : [];
          pObj.statusShort = ov[`C${r}`] || pObj.statusShort || "推進中";
          pObj.status = pObj.statusShort;
          pObj.statusColor = zhToColor[ov[`D${r}`]] || pObj.statusColor || "blue";
          const parsedPct = parseFloat(String(ov[`E${r}`] || "").replace("%", ""));
          if (!isNaN(parsedPct)) pObj.progressPct = parsedPct <= 1 && parsedPct > 0 ? Math.round(parsedPct * 100) : Math.round(parsedPct);
          if (ov[`F${r}`]) pObj.heroNum = ov[`F${r}`];
          if (ov[`G${r}`]) pObj.heroUnit = ov[`G${r}`];
          if (ov[`H${r}`]) { pObj.microTag = ov[`H${r}`]; pObj.oneLiner = ov[`H${r}`]; }
          if (ov[`I${r}`]) pObj.tagLoc = ov[`I${r}`];
          if (ov[`J${r}`]) pObj.pivotSummary = ov[`J${r}`];
          if (ov[`K${r}`]) pObj.nextSteps = ov[`K${r}`];
        }

        const idxStr = String(newProjects.length + 1).padStart(2, "0");
        const detailSheet = sheetDefs.find((sd, sIdx) =>
          sIdx > 0 && !sd.name.startsWith("99_") &&
          (sd.name.includes(shortName.slice(0, 3)) || sd.name.startsWith(idxStr + "_") || (sd.cells["A1"] || "").includes(code))
        );

        if (detailSheet) {
          const dc = detailSheet.cells;
          pObj.sheetName = detailSheet.name;
          if (dc["C5"]) pObj.location = dc["C5"];
          if (dc["C6"]) pObj.scale = dc["C6"];
          if (dc["G6"] || dc["H6"]) pObj.budget = dc["G6"] || dc["H6"];
          if (dc["C7"]) pObj.finance = dc["C7"];
          if (dc["G7"] || dc["H7"]) pObj.partners = dc["G7"] || dc["H7"];
          if (dc["C8"]) pObj.pivotSummary = dc["C8"];
          if (dc["C9"]) pObj.nextSteps = dc["C9"];
          if (dc["C10"]) {
            const parsedQs = parseQuickStatsCellStr(dc["C10"]);
            if (parsedQs) pObj.quickStats = parsedQs;
          }

          const evs = [];
          for (let er = 13; er <= 120; er++) {
            const rawTime = dc[`B${er}`];
            const title = dc[`E${er}`];
            if (!rawTime && !title) continue;
            if (!title) continue;
            const lines = (rawTime || "").split(/\r?\n/);
            const datePart = (lines[0] || getTodayAdAndRoc().adYm).trim();
            const rocPart = (lines[1] || "").replace(/[()（）]/g, "").trim() || convertAdToRocStr(datePart) || datePart;
            const phVal = dc[`C${er}`] || "規劃與設計";
            const secColVal = String(dc[`J${er}`] || "");
            const isSec = secColVal ? secColVal.includes("機密") : (phVal === "財務與決策");
            const matchedPrev = prevEvents.find(pe =>
              (pe.title && pe.title.trim() === title.trim() && String(pe.date || "").trim() === datePart) ||
              (pe.title && pe.title.trim().length >= 8 && pe.title.trim() === title.trim())
            );
            evs.push({
              id: matchedPrev ? matchedPrev.id : `${pObj.id}-ev-${er}`,
              _ver: matchedPrev ? (matchedPrev._ver || 1) : 1,
              _touchedAt: matchedPrev ? (matchedPrev._touchedAt || 0) : 0,
              date: datePart,
              rocDate: rocPart,
              phase: phVal,
              isKey: String(dc[`D${er}`] || "").includes("關鍵") || String(dc[`D${er}`] || "").includes("★"),
              isSecret: isSec,
              title: title,
              summary: dc[`F${er}`] || "",
              metrics: dc[`G${er}`] || "",
              docs: dc[`H${er}`] || "",
              docLinks: matchedPrev && matchedPrev.docLinks ? JSON.parse(JSON.stringify(matchedPrev.docLinks)) : {},
              photos: matchedPrev && Array.isArray(matchedPrev.photos) ? JSON.parse(JSON.stringify(matchedPrev.photos)) : [],
              pivotMeta: matchedPrev && matchedPrev.pivotMeta ? JSON.parse(JSON.stringify(matchedPrev.pivotMeta)) : null,
              note: dc[`I${er}`] || ""
            });
          }
          pObj.events = evs;
        } else {
          pObj.events = JSON.parse(JSON.stringify(prevEvents));
        }

        newProjects.push(pObj);
      }

      if (!newProjects.length) throw new Error("未解析到專案列");
      normalizeProjects(newProjects);
      return { projects: newProjects };
    }

    (function bindGlobalExcelDrop() {
      const shield = document.getElementById("dropShield");
      let dragDepth = 0;
      window.addEventListener("dragenter", e => {
        if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) {
          dragDepth++;
          shield.classList.add("active");
        }
      });
      window.addEventListener("dragover", e => { e.preventDefault(); });
      window.addEventListener("dragleave", () => {
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) shield.classList.remove("active");
      });
      window.addEventListener("drop", async e => {
        e.preventDefault();
        dragDepth = 0;
        shield.classList.remove("active");
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!f) return;
        const lowName = f.name.toLowerCase();
        if (lowName.endsWith(".xlsx")) {
          try { await importXlsxBuffer(await f.arrayBuffer(), f.name); }
          catch (err) { alert("Excel 匯入失敗：" + (err.message || err)); }
        } else if (lowName.endsWith(".json")) {
          applyImportedJsonText(await f.text(), f.name);
        } else if (/\.(pdf|docx|txt|md|png|jpe?g|webp)$/i.test(lowName) && typeof handleJarvisDroppedDocument === "function") {
          await handleJarvisDroppedDocument(f);
        }
      });
    })();

    function getTodayAdAndRoc() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return {
        adDate: `${y}-${m}-${day}`,
        rocDate: `${y - 1911}/${m}/${day}`,
        adYm: `${y}-${m}`,
        rocYm: `${y - 1911}/${m}`
      };
    }

    function convertAdToRocStr(adStr) {
      const s = String(adStr || "").trim();
      const mFull = s.match(/^(\d{4})[-/.](\d{1,2})(?:[-/.](\d{1,2}))?(.*)$/);
      if (mFull) {
        const y = parseInt(mFull[1], 10);
        if (y >= 1912 && y <= 2200) {
          const rocY = y - 1911;
          const mm = mFull[2].padStart(2, "0");
          const dd = mFull[3] ? ("/" + mFull[3].padStart(2, "0")) : "";
          return `${rocY}/${mm}${dd}${mFull[4] || ""}`;
        }
      }
      const mYearOnly = s.match(/^(\d{4})$/);
      if (mYearOnly) {
        const y = parseInt(mYearOnly[1], 10);
        if (y >= 1912 && y <= 2200) return `${y - 1911}`;
      }
      return "";
    }

    function convertRocToAdStr(rocStr) {
      const s = String(rocStr || "").trim().replace(/^民國\s*/, "");
      const mFull = s.match(/^(\d{2,3})[-/.](\d{1,2})(?:[-/.](\d{1,2}))?(.*)$/);
      if (mFull) {
        const ry = parseInt(mFull[1], 10);
        if (ry >= 50 && ry <= 280) {
          const adY = ry + 1911;
          const mm = mFull[2].padStart(2, "0");
          const dd = mFull[3] ? ("-" + mFull[3].padStart(2, "0")) : "";
          return `${adY}-${mm}${dd}${mFull[4] || ""}`;
        }
      }
      return "";
    }
