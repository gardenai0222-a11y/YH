    function saveDocLinkFromInspector(btnEl) {
      const pjId = btnEl.getAttribute("data-pjid");
      const evId = btnEl.getAttribute("data-evid");
      const docName = btnEl.getAttribute("data-doc");
      const isClear = btnEl.getAttribute("data-clear") === "1";
      const p = projects.find(x => x.id === pjId);
      const ev = p && (p.events || []).find(e => e.id === evId);
      if (!p || !ev) return;
      if (ev._lockedEv || ev._lockedEvFields) {
        openUnlockModal(p.vaultDept || "財務部");
        return;
      }

      const inp = document.getElementById("docLinkModalInput");
      const newUrl = isClear ? "" : (inp ? inp.value.trim() : "");
      if (!ev.docLinks || typeof ev.docLinks !== "object") ev.docLinks = {};

      if (!newUrl) {
        delete ev.docLinks[docName];
        Object.keys(ev.docLinks).forEach(k => {
          if (docName.includes(k) || k.includes(docName)) delete ev.docLinks[k];
        });
      } else {
        ev.docLinks[docName] = newUrl;
      }

      const baseEvVer = ev._ver || 1;
      commitStore(true);
      if (nasServerActive) {
        const diskSafe = serializeStoreForDisk("encrypted");
        const diskP = diskSafe.projects.find(x => x.id === p.id);
        const diskEv = diskP && (diskP.events || []).find(x => x.id === ev.id);
        if (diskEv) {
          nasSendOp({ op: "upsert_event", pjId: p.id, baseEvVer, event: diskEv });
        }
      }
      refreshAllLayers();
      openDocInspectorModal(pjId, evId, docName);
      toastMsg(newUrl ? `✓ 已掛載「${docName}」連結${nasServerActive ? '並同步至 NAS' : ''}！` : `已移除「${docName}」連結`);
    }

    function closeSheet() {
      sheetCtx = null;
      document.getElementById("sheetBg").classList.remove("open");
      const bs = document.getElementById("bottomSheet");
      if (bs) {
        bs.style.transform = "";
        bs.classList.remove("wide-print");
      }
      if (typeof _nasDeferredSync !== "undefined" && _nasDeferredSync && typeof fetchLatestNasState === "function") {
        _nasDeferredSync = false;
        fetchLatestNasState("");
      }
    }

    (function bindSheetDrag() {
      const bs = document.getElementById("bottomSheet");
      let down = false, sy = 0, lastY = 0, lastT = 0, vy = 0;
      bs.addEventListener("pointerdown", e => {
        if (!e.target.closest("#sheetGrabber, #sheetHeadDrag") || e.target.closest("button, select, input")) return;
        down = true; sy = lastY = e.clientY; lastT = performance.now(); vy = 0;
        bs.style.transition = "none";
      });
      window.addEventListener("pointermove", e => {
        if (!down) return;
        const now = performance.now();
        vy = (e.clientY - lastY) / Math.max(1, now - lastT);
        lastY = e.clientY; lastT = now;
        bs.style.transform = `translateY(${Math.max(0, e.clientY - sy)}px)`;
      });
      window.addEventListener("pointerup", e => {
        if (!down) return; down = false;
        bs.style.transition = "";
        if (e.clientY - sy > 32 || vy > 0.15) closeSheet();
        else bs.style.transform = "";
      });
    })();

    function openProjectDossierFromSearch(pjId) {
      const p = projects.find(x => x.id === pjId);
      if (!p) return;
      if (typeof canAccessProjectByDept === "function" && !canAccessProjectByDept(p)) {
        openUnlockModal(p.leadDept || "僅總經理", () => openProjectDossierFromSearch(pjId));
        return;
      }
      if (p._locked && p.secMode === "full") {
        openUnlockModal(p.vaultDept || "僅總經理");
        return;
      }
      let vis = getVisibleProjects();
      let pIdx = vis.findIndex(x => x.id === pjId);
      if (pIdx < 0) {
        const targetDept = p.leadDept || store.departments[0] || "工務部";
        activeDept = targetDept;
        activeDeptIdx = Math.max(0, getDeptDeckItems().findIndex(x => x.key === targetDept));
        vis = getVisibleProjects(targetDept);
        pIdx = Math.max(0, vis.findIndex(x => x.id === pjId));
      }
      activePj = pIdx;
      detailTab = "dossier";
      closeSearch();
      closeSheet();
      refreshAllLayers();
      diveToDepth(3);
    }

    function onSearch(val) {
      if (typeof runDeepSearchEngine === "function") return runDeepSearchEngine(val);
      const inp = document.getElementById("sInput");
      const layer = document.getElementById("searchLayer");
      const q = val.trim().toLowerCase();
      inp.classList.toggle("active", q !== "");
      if (!q) { layer.classList.remove("open"); return; }

      const pjHits = [];
      const evHits = [];
      const qidHits = [];

      projects.forEach(p => {
        if (typeof canAccessProjectByDept === "function" && !canAccessProjectByDept(p)) return;
        if (p._locked && p.secMode === "full") return;
        const finLocked = !!(p._locked && p.secMode === "finance");
        const deptStr = [p.leadDept, ...(p.sharedDepts || [])].join(" ");

        (p.quickIds || []).forEach(qi => {
          const masked = finLocked && (qi.isFinSecret || hasCurrencyText(qi.v));
          if (masked) return;
          if (`${p.shortName} ${qi.k} ${qi.v}`.toLowerCase().includes(q)) {
            qidHits.push({ p, qi });
          }
        });

        const dossierFieldPairs = [
          ["專案名稱/代碼", [p.code, p.shortName, p.fullName, deptStr, p.statusShort].join(" ")],
          ["基地與地號", [p.location, p.tagLoc].join(" ")],
          ["規模規格", p.scale || ""],
          ["合作建築師/營造團隊", p.partners || ""],
          ["戰略摘要", p.microTag || ""]
        ];
        if (!finLocked) {
          dossierFieldPairs.push(
            ["預算結構", [p.heroNum, p.heroUnit, p.budget].join(" ")],
            ["銀行授信/資金安排", p.finance || ""],
            ["核心戰略轉折", p.pivotSummary || ""],
            ["下一步關鍵待辦", p.nextSteps || ""],
            ["關鍵指標小卡", (p.quickStats || []).map(s => `${s.k} ${s.v}`).join(" ")]
          );
        }

        const matchedFields = dossierFieldPairs
          .filter(([_, text]) => String(text || "").toLowerCase().includes(q))
          .map(([lbl, text]) => ({ lbl, text: String(text || "").trim() }));

        if (matchedFields.length > 0) {
          pjHits.push({ p, matchedFields });
        }

        (p.events || []).forEach(ev => {
          if (ev._lockedEv) return;
          const evHaystack = [
            p.shortName, p.code, deptStr,
            ev.date, ev.rocDate, ev.phase,
            ev.title, ev.summary, ev.metrics, ev.docs, ev.note
          ].join(" ").toLowerCase();
          if (evHaystack.includes(q)) {
            evHits.push({ p, ev });
          }
        });
      });

      const totalCount = qidHits.length + pjHits.length + evHits.length;

      layer.innerHTML = `
        <div style="max-width:860px;margin:0 auto;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;">
            <span style="font-size:15.5px;font-weight:700;">全域檢索「${esc(val)}」· 命中 ${qidHits.length} 筆身分證、${pjHits.length} 份背景、${evHits.length} 筆節點</span>
            <button class="sh-btn" onclick="closeSearch()">✕ 關閉檢索 (Esc)</button>
          </div>

          ${!totalCount ? `
            <div style="padding:36px 24px;text-align:center;border-radius:20px;background:var(--bg-card);border:1px solid var(--bdr);color:var(--t3);">
              找不到符合「${esc(val)}」的公開速查身分證、專案背景或大事紀節點。
            </div>
          ` : ''}

          ${qidHits.length ? `
            <div style="margin-bottom:18px;">
              <div class="mono" style="font-size:11.5px;color:var(--cyan);font-weight:700;margin-bottom:8px;">🪪 速查身分證命中（點擊直接複製地號／面積／文號 · ${qidHits.length} 筆）</div>
              <div class="id-copy-grid">
                ${qidHits.map(({ p, qi }) => `
                  <button type="button" class="id-copy-chip" data-copyv="${esc(qi.v)}" data-copyl="${esc(p.shortName + ' - ' + qi.k)}" onclick="copyQuickIdText(this.getAttribute('data-copyv'), this.getAttribute('data-copyl'))">
                    <div style="display:flex;justify-content:space-between;width:100%;margin-bottom:3px;">
                      <span style="font-size:11px;color:var(--cyan);font-weight:700;">[${esc(p.shortName)}] ${esc(qi.k)}</span>
                      <span class="mono" style="font-size:10px;color:var(--teal);">📋 點擊複製</span>
                    </div>
                    <div style="font-size:13px;font-weight:600;color:var(--t1);text-align:left;">${esc(qi.v)}</div>
                  </button>
                `).join("")}
              </div>
            </div>
          ` : ''}

          ${pjHits.length ? `
            <div style="margin-bottom:18px;">
              <div class="mono" style="font-size:11.5px;color:var(--teal);font-weight:700;margin-bottom:8px;">📑 專案背景檔案命中（建築師／營造廠／地號／預算授信／下一步待辦 · ${pjHits.length} 案）</div>
              <div style="display:flex;flex-direction:column;gap:9px;">
                ${pjHits.map(({ p, matchedFields }) => `
                  <div style="background:var(--bg-card);border:1px solid rgba(45,212,191,0.42);border-radius:18px;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;" onclick="openProjectDossierFromSearch('${esc(p.id)}')">
                    <div style="flex:1;min-width:0;">
                      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
                        <span class="mono" style="font-size:12px;color:var(--teal);font-weight:700;">${esc(p.code)} · ${esc(p.fullName || p.shortName)}</span>
                        <span style="font-size:11px;color:var(--t3);">${esc(formatDeptBadgeText(p))}</span>
                      </div>
                      <div style="font-size:12.5px;color:var(--t2);line-height:1.55;">
                        ${matchedFields.slice(0, 3).map(mf => `<span style="margin-right:10px;"><strong style="color:var(--cyan);">[${esc(mf.lbl)}]</strong> ${esc(mf.text.slice(0, 72))}${mf.text.length > 72 ? '…' : ''}</span>`).join("")}
                      </div>
                    </div>
                    <span style="color:var(--teal);font-size:12.5px;font-weight:700;white-space:nowrap;">開啟背景檔案 ›</span>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ''}

          ${evHits.length ? `
            <div>
              <div class="mono" style="font-size:11.5px;color:var(--cyan);font-weight:700;margin-bottom:8px;">📌 大事紀節點與依據文件命中（${evHits.length} 筆）</div>
              <div style="display:flex;flex-direction:column;gap:10px;">
                ${evHits.map(({ p, ev }) => `
                  <div style="background:var(--bg-card);border:1px solid var(--bdr);border-radius:18px;padding:15px 20px;cursor:pointer;" onclick="openDetailForEvent('${esc(p.id)}','${esc(ev.id)}')">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                      <div style="flex:1;">
                        <div style="font-size:12px;color:var(--cyan);margin-bottom:3px;" class="mono">${esc(ev.date)}（民國 ${esc(ev.rocDate)}）· ${esc(p.shortName)} · ${esc(ev.phase)}</div>
                        <div style="font-size:15.5px;font-weight:700;margin-bottom:4px;">${esc(ev.title)}</div>
                        <div style="font-size:12.5px;color:var(--t2);line-height:1.55;">${esc((ev.summary || "").slice(0, 110))}${(ev.summary || "").length > 110 ? '…' : ''}</div>
                      </div>
                      <span style="color:var(--cyan);font-size:13px;font-weight:600;white-space:nowrap;">進入詳情層 ›</span>
                    </div>
                    ${ev.docs ? `<div style="margin-top:8px;" onclick="event.stopPropagation()">${renderDocChipsHtml(p.id, ev)}</div>` : ''}
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ''}
        </div>
      `;
      layer.classList.add("open");
    }

    function closeSearch() {
      const inp = document.getElementById("sInput");
      if (inp) { inp.value = ""; inp.classList.remove("active"); }
      const minp = document.getElementById("deepSearchModalInput");
      if (minp) minp.value = "";
      document.getElementById("searchLayer").classList.remove("open");
    }

    function submitNode(e) {
      e.preventDefault();
      const pjId = document.getElementById("f_pj").value;
      const origPjId = (document.getElementById("f_orig_pj") && document.getElementById("f_orig_pj").value) || pjId;
      const editId = document.getElementById("f_id").value;
      const p = projects.find(x => x.id === pjId);
      if (!p) return;
      const origP = projects.find(x => x.id === origPjId) || p;
      const isMovedAcrossProjects = !!(editId && origP && origP.id !== p.id);

      const prevEvObj = editId ? (origP.events || []).find(x => x.id === editId) : null;
      const beforeSnap = prevEvObj ? JSON.parse(JSON.stringify(prevEvObj)) : null;
      const baseEvVer = prevEvObj ? (prevEvObj._ver || 1) : null;

      const rawPhase = document.getElementById("f_ph").value.trim() || "重點事項";
      const isCustomPhase = !!(rawPhase && !getAllPresetPhasesSet().has(rawPhase));
      if (isCustomPhase) {
        if (!Array.isArray(store.customPhases)) store.customPhases = [];
        if (!store.customPhases.includes(rawPhase)) store.customPhases.push(rawPhase);
      }

      const rawDocs = document.getElementById("f_dc").value.trim();
      const docTokens = splitDocItems(rawDocs);
      const cleanedDocLinks = {};
      document.querySelectorAll("#fDocLinksHost input[data-dockey]").forEach(inp => {
        const k = inp.getAttribute("data-dockey");
        const v = inp.value.trim();
        if (k && v) _formDocLinksDraft[k] = v;
        else if (k && !v) delete _formDocLinksDraft[k];
      });
      docTokens.forEach(tok => {
        if (_formDocLinksDraft[tok]) {
          cleanedDocLinks[tok] = _formDocLinksDraft[tok];
        } else {
          for (const [k, v] of Object.entries(_formDocLinksDraft)) {
            if (v && (tok.includes(k) || k.includes(tok))) {
              cleanedDocLinks[k] = v;
              break;
            }
          }
        }
      });

      const isKeyChecked = document.getElementById("f_ky").checked;
      let pivotMetaObj = prevEvObj && prevEvObj.pivotMeta ? JSON.parse(JSON.stringify(prevEvObj.pivotMeta)) : null;
      if (isKeyChecked) {
        const pvFrom = (document.getElementById("f_pv_from") && document.getElementById("f_pv_from").value.trim()) || "";
        const pvTrig = (document.getElementById("f_pv_trig") && document.getElementById("f_pv_trig").value.trim()) || "";
        const pvTo = (document.getElementById("f_pv_to") && document.getElementById("f_pv_to").value.trim()) || "";
        const pvDelta = (document.getElementById("f_pv_delta") && document.getElementById("f_pv_delta").value.trim()) || "";
        const pvBtag = (document.getElementById("f_pv_btag") && document.getElementById("f_pv_btag").value.trim()) || "";
        const pvBstep = !!(document.getElementById("f_pv_bstep") && document.getElementById("f_pv_bstep").checked);
        if (pvFrom || pvTrig || pvTo || pvDelta || pvBtag) {
          pivotMetaObj = {
            fromPlan: pvFrom || "前期規劃基準",
            trigger: pvTrig || "實務檢討與法規／成本評估",
            toDecision: pvTo || document.getElementById("f_tt").value.trim(),
            delta: pvDelta || document.getElementById("f_mt").value.trim() || document.getElementById("f_nt").value.trim() || "拍板定案",
            budgetTag: pvBtag,
            isBudgetStep: pvBstep
          };
        }
      }

      const rec = {
        id: editId || ("ev-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6)),
        _ver: baseEvVer || 1,
        _touchedAt: Date.now(),
        date: document.getElementById("f_dt").value.trim(),
        rocDate: document.getElementById("f_rc").value.trim(),
        phase: rawPhase,
        isKey: isKeyChecked,
        isSecret: document.getElementById("f_sec").checked,
        title: document.getElementById("f_tt").value.trim(),
        summary: document.getElementById("f_sm").value.trim(),
        metrics: document.getElementById("f_mt").value.trim(),
        docs: rawDocs,
        docLinks: cleanedDocLinks,
        photos: typeof _formPhotosDraft !== "undefined" ? JSON.parse(JSON.stringify(_formPhotosDraft)) : ((prevEvObj && prevEvObj.photos) || []),
        pivotMeta: pivotMetaObj,
        note: document.getElementById("f_nt").value.trim()
      };

      if (typeof markEventSeen === "function") markEventSeen(p.id, rec.id, true);
      if (typeof recordLocalItemRevision === "function") {
        recordLocalItemRevision("event", editId ? "修改節點" : "新增節點", p, beforeSnap, rec);
      }

      if (isMovedAcrossProjects) {
        origP.events = (origP.events || []).filter(x => x.id !== editId);
        p.events.push(rec);
      } else if (editId) {
        const i = p.events.findIndex(x => x.id === editId);
        if (i >= 0) p.events[i] = rec;
        else p.events.push(rec);
      } else {
        p.events.push(rec);
      }

      p.events.sort((a,b) => String(a.date).localeCompare(String(b.date)));
      commitStore(true);

      if (nasServerActive) {
        const diskSafe = serializeStoreForDisk("encrypted");
        const diskP = diskSafe.projects.find(x => x.id === p.id);
        if (isMovedAcrossProjects && diskP) {
          const diskEv = (diskP.events || []).find(x => x.id === rec.id);
          if (diskEv && p.secMode !== "full" && origP.secMode !== "full") {
            nasSendOp({
              op: "move_event",
              fromPjId: origP.id,
              toPjId: p.id,
              baseEvVer,
              event: diskEv,
              customPhaseAdd: isCustomPhase ? rawPhase : ""
            });
          } else {
            nasPushFullStore(`跨專案搬移節點至 ${p.shortName}`);
          }
        } else if (p.secMode === "full" && diskP) {
          nasSendOp({ op: "upsert_project", overwriteEvents: true, project: diskP });
        } else if (diskP) {
          const diskEv = (diskP.events || []).find(x => x.id === rec.id);
          if (diskEv) {
            nasSendOp({
              op: "upsert_event",
              pjId: p.id,
              baseEvVer,
              event: diskEv,
              customPhaseAdd: isCustomPhase ? rawPhase : ""
            });
          }
        }
      }

      closeSheet();
      openDetailForEvent(p.id, rec.id);
      toastMsg(isMovedAcrossProjects
        ? `✓ 已將節點搬移至「${p.shortName}」${nasServerActive ? '並同步至 NAS' : ''}`
        : (nasServerActive ? "✓ 已儲存節點並即時同步至 NAS" : "✓ 已儲存節點"));
    }

    function delEvent(pjId, evId) {
      if (!confirm("確定刪除此筆節點？（若誤刪可隨時由上方「⏪ 留痕」一鍵救回）")) return;
      const p = projects.find(x => x.id === pjId);
      if (!p) return;
      const delTarget = (p.events || []).find(x => x.id === evId);
      if (delTarget && typeof recordLocalItemRevision === "function") {
        recordLocalItemRevision("event", "刪除節點", p, delTarget, null);
      }
      p.events = p.events.filter(x => x.id !== evId);
      commitStore(true);
      if (nasServerActive) {
        const diskSafe = serializeStoreForDisk("encrypted");
        const diskP = diskSafe.projects.find(x => x.id === pjId);
        if (p.secMode === "full" && diskP) {
          nasSendOp({ op: "upsert_project", overwriteEvents: true, project: diskP });
        } else {
          nasSendOp({ op: "delete_event", pjId, evId });
        }
      }
      closeSheet();
      if (depth === 3) diveToDepth(2);
      refreshAllLayers();
      toastMsg("已刪除節點");
    }

    async function resetAll() {
      if (!confirm("確定還原為本系統初始內建的儲存狀態？（NAS 模式下將先自動備份目前狀態）")) return;
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LAST_SEEN_EMB_DIGEST_KEY);
      _cacheConflictState = null;
      sessionKeks = {};
      sessionUnlockedBy = "";
      store = JSON.parse(JSON.stringify(getEmbeddedStore()));
      normalizeProjects(store.projects);
      markEncryptedStoreFlags(store);
      projects = store.projects;
      try { localStorage.setItem(LAST_SEEN_EMB_DIGEST_KEY, computeStoreContentDigest(store)); } catch (e) {}
      hasUnsavedFileChanges = false;
      document.getElementById("unsavedDot").classList.remove("show");
      renderCacheConflictBanner();
      if (nasServerActive) await nasPushFullStore("還原預設狀態");
      closeSheet();
      activeDept = store.departments[0] || "工務部";
      activeDeptIdx = 0;
      activePj = 0;
      diveToDepth(0);
      refreshAllLayers();
      toastMsg("已還原為初始內建狀態");
    }

    function exportCSV() {
      if (store.vault && store.vault.enabled && !hasAnyUnlockedKey()) {
        openUnlockModal("", () => exportCSV());
        return;
      }
      const rows = [["專案代碼","專案名稱","主責部門","共用協作部門","保密狀態","當期狀態","進度%","西元時間","民國時間","階段","關鍵標記","標題","內容紀要","量化指標","依據文件","決策影響"]];
      projects.forEach(p => {
        if (typeof canAccessProjectByDept === "function" && !canAccessProjectByDept(p)) return;
        if (p._locked && p.secMode === "full") return;
        const finLocked = !!(p._locked && p.secMode === "finance");
        const mCsv = s => finLocked ? maskCurrencyText(String(s || "")) : String(s || "");
        const shStr = (p.sharedDepts || []).join("、");
        const secStr = p.secMode === "full" ? "整案機密" : (p.secMode === "finance" ? "鎖財務金額" : "公開");
        const visEvs = (p.events || []).filter(e => !e._lockedEv);
        if (!visEvs.length) {
          rows.push([p.code, p.shortName, p.leadDept, shStr, secStr, p.statusShort||p.status, p.progressPct||20, "", "", "", "", "（無公開節點）", "", "", "", ""]);
        } else {
          visEvs.forEach(e => rows.push([p.code,p.shortName,p.leadDept,shStr,secStr,p.statusShort||p.status,p.progressPct||40,e.date,e.rocDate,e.phase,e.isKey?"關鍵轉折":"里程碑",mCsv(e.title),mCsv(e.summary),mCsv(e.metrics||""),mCsv(e.docs||""),mCsv(e.note||"")]));
        }
      });
      const csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
      const b = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const u = URL.createObjectURL(b); const a = document.createElement("a");
      a.href = u; a.download = "有興國際_專案履歷控制中心總表.csv"; a.click(); URL.revokeObjectURL(u);
      toastMsg("已匯出當前可見權限 CSV");
    }

    /* ==========================================================================
       4-LAYER KEYBOARD SHORTCUTS & INITIAL BOOT
       (Aligned top-to-bottom with depth-rail & mouse wheel: ArrowDown/Enter dives, ArrowUp returns!)
       ========================================================================== */
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        saveStandaloneHTML();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === "p" || e.key === "P")) {
        e.preventDefault();
        openContextPrint();
        return;
      }

      const tag = (e.target && e.target.tagName) || "";
      const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      const shOpen = document.getElementById("sheetBg").classList.contains("open");
      const coachOpen = document.getElementById("coachBg").classList.contains("open");

      if (e.key === "Escape") {
        if (coachOpen) closeCoach();
        else if (document.getElementById("mobCheckinModalBg") && document.getElementById("mobCheckinModalBg").classList.contains("open")) closeMobileFieldCheckin();
        else if (window._jarvisOpen && typeof closeJarvisHud === "function") closeJarvisHud();
        else if (shOpen) closeSheet();
        else if (window._yxMap3DOpen && typeof toggleMap3DMode === "function") toggleMap3DMode(false);
        else if (document.getElementById("jarvisSideDock") && document.getElementById("jarvisSideDock").classList.contains("open")) closeJarvisSideDock();
        else if (document.getElementById("searchLayer").classList.contains("open")) closeSearch();
        else if (!window._yxMobileMode && depth > 0) diveOneLayerUp();
        if (typing) e.target.blur();
        return;
      }
      if (typing) return;
      if (coachOpen && (e.key === "Enter" || e.key === " ")) { closeCoach(); return; }
      if (shOpen || window._jarvisOpen) return;

      if (e.key === "/") {
        e.preventDefault();
        if (typeof activateDeepSearch === "function") activateDeepSearch();
        else document.getElementById("sInput").focus();
        return;
      }

      if (e.code === "Space" && !e.ctrlKey && !e.metaKey && !e.altKey && !window._yxMobileMode) {
        e.preventDefault();
        if (typeof openJarvisHud === "function") openJarvisHud();
        return;
      }
      if (window._yxMap3DOpen || window._yxMobileMode) return;

      if (e.key === "ArrowRight") {
        if (depth === 0) stepDeptCarousel(1);
        else if (depth === 1) stepProject(1);
        else if (depth === 2) stepMilestone(1);
        else if (depth === 3) stepDetailEvent(1);
      } else if (e.key === "ArrowLeft") {
        if (depth === 0) stepDeptCarousel(-1);
        else if (depth === 1) stepProject(-1);
        else if (depth === 2) stepMilestone(-1);
        else if (depth === 3) stepDetailEvent(-1);
      } else if (e.key === "ArrowDown" || e.key === "Enter") {
        if (depth < 3) diveOneLayerDown();
      } else if (e.key === "ArrowUp") {
        diveOneLayerUp();
      }
    });

    refreshAllLayers();
    renderCacheConflictBanner();
    if (typeof bootNasLiveSync === "function") bootNasLiveSync();
    requestAnimationFrame(() => {
      syncDeptGlider();
      if (!localStorage.getItem(COACH_KEY) && !window._yxMobileMode) {
        setTimeout(() => { if (!localStorage.getItem(COACH_KEY) && !window._yxMobileMode) openCoach(); }, 300);
      }
    });
  </script>
</body>
