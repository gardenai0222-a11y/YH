<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>有興國際 · 專案履歷控制中心</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230284C7'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E6%9C%89%3C/text%3E%3C/svg%3E" />
  <style>
    /* ==========================================================================
       NORDIC SCI-FI CONTROL CENTER TOKENS (V12)
       ========================================================================== */
    :root {
      --bg-void: #040812;
      --bg-card: rgba(14, 23, 42, 0.78);
      --bg-card-front: rgba(18, 29, 52, 0.93);
      --bg-bar: rgba(9, 15, 28, 0.84);
      --bg-sheet: rgba(10, 17, 32, 0.97);
      --bg-pill: rgba(255, 255, 255, 0.06);
      --bg-pill-hi: rgba(255, 255, 255, 0.13);

      --bdr: rgba(255, 255, 255, 0.09);
      --bdr-hi: rgba(56, 189, 248, 0.48);
      --rim: inset 0 1px 0 0 rgba(255, 255, 255, 0.20), inset 0 0 28px rgba(56, 189, 248, 0.05);

      --t1: #F8FAFC;
      --t2: #CBD5E1;
      --t3: #94A3B8;
      --t4: #475569;

      --cyan: #38BDF8;
      --cyan-a: rgba(56, 189, 248, 0.19);
      --teal: #2DD4BF;
      --teal-a: rgba(45, 212, 191, 0.18);
      --amber: #FBBF24;
      --amber-a: rgba(251, 191, 36, 0.20);
      --violet: #A78BFA;
      --violet-a: rgba(167, 139, 250, 0.20);

      --orb1: rgba(56, 189, 248, 0.15);
      --orb2: rgba(129, 140, 248, 0.12);
      --orb3: rgba(45, 212, 191, 0.08);
      --grid-c: rgba(148, 163, 184, 0.048);

      --shd-deep: 0 32px 72px -16px rgba(0, 0, 0, 0.82), 0 0 42px -12px rgba(56, 189, 248, 0.15);
      --snap: cubic-bezier(0.19, 1, 0.22, 1);
    }

    [data-theme="light"] {
      --bg-void: #ECF1F8;
      --bg-card: rgba(255, 255, 255, 0.78);
      --bg-card-front: rgba(255, 255, 255, 0.96);
      --bg-bar: rgba(255, 255, 255, 0.88);
      --bg-sheet: rgba(255, 255, 255, 0.98);
      --bg-pill: rgba(15, 23, 42, 0.05);
      --bg-pill-hi: rgba(15, 23, 42, 0.10);

      --bdr: rgba(15, 23, 42, 0.09);
      --bdr-hi: rgba(2, 132, 199, 0.44);
      --rim: inset 0 1px 0 0 rgba(255, 255, 255, 0.98);

      --t1: #0B1120;
      --t2: #334155;
      --t3: #64748B;
      --t4: #94A3B8;

      --cyan: #0284C7;
      --cyan-a: rgba(2, 132, 199, 0.14);
      --teal: #0D9488;
      --teal-a: rgba(13, 148, 136, 0.14);
      --amber: #D97706;
      --amber-a: rgba(217, 119, 6, 0.15);
      --violet: #6D28D9;
      --violet-a: rgba(109, 40, 217, 0.14);

      --orb1: rgba(56, 189, 248, 0.18);
      --orb2: rgba(129, 140, 248, 0.14);
      --orb3: rgba(45, 212, 191, 0.11);
      --grid-c: rgba(15, 23, 42, 0.045);

      --shd-deep: 0 26px 58px -16px rgba(15, 23, 42, 0.14), 0 8px 22px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    input, textarea, select, .selectable { user-select: text; -webkit-user-select: text; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Inter", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei UI", -apple-system, sans-serif;
      background: var(--bg-void); color: var(--t1);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
    .ic { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* ==========================================================================
       AMBIENT COSMOS & DROP OVERLAY
       ========================================================================== */
    .cosmos { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(95px); will-change: transform; }
    .o1 { width: 56vw; height: 56vw; top: -22vw; left: -10vw; background: radial-gradient(circle, var(--orb1), transparent 70%); }
    .o2 { width: 50vw; height: 50vw; bottom: -20vw; right: -10vw; background: radial-gradient(circle, var(--orb2), transparent 70%); }
    .o3 { width: 38vw; height: 38vw; top: 30vh; left: 32vw; background: radial-gradient(circle, var(--orb3), transparent 70%); }
    .hud-grid {
      position: absolute; inset: -6%;
      background-image: linear-gradient(to right, var(--grid-c) 1px, transparent 1px),
                        linear-gradient(to bottom, var(--grid-c) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 68% 60% at 50% 50%, #000 15%, transparent 95%);
      -webkit-mask-image: radial-gradient(ellipse 68% 60% at 50% 50%, #000 15%, transparent 95%);
      will-change: transform;
    }

    .drop-shield {
      position: fixed; inset: 16px; z-index: 250; border-radius: 32px;
      border: 2.5px dashed var(--cyan);
      background: rgba(4, 8, 18, 0.88); backdrop-filter: blur(20px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .drop-shield.active { opacity: 1; pointer-events: auto; }

    /* ==========================================================================
       TOP CONTROL CENTER COMMAND BAR & CASCADING LEAF HIERARCHY NAV (V16)
       ========================================================================== */
    :root {
      --top-clearance: 78px;
    }

    .top-bar {
      position: fixed; top: 12px; left: 18px; right: 18px; z-index: 75;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }

    .island {
      height: 44px; padding: 0 13px; border-radius: 999px;
      background: var(--bg-bar); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--bdr); box-shadow: var(--rim);
      display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .beacon { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

    .brand-block { display: flex; flex-direction: column; cursor: pointer; line-height: 1.15; }
    .brand-title { font-size: 13px; font-weight: 700; letter-spacing: 0.01em; color: var(--t1); }
    .brand-sub { font-size: 9.5px; font-weight: 700; letter-spacing: 0.11em; color: var(--cyan); }

    .nas-sync-pill {
      height: 28px; padding: 0 10px; border-radius: 999px;
      border: 1px solid rgba(45, 212, 191, 0.42); background: var(--teal-a); color: var(--teal);
      font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: all 0.2s;
    }
    .nas-sync-pill:hover { filter: brightness(1.12); box-shadow: 0 0 14px var(--teal-a); }
    .nas-sync-pill.is-reconnecting { border-color: rgba(251, 191, 36, 0.45); background: var(--amber-a); color: var(--amber); }
    .nas-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--teal);
      box-shadow: 0 0 8px var(--teal); flex-shrink: 0;
    }
    .nas-dot.warn { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

    /* Cascading Leaf/Branch Multi-Row Top Navigation (部門 ➔ 專案 ➔ 時間軸) */
    .tree-nav-shell {
      position: relative; display: flex; flex-direction: column; align-items: center;
      flex: 1 1 auto; min-width: 0; max-width: calc(100vw - 830px);
      pointer-events: none;
    }
    .tree-tier-wrap {
      display: flex; flex-direction: column; align-items: center; max-width: 100%;
      overflow: hidden; pointer-events: auto;
      max-height: 80px; opacity: 1; transform: translateY(0) scale(1);
      transition: max-height 0.34s var(--snap), opacity 0.26s var(--snap), transform 0.34s var(--snap);
    }
    .tree-tier-wrap.collapsed {
      max-height: 0 !important; opacity: 0 !important;
      transform: translateY(-10px) scale(0.96); pointer-events: none !important;
    }
    .tree-stem-svg {
      width: 100%; height: 11px; display: block; overflow: visible; pointer-events: none; flex-shrink: 0;
    }
    .tree-bar {
      position: relative; display: inline-flex; align-items: center; gap: 3px;
      padding: 4px 6px; border-radius: 999px;
      background: var(--bg-bar); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--bdr); box-shadow: var(--rim);
      max-width: 100%; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth;
    }
    .tree-bar::-webkit-scrollbar { display: none; }
    .tree-bar.tier-group {
      border-color: rgba(251, 191, 36, 0.45);
      box-shadow: 0 0 22px var(--amber-a), var(--rim);
      min-height: 44px; padding: 4px 10px;
    }
    .tree-bar.tier-dept { min-height: 44px; }
    .tree-bar.tier-proj {
      border-color: rgba(56, 189, 248, 0.34);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.26), var(--rim);
    }
    .tree-bar.tier-ms {
      border-color: rgba(45, 212, 191, 0.36);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28), var(--rim);
    }
    .tree-leaf-tag {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em;
      padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 3px;
      color: var(--cyan); background: var(--cyan-a); border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .tree-bar.tier-ms .tree-leaf-tag {
      color: var(--teal); background: var(--teal-a); border-color: rgba(45, 212, 191, 0.28);
    }
    .tree-pill {
      position: relative; border: 1px solid transparent; background: transparent;
      color: var(--t3); font-family: inherit; font-size: 12px; font-weight: 600;
      height: 32px; padding: 0 10px; border-radius: 999px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      transition: all 0.18s var(--snap); flex-shrink: 0;
    }
    .tree-bar.tier-proj .tree-pill,
    .tree-bar.tier-ms .tree-pill { height: 28px; font-size: 11.5px; padding: 0 9px; }
    .tree-pill:hover { color: var(--t1); background: var(--bg-pill); }
    .tree-pill.active {
      color: var(--t1); background: var(--cyan-a); border-color: var(--bdr-hi);
      box-shadow: 0 0 14px var(--cyan-a); font-weight: 700;
    }
    .tree-bar.tier-ms .tree-pill.active {
      background: var(--teal-a); border-color: rgba(45, 212, 191, 0.52);
      color: var(--teal); box-shadow: 0 0 14px var(--teal-a);
    }
    .tree-bar.tier-group .tree-pill.active {
      background: var(--amber-a); border-color: rgba(251, 191, 36, 0.55);
      color: var(--amber); box-shadow: 0 0 14px var(--amber-a);
    }
    .tree-pill.add-leaf { color: var(--teal); }
    .tree-pill.add-leaf:hover { background: var(--teal-a); border-color: rgba(45, 212, 191, 0.4); }

    .dept-cnt {
      font-size: 10px; padding: 1px 5px; border-radius: 99px;
      background: var(--bg-pill); color: var(--t3); transition: all 0.18s;
    }
    .tree-pill.active .dept-cnt { background: var(--cyan); color: #040812; font-weight: 700; }
    [data-theme="light"] .tree-pill.active .dept-cnt { color: #FFFFFF; }
    .dept-cnt.zero { opacity: 0.42; }

    /* Mode Segmented Switcher (🎴 空間 / 📋 條列) */
    .mode-seg {
      display: inline-flex; align-items: center; padding: 3px; border-radius: 999px;
      background: var(--bg-pill); border: 1px solid var(--bdr);
    }
    .m-btn {
      border: none; background: transparent; color: var(--t3);
      font-family: inherit; font-size: 11.5px; font-weight: 600;
      height: 28px; padding: 0 10px; border-radius: 999px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; transition: all 0.18s; white-space: nowrap;
    }
    .m-btn:hover { color: var(--t1); }
    .m-btn.active { background: var(--cyan-a); color: var(--cyan); box-shadow: inset 0 0 0 1px var(--bdr-hi); }

    .s-wrap { position: relative; display: flex; align-items: center; }
    .s-wrap .ic { position: absolute; left: 8px; pointer-events: none; color: var(--t2); }
    .s-inp {
      width: 31px; height: 31px; border-radius: 999px; border: 1px solid transparent;
      background: transparent; color: transparent; font-family: inherit; font-size: 12.5px;
      cursor: pointer; transition: all 0.24s var(--snap);
    }
    .s-inp::placeholder { color: transparent; }
    .s-inp:focus, .s-inp.active {
      width: 138px; padding: 0 10px 0 28px; background: var(--bg-pill);
      border-color: var(--bdr-hi); color: var(--t1); cursor: text; outline: none;
    }
    .s-inp:focus::placeholder, .s-inp.active::placeholder { color: var(--t3); }

    .icon-btn {
      width: 31px; height: 31px; border-radius: 50%; border: none; background: transparent;
      color: var(--t2); display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.18s; font-family: inherit; font-weight: 700; font-size: 12.5px;
    }
    .icon-btn:hover { background: var(--bg-pill-hi); color: var(--t1); }

    .print-top-btn, .map3d-top-btn, .jarvis-top-btn {
      height: 31px; padding: 0 11px; border-radius: 999px;
      border: 1px solid var(--bdr); background: var(--bg-pill); color: var(--t2);
      font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
      display: inline-flex; align-items: center; gap: 5.5px; cursor: pointer;
      transition: all 0.18s; white-space: nowrap;
    }
    .print-top-btn:hover, .map3d-top-btn:hover, .map3d-top-btn.active {
      border-color: var(--bdr-hi); color: var(--cyan); background: var(--cyan-a);
    }
    .jarvis-top-btn {
      border-color: rgba(56, 189, 248, 0.28); color: var(--t1);
    }
    .jarvis-top-btn:hover {
      border-color: var(--amber); color: var(--amber); background: var(--amber-a);
    }
    .ic-sm {
      width: 13.5px; height: 13.5px; stroke: currentColor; stroke-width: 1.85;
      stroke-linecap: round; stroke-linejoin: round; fill: none; flex-shrink: 0;
    }

    .vault-btn {
      height: 31px; padding: 0 10px; border-radius: 999px;
      border: 1px solid var(--bdr); background: var(--bg-pill); color: var(--t2);
      font-family: inherit; font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .vault-btn:hover { border-color: var(--violet); color: var(--violet); background: var(--violet-a); }
    .vault-btn.locked { border-color: rgba(167, 139, 250, 0.55); background: var(--violet-a); color: var(--violet); box-shadow: 0 0 14px var(--violet-a); }
    .vault-btn.partial { border-color: rgba(56, 189, 248, 0.55); background: var(--cyan-a); color: var(--cyan); }
    .vault-btn.unlocked { border-color: rgba(45, 212, 191, 0.55); background: var(--teal-a); color: var(--teal); }

    .studio-btn {
      height: 31px; padding: 0 11px; border-radius: 999px;
      border: 1px solid var(--bdr-hi); background: var(--cyan-a); color: var(--t1);
      font-family: inherit; font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .studio-btn:hover { background: var(--cyan); color: #040812; }
    [data-theme="light"] .studio-btn:hover,
    [data-theme="light"] .cta-pill:hover,
    [data-theme="light"] .dive-prompt:hover,
    [data-theme="light"] .ms-card.is-front:hover .open-detail-pill { color: #FFFFFF; }

    .unsaved-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
      box-shadow: 0 0 8px var(--amber); display: none;
    }
    .unsaved-dot.show { display: inline-block; }

    /* ==========================================================================
       RIGHT-EDGE 5-LAYER SPATIAL DEPTH RAIL (集團 🔒 ➔ 部門 ➔ 專案 ➔ 時間軸 ➔ 詳情)
       ========================================================================== */
    .depth-rail {
      position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 68;
      display: flex; flex-direction: column; gap: 11px; align-items: flex-end;
      padding: 12px 10px; border-radius: 22px;
      background: var(--bg-bar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bdr); box-shadow: var(--rim);
    }
    .depth-rail-sep {
      width: 100%; height: 1px; background: var(--bdr); margin: -3px 0;
    }
    .depth-node {
      display: flex; align-items: center; gap: 9px; cursor: pointer;
      color: var(--t3); font-size: 12px; font-weight: 600;
      transition: all 0.22s var(--snap); opacity: 0.58;
      padding: 2px 2px 2px 6px; border-radius: 99px;
    }
    .depth-node:hover { opacity: 0.95; color: var(--t1); }
    .depth-node.active { color: var(--cyan); opacity: 1; font-weight: 700; }
    .depth-node.gm-node { color: var(--amber); opacity: 0.78; }
    .depth-node.gm-node.gm-locked { color: var(--violet); opacity: 0.76; }
    .depth-node.gm-node.active { color: var(--amber); opacity: 1; font-weight: 700; }
    .depth-pip {
      width: 7px; height: 7px; border-radius: 99px; background: currentColor;
      transition: all 0.28s var(--snap);
    }
    .depth-node.active .depth-pip {
      height: 24px; width: 7px; background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
    }
    .depth-node.gm-node.active .depth-pip {
      background: var(--amber); box-shadow: 0 0 14px var(--amber);
    }

    /* ==========================================================================
       5-LAYER VERTICAL 3D CAMERA STAGE (L-1:集團, L0:部門, L1:專案, L2:時間軸, L3:詳情)
       ========================================================================== */
    .camera-world {
      position: relative; z-index: 10; width: 100vw; height: 100vh; overflow: hidden;
      cursor: grab; touch-action: none;
    }
    .camera-world:active { cursor: grabbing; }

    .spatial-layer {
      position: absolute; inset: 0; padding: var(--top-clearance, 78px) 104px 24px 28px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: transform 0.48s var(--snap), opacity 0.40s var(--snap), padding-top 0.30s var(--snap);
      will-change: transform, opacity;
    }
    .spatial-layer.at-surface { transform: translate3d(0, 0, 0) scale(1); opacity: 1; pointer-events: auto; }
    .spatial-layer.dived-past { transform: translate3d(0, -18vh, 0) scale(1.06); opacity: 0; pointer-events: none !important; }
    .spatial-layer.dived-past * { pointer-events: none !important; }
    .spatial-layer.below-surface { transform: translate3d(0, 20vh, 0) scale(0.92); opacity: 0; pointer-events: none !important; }
    .spatial-layer.below-surface * { pointer-events: none !important; }

    /* GM Top Layer (集團 · 總經理全域指揮台) — Precision Aerospace / FUI HUD Console */
    .gm-command-card {
      position: relative;
      width: 1080px; max-width: 94vw; max-height: calc(100vh - var(--top-clearance, 78px) - 58px);
      border-radius: 2px; padding: 0;
      background:
        linear-gradient(rgba(148, 163, 184, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.032) 1px, transparent 1px),
        linear-gradient(180deg, rgba(8, 14, 28, 0.95) 0%, rgba(5, 10, 20, 0.97) 100%);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.24);
      box-shadow: 0 34px 80px -18px rgba(0, 0, 0, 0.88), inset 0 1px 0 rgba(56, 189, 248, 0.18);
      display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; cursor: default;
    }
    [data-theme="light"] .gm-command-card {
      background:
        linear-gradient(rgba(15, 23, 42, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.032) 1px, transparent 1px),
        linear-gradient(180deg, rgba(252, 254, 255, 0.97) 0%, rgba(241, 245, 249, 0.98) 100%);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      border-color: rgba(2, 132, 199, 0.28);
      box-shadow: 0 28px 64px -18px rgba(15, 23, 42, 0.18), inset 0 1px 0 #ffffff;
    }
    /* 4-Corner Tactical Reticle L-Brackets */
    .gm-reticle {
      position: absolute; width: 12px; height: 12px; pointer-events: none; z-index: 3;
      border-color: var(--cyan); border-style: solid; opacity: 0.9;
    }
    .gm-reticle.tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
    .gm-reticle.tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
    .gm-reticle.bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
    .gm-reticle.br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

    .gm-sys-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 7px 22px; background: rgba(56, 189, 248, 0.055);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);

    /* ==========================================================================

       - Master Password (👑 總經理主控密碼) -> KEK_MASTER -> unwraps ALL Dept KEKs!
       - Dept Password (🔑 財務部 / 管理部 / ...) -> KEK_dept -> unwraps ONLY that Dept!
       - sessionKeks lives ONLY in volatile RAM — NEVER written to localStorage / HTML / JSON!
       ========================================================================== */
    let sessionKeks = {};
    let sessionUnlockedBy = "";
    let _pendingUnlockCallback = null;
    let _pendingUnlockRequireMaster = false;
    let _pendingUnlockRequiredRole = "";

    const CURRENCY_RE = /[0-9][0-9,.\s~～–—]*\s*(?:億|萬元|萬)|\bNT\$\s*[0-9,.]+/g;

    function hasCurrencyText(str) {
      if (!str) return false;
      CURRENCY_RE.lastIndex = 0;
      return CURRENCY_RE.test(String(str));
    }

    function maskCurrencyText(str, replacement = "🔒 [機密保護]") {
      if (!str) return "";
      return String(str).replace(CURRENCY_RE, replacement);
    }

    function roleKeyOf(vaultDept) {
      if (!vaultDept || vaultDept === "僅總經理" || vaultDept === "MASTER") return "MASTER";
      return vaultDept;
    }

    function roleDisplayName(roleKey) {
      if (!roleKey || roleKey === "MASTER") return "僅總經理";
      return roleKey;
    }

    function ensureVaultStruct(st) {
      if (!st.vault || typeof st.vault !== "object") {
        st.vault = {
          enabled: false,
          roles: {}
        };
      }
      if (!st.vault.roles) st.vault.roles = {};
      delete st.vault.groupCapexConfidential;
      delete st.vault.groupCapexVaultDept;
      delete st.vault.encGroupCapex;
      return st.vault;
    }

    function deriveRoleAuthToken(kekBytes) {
      if (!kekBytes) return "";
      const raw = new TextEncoder().encode("YX-AUTH-V1:" + VaultCrypto.toB64(kekBytes));
      return VaultCrypto.toB64(VaultCrypto.sha256(raw));
    }

    function deriveRoleAuthVerifier(tokenStr) {
      if (!tokenStr) return "";
      const raw = new TextEncoder().encode("YX-VERIFY-V1:" + tokenStr);
      return VaultCrypto.toB64(VaultCrypto.sha256(raw));
    }

    function getActiveAuthTokensMap() {
      const out = {};
      Object.keys(sessionKeks || {}).forEach(rk => {
        if (sessionKeks[rk]) out[rk] = deriveRoleAuthToken(sessionKeks[rk]);
      });
      return out;
    }

    function canManageProjectSharing(p) {
      if (!store || !store.vault || !store.vault.enabled) return true;
      if (isMasterUnlocked()) return true;
      if (!p || !p.leadDept) return false;
      return canAccessDepartment(p.leadDept);
    }

    function getDecryptedMasterKeyBook() {
      if (!isMasterUnlocked() || !store.vault || !store.vault.masterKeyBook) return {};
      try {
        return VaultCrypto.decryptJson(sessionKeks["MASTER"], store.vault.masterKeyBook) || {};
      } catch (e) {
        return {};
      }
    }

    function hasAnyUnlockedKey() {
      return Object.keys(sessionKeks).length > 0;
    }

    function isMasterUnlocked() {
      return !!sessionKeks["MASTER"];
    }

    function canAccessGroupLayer() {
      if (store && store.vault && store.vault.redactedPublicEdition) return false;
      if (!store || !store.vault || !store.vault.enabled) return true;
      return isMasterUnlocked();
    }

    function canAccessRole(vaultDept) {
      const rk = roleKeyOf(vaultDept);
      return !!(sessionKeks["MASTER"] || sessionKeks[rk]);
    }

    function canAccessDepartment(dept) {
      if (!store || !store.vault || !store.vault.enabled) return true;
      if (isMasterUnlocked()) return true;
      if (!dept || dept === "ALL") return false;
      return canAccessRole(dept);
    }

    function canAccessProjectByDept(p) {
      if (!p) return false;
      if (!store || !store.vault || !store.vault.enabled) return true;
      if (isMasterUnlocked()) return true;
      if (canAccessDepartment(p.leadDept)) return true;
      if (Array.isArray(p.sharedDepts) && p.sharedDepts.some(d => canAccessDepartment(d))) return true;
      return false;
    }

    function getKekForRole(vaultDept) {
      const rk = roleKeyOf(vaultDept);
      if (sessionKeks[rk]) return sessionKeks[rk];
      if (rk === "MASTER" && sessionKeks["MASTER"]) return sessionKeks["MASTER"];
      return null;
    }

    function hasLockedItemsInMemory() {
      if (store.vault && store.vault.enabled) {
        if (!isMasterUnlocked()) return true;
        for (const p of projects) {
          if (p._locked || p._deptLocked) return true;
        }
      }
      return false;
    }

    function decryptAuthorizedItemsInMemory() {
      if (!store.vault || !store.vault.enabled) return 0;
      let unlockedCount = 0;

      projects.forEach(p => {
        // 1. Decrypt per-department standalone envelope if present
        if (p.encDeptPayload && p.deptWraps && typeof p.deptWraps === "object") {
          let projDek = null;
          for (const rk of Object.keys(sessionKeks)) {
            if (p.deptWraps[rk] && sessionKeks[rk]) {
              try {
                projDek = VaultCrypto.decryptBytes(sessionKeks[rk], p.deptWraps[rk]);
                break;
              } catch (e) {}
            }
          }
          if (projDek) {
            try {
              const decBody = VaultCrypto.decryptJson(projDek, p.encDeptPayload);
              Object.assign(p, decBody);
              p._deptLocked = false;
              p._locked = false;
              delete p.encDeptPayload;
              delete p.deptWraps;
              unlockedCount++;
            } catch (e) {}
          }
        }

        // 2. Legacy encPayload compatibility
        p.secMode = "none";
        const kek = getKekForRole(p.vaultDept) || getKekForRole(p.leadDept) || sessionKeks["MASTER"];
        if (kek && p._locked && p.encPayload) {
          try {
            const secretObj = VaultCrypto.decryptJson(kek, p.encPayload);
            delete secretObj.vendorReviews;
            Object.assign(p, secretObj);
            p._locked = false;
            delete p.encPayload;
            unlockedCount++;
          } catch (e) {}
        }

        delete p.vendorReviews;

        if (Array.isArray(p.events) && kek) {
          p.events.forEach(ev => {
            if (ev._lockedEv && ev.encEv) {
              try {
                const decEv = VaultCrypto.decryptJson(kek, ev.encEv);
                Object.assign(ev, decEv);
                ev._lockedEv = false;
                delete ev.encEv;
                unlockedCount++;
              } catch (e) {}
            } else if (ev._lockedEvFields && ev.encEvFields) {
              try {
                const decF = VaultCrypto.decryptJson(kek, ev.encEvFields);
                Object.assign(ev, decF);
                ev._lockedEvFields = false;
                delete ev.encEvFields;
              } catch (e) {}
            }
          });
        }
      });

      return unlockedCount;
    }

    function markEncryptedStoreFlags(st) {
      ensureVaultStruct(st);
      delete st.groupCapex;
      delete st._groupCapexLocked;
      (st.projects || []).forEach(p => {
        p.secMode = "none";
        delete p.vendorReviews;
        if (p.encDeptPayload) p._deptLocked = true;
        if (p.encPayload) p._locked = true;
        (p.events || []).forEach(ev => {
          if (ev.encEv) ev._lockedEv = true;
          if (ev.encEvFields) ev._lockedEvFields = true;
        });
      });
    }

    function serializeProjectCleanForServer(p) {
      const c = JSON.parse(JSON.stringify(p));
      c.secMode = "none";
      delete c._locked;
      delete c._deptLocked;
      delete c.encPayload;
      delete c.encDeptPayload;
      delete c.deptWraps;
      delete c.vendorReviews;
      (c.events || []).forEach(ev => {
        delete ev._lockedEv;
        delete ev._lockedEvFields;
        delete ev.encEv;
        delete ev.encEvFields;
      });
      return c;
    }

    function serializeStoreForDisk(mode = "encrypted") {
      const out = JSON.parse(JSON.stringify(store));
      ensureVaultStruct(out);
      delete out.groupCapex;
      delete out._groupCapexLocked;

      if (mode === "nas_plain") {
        out.projects = (out.projects || []).map(serializeProjectCleanForServer);
        return out;
      }

      if (mode === "redacted_public") {
        if (Array.isArray(out.customPhases)) {
          out.customPhases = out.customPhases.filter(x => !hasCurrencyText(x));
        }
        if (Array.isArray(out.customStatuses)) {
          out.customStatuses = out.customStatuses.filter(x => !hasCurrencyText(x));
        }
        out.vault = { enabled: false, redactedPublicEdition: true, roles: {} };
        out.projects = (out.projects || [])
          .filter(p => !p._deptLocked && p.leadDept !== "財務部" && p.leadDept !== "人資部")
          .map(p => {
            const c = serializeProjectCleanForServer(p);
            c.budget = "依權限不公開";
            c.finance = "依權限不公開";
            c.pivotSummary = maskCurrencyText(c.pivotSummary || "", "[不公開]");
            c.nextSteps = maskCurrencyText(c.nextSteps || "", "[不公開]");
            return c;
          });
        return out;
      }

      if (!out.vault.enabled) {
        out.projects = (out.projects || []).map(serializeProjectCleanForServer);
        return out;
      }

      // Per-department AES-256 envelope encryption for Standalone HTML / JSON backups
      out.projects = (out.projects || []).map((p, idx) => {
        const origP = projects[idx] || p;
        if (origP._deptLocked && origP.encDeptPayload && origP.deptWraps) {
          return JSON.parse(JSON.stringify(origP));
        }

        const targetRoles = Array.from(new Set(["MASTER", p.leadDept || "工務部", ...(p.sharedDepts || [])]));
        const availableWraps = {};
        const projDek = VaultCrypto.randBytes(64);
        targetRoles.forEach(rk => {
          if (sessionKeks[rk]) {
            availableWraps[rk] = VaultCrypto.encryptBytes(sessionKeks[rk], projDek);
          }
        });

        if (!Object.keys(availableWraps).length) {
          return serializeProjectCleanForServer(p);
        }

        const cleanBody = serializeProjectCleanForServer(p);
        const encDeptPayload = VaultCrypto.encryptJson(projDek, cleanBody);
        return {
          id: p.id,
          code: p.code || `PJ-${String(idx + 1).padStart(2, "0")}`,
          leadDept: p.leadDept || "工務部",
          sharedDepts: p.sharedDepts || [],
          secMode: "none",
          _deptLocked: true,
          shortName: `部門保護專案 (${p.code || 'PJ'})`,
          fullName: `需「${p.leadDept || '授權部門'}」或總經理專屬鑰匙解鎖`,
          sheetName: `${p.code || 'PJ'}_Protected`,
          tagLoc: `${p.leadDept || ''}專屬`,
          statusShort: "部門隔離保護",
          status: "部門隔離保護",
          statusColor: "purple",
          progressPct: 0,
          stageIndex: 1,
          heroNum: "需授權鑰匙",
          heroUnit: `${p.leadDept || '部門'}專屬保護`,
          microTag: "已透過部門專屬金鑰 AES-256 隔離保護",
          oneLiner: "",
          location: "",
          scale: "",
          budget: "",
          finance: "",
          partners: "",
          pivotSummary: "",
          nextSteps: "",
          quickStats: [],
          quickIds: [],
          events: [],
          deptWraps: availableWraps,
          encDeptPayload
        };
      });

      return out;
    }

    /* Clean all dynamic V16 DOM containers in a cloned document so ZERO plaintext ever leaks into saved HTML! */
    function cleanClonedDomForSave(clone) {
      [
        "#groupCardView", "#groupListView",
        "#treeTierGroup", "#treeTierDept", "#treeTierProj", "#treeTierMs", "#treeStem1", "#treeStem2",
        "#deptCardsHost", "#deptStrip", "#deptListView",
        "#projectCardsHost", "#pjStrip", "#pjListView",
        "#msCardsHost", "#laserScrubber", "#msListView",
        "#detailStageCard",
        "#sheetInner", "#searchLayer", "#printArea", "#cacheConflictBanner"
      ].forEach(sel => {
        const el = clone.querySelector(sel);
        if (el) el.innerHTML = "";
      });

      ["#map3dStage", "#jarvisModalBg", "#jarvisSideDock", "#jarvisDocFileInput", "#v18Map3DStyle", "#v18JarvisStyle", "#mobileWarRoom", "#mobCheckinModalBg", "#v19KillerFeaturesStyle"].forEach(sel => {

      clone.classList.remove("yx-mobile-mode");

      if (cVlt) { cVlt.innerHTML = '<svg class="ic-sm" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg><span>權限鎖</span>'; cVlt.className = "vault-btn"; }
      const cGmLbl = clone.querySelector("#dNodeGroupLbl");

      ["#sheetBg", "#coachBg", "#searchLayer", "#toast", "#dropShield", "#unsavedDot", "#cacheConflictBanner"].forEach(sel => {

    async function setupOrUpdateVaultPasswords(masterPw, deptPwMap) {
      ensureVaultStruct(store);
      const iterations = 100000;

      const prevMasterKek = sessionKeks["MASTER"] || null;
      let keyBook = {};
      if (prevMasterKek && store.vault.masterKeyBook) {
        try {
          keyBook = VaultCrypto.decryptJson(prevMasterKek, store.vault.masterKeyBook) || {};
        } catch (e) { keyBook = {}; }
      }

      // Ensure all existing dept KEKs are unwrapped before rotating masterKek
      const allDepts = Array.from(new Set([...DEFAULT_DEPTS, ...(store.departments || [])]));
      if (prevMasterKek) {
        for (const dept of allDepts) {
          if (!sessionKeks[dept] && store.vault.roles[dept] && store.vault.roles[dept].masterWrap) {
            try { sessionKeks[dept] = VaultCrypto.decryptBytes(prevMasterKek, store.vault.roles[dept].masterWrap); } catch (e) {}
          }
        }
      }

      let masterKek = prevMasterKek;
      if (masterPw && masterPw.trim().length >= 4) {
        masterKek = VaultCrypto.randBytes(64);
        const mSalt = VaultCrypto.randBytes(16);
        const mDerived = await VaultCrypto.deriveKey64(masterPw.trim(), mSalt, iterations);
        const mTok = deriveRoleAuthToken(masterKek);
        store.vault.roles["MASTER"] = {
          salt: VaultCrypto.toB64(mSalt),
          iter: iterations,
          wrappedKek: VaultCrypto.encryptBytes(mDerived, masterKek),
          authVerifier: deriveRoleAuthVerifier(mTok)
        };
        keyBook["MASTER"] = masterPw.trim();
      } else if (!store.vault.roles["MASTER"]) {
        throw new Error("首次啟用權限金庫，請設定至少 4 碼的「總經理萬能密碼」！");
      } else {
        if (!masterKek) masterKek = VaultCrypto.randBytes(64);
        const mTok = deriveRoleAuthToken(masterKek);
        store.vault.roles["MASTER"].authVerifier = deriveRoleAuthVerifier(mTok);
      }
      sessionKeks["MASTER"] = masterKek;
      sessionUnlockedBy = "MASTER";

      for (const dept of allDepts) {
        const existingRole = store.vault.roles[dept] || {};
        let deptKek = sessionKeks[dept];
        if (!deptKek) deptKek = VaultCrypto.randBytes(64);

        const newDeptPw = deptPwMap && deptPwMap[dept];
        const roleEntry = {
          salt: existingRole.salt || null,
          iter: existingRole.iter || iterations,
          wrappedKek: existingRole.wrappedKek || null,
          masterWrap: null,
          authVerifier: existingRole.authVerifier || null
        };

        if (newDeptPw === "__CLEAR__") {
          deptKek = VaultCrypto.randBytes(64);
          roleEntry.salt = null;
          roleEntry.wrappedKek = null;
          roleEntry.authVerifier = null;
          delete keyBook[dept];
        } else if (typeof newDeptPw === "string" && newDeptPw.trim().length > 0) {
          if (newDeptPw.trim().length < 4) throw new Error(`「${dept}」密碼長度請至少 4 碼`);
          deptKek = VaultCrypto.randBytes(64);
          const dSalt = VaultCrypto.randBytes(16);
          const dDerived = await VaultCrypto.deriveKey64(newDeptPw.trim(), dSalt, iterations);
          roleEntry.salt = VaultCrypto.toB64(dSalt);
          roleEntry.iter = iterations;
          roleEntry.wrappedKek = VaultCrypto.encryptBytes(dDerived, deptKek);
          keyBook[dept] = newDeptPw.trim();
        }

        sessionKeks[dept] = deptKek;
        roleEntry.masterWrap = VaultCrypto.encryptBytes(masterKek, deptKek);
        if (roleEntry.wrappedKek) {
          roleEntry.authVerifier = deriveRoleAuthVerifier(deriveRoleAuthToken(deptKek));
        }
        store.vault.roles[dept] = roleEntry;
      }

      store.vault.masterKeyBook = VaultCrypto.encryptJson(masterKek, keyBook);
      store.vault.enabled = true;
      decryptAuthorizedItemsInMemory();
    }

    async function unlockWithPassword(password) {
      ensureVaultStruct(store);
      if (!store.vault.enabled) return { ok: false, msg: "尚未啟用加密金庫" };
      const pw = (password || "").trim();
      if (!pw) return { ok: false, msg: "請輸入密碼" };

      const mRole = store.vault.roles["MASTER"];
      if (mRole && mRole.salt && mRole.wrappedKek) {
        try {
          const mDerived = await VaultCrypto.deriveKey64(pw, VaultCrypto.fromB64(mRole.salt), mRole.iter || 100000);
          const masterKek = VaultCrypto.decryptBytes(mDerived, mRole.wrappedKek);
          sessionKeks["MASTER"] = masterKek;
          sessionUnlockedBy = "MASTER";

          Object.keys(store.vault.roles).forEach(rk => {
            if (rk === "MASTER") return;
            const rObj = store.vault.roles[rk];
            if (rObj && rObj.masterWrap) {
              try { sessionKeks[rk] = VaultCrypto.decryptBytes(masterKek, rObj.masterWrap); } catch (e) {}
            }
          });
          decryptAuthorizedItemsInMemory();
          return { ok: true, role: "MASTER", label: "總經理全權限" };
        } catch (e) {}
      }

      for (const rk of Object.keys(store.vault.roles)) {
        if (rk === "MASTER") continue;
        const rObj = store.vault.roles[rk];
        if (!rObj || !rObj.salt || !rObj.wrappedKek) continue;
        try {
          const dDerived = await VaultCrypto.deriveKey64(pw, VaultCrypto.fromB64(rObj.salt), rObj.iter || 100000);
          const deptKek = VaultCrypto.decryptBytes(dDerived, rObj.wrappedKek);
          sessionKeks[rk] = deptKek;
          if (sessionUnlockedBy !== "MASTER") {
            const parts = sessionUnlockedBy ? sessionUnlockedBy.split(" + ").filter(Boolean) : [];
            if (!parts.includes(rk)) parts.push(rk);
            sessionUnlockedBy = parts.join(" + ");
          }
          decryptAuthorizedItemsInMemory();
          return { ok: true, role: rk, label: `${rk}專屬鑰匙` };
        } catch (e) {}
      }

      return { ok: false, msg: "鑰匙密碼不正確，無法解開 AES-256 金庫" };
    }

    function lockSessionNow() {
      const wasNas = (typeof nasServerActive !== "undefined" && nasServerActive);
      const encryptedSnap = wasNas ? JSON.parse(JSON.stringify(store)) : serializeStoreForDisk("encrypted");
      sessionKeks = {};
      sessionUnlockedBy = "";
      _pendingUnlockCallback = null;
      _pendingUnlockRequireMaster = false;
      _pendingUnlockRequiredRole = "";
      if (wasNas) {
        encryptedSnap.projects = [];
      } else {
        markEncryptedStoreFlags(encryptedSnap);
      }
      store = encryptedSnap;
      projects = store.projects;
      if (!wasNas) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(encryptedSnap)); } catch (e) {}
      }
      closeSheet();
      if (typeof toggleMap3DMode === "function" && window._yxMap3DOpen) toggleMap3DMode(false);
      if (typeof closeJarvisHud === "function") closeJarvisHud();
      if (typeof closeJarvisSideDock === "function") closeJarvisSideDock();
      if (typeof closeMobileFieldCheckin === "function") closeMobileFieldCheckin();
      if (activeDept === "ALL") {
        activeDept = (store.departments && store.departments[0]) || "工務部";
        activePj = 0;
      }
      if (depth !== 0) {
        diveToDepth(0);
      }
      refreshAllLayers();
      renderVaultTopPill();
      toastMsg("已上鎖登出！集團頂層與七大部門資料皆已隔離保護");
    }

    async function saveRedactedPublicHTML(forceDownload = false) {

      const publicStore = serializeStoreForDisk("redacted_public");
      publicStore.updatedAt = Date.now();

      const clone = document.documentElement.cloneNode(true);
      const embEl = clone.querySelector("#embeddedStore");
      if (embEl) embEl.textContent = "\n" + JSON.stringify(publicStore, null, 2).replace(/<\//g, "<\\/") + "\n  ";
      cleanClonedDomForSave(clone);

      const finalHtml = "<!DOCTYPE html>\n" + clone.outerHTML;
      const defaultName = "有興國際_專案履歷控制中心_公開脫敏版.html";

      if (!forceDownload && window.showSaveFilePicker && navigator.userActivation && navigator.userActivation.isActive) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: defaultName,
            types: [{ description: "物理脫敏公開網頁檔 (.html)", accept: { "text/html": [".html"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(finalHtml);
          await writable.close();
          closeSheet();
          toastMsg("✓ 已匯出「物理脫敏公開版 .html」！機密與金額已 100% 物理移除");
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }

      const blob = new Blob([finalHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = defaultName;
      a.click();
      URL.revokeObjectURL(url);
      closeSheet();
      toastMsg("✓ 已下載「物理脫敏公開版 .html」！可安心發送至大群組");
    }

    /* ==========================================================================
       CORE STORE & 4-LAYER CONTROL CENTER STATE
       depth: 0 = 部門 (Dept), 1 = 專案 (Projects), 2 = 時間軸 (Timeline), 3 = 詳情 (Detail)
       viewMode: "card" (3D Spatial) | "list" (Structured Control Table)
       ========================================================================== */
    const LAST_SEEN_EMB_DIGEST_KEY = STORAGE_KEY + "_last_emb_digest";
    let _cacheConflictState = null;

    function fmtSeq(n) {
      return String(n).padStart(2, "0");
    }

    function computeStoreContentDigest(st) {
      if (!st || typeof st !== "object") return "empty";
      const canonical = {
        vaultEnabled: !!(st.vault && st.vault.enabled),
        projects: (st.projects || []).map(p => ({
          id: p.id, code: p.code, shortName: p.shortName, fullName: p.fullName,
          leadDept: p.leadDept, sharedDepts: p.sharedDepts || [],
          secMode: p.secMode || "none", statusShort: p.statusShort, progressPct: p.progressPct,
          heroNum: p.heroNum, heroUnit: p.heroUnit, tagLoc: p.tagLoc, microTag: p.microTag,
          location: p.location, scale: p.scale, budget: p.budget, finance: p.finance,
          partners: p.partners, pivotSummary: p.pivotSummary, nextSteps: p.nextSteps,
          quickStats: p.quickStats || [],
          quickIds: p.quickIds || [],
          encPayload: !!p.encPayload,
          events: (p.events || []).map(e => ({
            id: e.id, date: e.date, rocDate: e.rocDate, phase: e.phase,
            isKey: !!e.isKey, isSecret: !!e.isSecret, title: e.title,
            summary: e.summary, metrics: e.metrics, docs: e.docs,
            docLinks: e.docLinks || {},
            photosLen: Array.isArray(e.photos) ? e.photos.length : 0,
            pivotMeta: e.pivotMeta || null,
            note: e.note, encEv: !!e.encEv
          }))
        }))
      };
      const s = JSON.stringify(canonical);
      let h1 = 0x811c9dc5;
      for (let i = 0; i < s.length; i++) {
        h1 ^= s.charCodeAt(i);
        h1 = Math.imul(h1, 0x01000193) >>> 0;
      }
      return h1.toString(16) + "_" + s.length;
    }

    function parseMoneyTextToWan(txt) {
      if (!txt) return 0;

      const mYi = s.match(/([0-9]+(?:\.[0-9]+)?)\s*億/);
      if (mYi) return Math.round(parseFloat(mYi[1]) * 10000);
      const mWan = s.match(/([0-9]+(?:\.[0-9]+)?)\s*萬/);
      if (mWan) return Math.round(parseFloat(mWan[1]));
      return 0;
    }

    function loadInitialStore() {
      const emb = getEmbeddedStore();
      normalizeProjects(emb.projects);
      markEncryptedStoreFlags(emb);
      if (location.protocol === "http:" || location.protocol === "https:") {
        // On HTTP/HTTPS (Synology NAS mode), never let stale browser localStorage shadow server state
        return JSON.parse(JSON.stringify(emb));
      }
      const embDigest = computeStoreContentDigest(emb);
      try {
        const lastSeenEmb = localStorage.getItem(LAST_SEEN_EMB_DIGEST_KEY) || "";
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const loc = JSON.parse(raw);
          if (loc && Array.isArray(loc.projects) && loc.projects.length > 0) {
            normalizeProjects(loc.projects);
            markEncryptedStoreFlags(loc);
            const locDigest = computeStoreContentDigest(loc);
            if (locDigest !== embDigest) {
              if (lastSeenEmb && lastSeenEmb === embDigest && (loc.updatedAt || 0) > (emb.updatedAt || 0)) {
                // Same HTML file reloaded with unsaved local browser edits -> show local + banner
                _cacheConflictState = {
                  mode: "same_file_unsaved_cache",
                  activeSource: "local",
                  altStore: JSON.parse(JSON.stringify(emb)),
                  embDigest,
                  locUpdatedAt: loc.updatedAt || 0,
                  embUpdatedAt: emb.updatedAt || 0
                };
                return loc;
              } else {
                // Newly opened / colleague-updated HTML file differs from browser localStorage!
                // NEVER silently eat the newly opened file — load file's embeddedStore & show conflict banner!
                _cacheConflictState = {
                  mode: "new_file_vs_cache",
                  activeSource: "file",
                  altStore: JSON.parse(JSON.stringify(loc)),
                  embDigest,
                  locUpdatedAt: loc.updatedAt || 0,
                  embUpdatedAt: emb.updatedAt || 0
                };
                return JSON.parse(JSON.stringify(emb));
              }
            }
          }
        }
        localStorage.setItem(LAST_SEEN_EMB_DIGEST_KEY, embDigest);
      } catch (e) {}
      return JSON.parse(JSON.stringify(emb));
    }

    function commitStore(markDirty = true) {
      store.updatedAt = Date.now();

        hasUnsavedFileChanges = false;

        normalizeProjects(emb.projects);
        localStorage.setItem(LAST_SEEN_EMB_DIGEST_KEY, computeStoreContentDigest(emb));

    function _evChronoSortKey(ev) {
      if (!ev) return "0000-00-00";
      const rm = String(ev.rocDate || "").match(/^(\d{2,3})[./\-](\d{1,2})(?:[./\-](\d{1,2}))?/);
      if (rm) {
        return `${parseInt(rm[1], 10) + 1911}-${rm[2].padStart(2, "0")}-${(rm[3] || "00").padStart(2, "0")}`;
      }
      const wm = String(ev.date || "").match(/^(\d{4})[./\-](\d{1,2})(?:[./\-](\d{1,2}))?/);
      if (wm) {
        return `${wm[1]}-${wm[2].padStart(2, "0")}-${(wm[3] || "00").padStart(2, "0")}`;
      }
      return String(ev.date || "");
    }

    /* ==========================================================================
       120Hz INERTIAL SPRING PHYSICS ENGINE (`SpringTrack`)
       - Fixes clunky single-card snap! Dragging 2-3 cards or flicking fast
         projects momentum naturally across multiple cards with critically-damped
         spring settling and zero GPU-stalling CSS blur/transition conflicts.
       ========================================================================== */
    class SpringTrack {
      constructor(onUpdate, onIndexChange) {
        this.count = 0;
        this.pos = 0;
        this.vel = 0;
        this.target = 0;
        this.dragging = false;
        this.dragBasePos = 0;
        this.raf = 0;
        this.lastT = 0;
        this.lastReportedIdx = 0;
        this.onUpdate = onUpdate;
        this.onIndexChange = onIndexChange;
      }

      setCount(n, initialIdx = 0) {
        this.count = Math.max(0, n);
        const clamped = Math.max(0, Math.min(Math.max(0, n - 1), initialIdx));
        this.cancelAnim();
        this.pos = clamped;
        this.target = clamped;
        this.vel = 0;
        this.lastReportedIdx = clamped;
        this.onUpdate(this.pos);
      }

      cancelAnim() {
        if (this.raf) {
          cancelAnimationFrame(this.raf);
          this.raf = 0;
        }
      }

      startDrag() {
        if (this.count <= 1) return;
        this.cancelAnim();
        this.dragging = true;
        this.dragBasePos = this.pos;
        this.vel = 0;
      }

      moveDrag(dx, unitPx = 215) {
        if (!this.dragging || this.count <= 1) return;
        const maxIdx = this.count - 1;
        const raw = this.dragBasePos - dx / unitPx;
        if (raw < 0) this.pos = raw * 0.28;
        else if (raw > maxIdx) this.pos = maxIdx + (raw - maxIdx) * 0.28;
        else this.pos = raw;

        this.onUpdate(this.pos);
        const nearest = Math.max(0, Math.min(maxIdx, Math.round(this.pos)));
        if (nearest !== this.lastReportedIdx) {
          this.lastReportedIdx = nearest;
          if (this.onIndexChange) this.onIndexChange(nearest, true);
        }
      }

      endDrag(dx, vxPxPerMs, unitPx = 215) {
        if (!this.dragging) return;
        this.dragging = false;
        if (this.count <= 1) {
          this.goTo(0, true);
          return;
        }
        const maxIdx = this.count - 1;
        const vCardsPerSec = (-vxPxPerMs * 1000) / unitPx;
        const projected = this.pos + vCardsPerSec * 0.22;
        let nextIdx = Math.round(projected);
        const startRound = Math.round(this.dragBasePos);

        if (nextIdx === startRound && (Math.abs(dx) > 28 || Math.abs(vxPxPerMs) > 0.22)) {
          nextIdx = startRound + (dx < 0 ? 1 : -1);
        }
        nextIdx = Math.max(0, Math.min(maxIdx, nextIdx));
        this.vel = vCardsPerSec;
        this.goTo(nextIdx, false);
      }

      step(delta) {
        if (this.count <= 1) return;
        const nextIdx = Math.max(0, Math.min(this.count - 1, this.target + delta));
        this.goTo(nextIdx, false);
      }

      goTo(idx, immediate = false) {
        const maxIdx = Math.max(0, this.count - 1);
        const clamped = Math.max(0, Math.min(maxIdx, idx));
        this.target = clamped;
        if (clamped !== this.lastReportedIdx) {
          this.lastReportedIdx = clamped;
          if (this.onIndexChange) this.onIndexChange(clamped, false);
        } else if (this.onIndexChange) {
          this.onIndexChange(clamped, false);
        }

        if (immediate) {
          this.cancelAnim();
          this.pos = clamped;
          this.vel = 0;
          this.onUpdate(this.pos);
          return;
        }

        if (!this.raf) {
          this.lastT = performance.now();
          const tick = now => {
            const dt = Math.min(0.032, Math.max(0.001, (now - this.lastT) / 1000));
            this.lastT = now;
            // Critically-damped spring: k = 245, c = 31 (zero overshoot bounce, ultra-crisp landing)
            const accel = -245 * (this.pos - this.target) - 31 * this.vel;
            this.vel += accel * dt;
            this.pos += this.vel * dt;
            this.onUpdate(this.pos);

            if (Math.abs(this.pos - this.target) < 0.0012 && Math.abs(this.vel) < 0.01) {
              this.pos = this.target;
              this.vel = 0;
              this.raf = 0;
              this.onUpdate(this.pos);
              return;
            }
            this.raf = requestAnimationFrame(tick);
          };
          this.raf = requestAnimationFrame(tick);
        }
      }
    }

    function applyLinearCoverFlow(cards, pos, baseSpread1 = 305, baseSpread2 = 175) {
      if (window._yxMobileMode) return;
      const vw = window.innerWidth || 1440;
      const isCompact = vw <= 1560;
      const spread1 = isCompact ? Math.min(baseSpread1, 210) : baseSpread1;
      const spread2 = isCompact ? Math.min(baseSpread2, 102) : baseSpread2;
      const maxVisAbs = isCompact ? 1.85 : 3.25;

      for (let i = 0; i < cards.length; i++) {
        const el = cards[i];
        const diff = i - pos;
        const abs = Math.abs(diff);

        if (abs > maxVisAbs) {
          el.style.visibility = "hidden";
          el.style.opacity = "0";
          el.style.pointerEvents = "none";
          el.classList.remove("is-front");
          continue;
        }

        const sign = diff < 0 ? -1 : 1;
        const tx = sign * (Math.min(abs, 1) * spread1 + Math.max(0, abs - 1) * spread2);
        const tz = -abs * (isCompact ? 155 : 135);
        const ry = Math.max(-34, Math.min(34, -diff * (isCompact ? 22 : 20)));
        const sc = Math.max(0.70, 1 - abs * (isCompact ? 0.125 : 0.092));
        const op = Math.max(0, 1 - Math.max(0, abs - 0.12) * (isCompact ? 0.48 : 0.35));
        const isFront = abs < 0.44;

        el.style.visibility = "visible";
        el.style.transform = `translate3d(${tx.toFixed(1)}px, 0, ${tz.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
        el.style.opacity = op.toFixed(3);
        el.style.zIndex = String(Math.round(60 - abs * 10));
        el.style.pointerEvents = abs < 1.8 ? "auto" : "none";
        el.classList.toggle("is-front", isFront);
      }

      const grid = document.getElementById("hudGrid");
      if (grid) {
        grid.style.transform = `translate3d(${(-pos * 12).toFixed(1)}px, ${(-depth * 18).toFixed(1)}px, 0)`;
      }
    }

    let _deptCardEls = [];
    let _pjCardEls = [];
    let _msCardEls = [];

    const deptTrack = new SpringTrack(
      pos => applyLinearCoverFlow(_deptCardEls, pos, 305, 175),
      (idx) => {
        const items = getDeptDeckItems();
        if (!items[idx]) return;
        activeDeptIdx = idx;
        activeDept = items[idx].key;
        activePj = 0;
        activeMs = 0;
        syncDeptPillsUI();
        updateArrowButtons("dept", idx, items.length);
      }
    );

    const pjTrack = new SpringTrack(
      pos => applyLinearCoverFlow(_pjCardEls, pos, 308, 178),
      (idx) => {
        const vis = getVisibleProjects();
        if (!vis[idx]) return;
        activePj = idx;
        activeMs = 0;
        syncPjStripActiveUI();
        updateDivePromptForProject(vis[idx]);
        updateArrowButtons("pj", idx, vis.length);
        renderHierarchyTreeNav();
      }
    );

    const msTrack = new SpringTrack(
      pos => applyLinearCoverFlow(_msCardEls, pos, 295, 168),
      (idx) => {
        activeMs = idx;
        document.querySelectorAll("#laserScrubber .yr-chip").forEach((c, i) => c.classList.toggle("active", i === idx));
        document.querySelectorAll("#treeTierMs .tree-pill[data-msidx]").forEach(btn => {
          btn.classList.toggle("active", Number(btn.getAttribute("data-msidx")) === idx);
        });
        const activeTreeMs = document.querySelector("#treeTierMs .tree-pill.active");
        if (activeTreeMs) activeTreeMs.scrollIntoView({ block: "nearest", inline: "nearest" });
        scheduleTreeStemRedraw();
        updateArrowButtons("ms", idx, _msCardEls.length);
        if (typeof scheduleAutoMarkActiveMsSeen === "function") scheduleAutoMarkActiveMsSeen();
      }
    );

    function updateArrowButtons(prefix, idx, len) {
      const pBtn = document.getElementById(prefix + "PrevBtn");
      const nBtn = document.getElementById(prefix + "NextBtn");
      if (pBtn) pBtn.disabled = idx <= 0;
      if (nBtn) nBtn.disabled = idx >= len - 1;
    }

    /* ==========================================================================
       CASCADING LEAF / BRANCH TOP NAVIGATION (`#hierarchyTreeNav`)
       - Unfurls downward row-by-row as depth increases:
         depth = -1 (集團): #treeWrapGroup (👑 集團 · 全公司戰情總覽)
         depth =  0 (部門): #treeWrapDept (7 departments)
         depth =  1 (專案): #treeWrapDept + #treeWrapProj (↳ 專案 + curved SVG stem)
         depth >= 2 (時間軸/詳情): #treeWrapDept + #treeWrapProj + #treeWrapMs (↳ 時間軸 + curved SVG stem)
       ========================================================================== */
    let _treeStemRaf = 0;
    let _topBarResizeObsInit = false;

    function syncTopBarClearance() {
      const tb = document.getElementById("topBar");
      if (!tb) return;
      const rect = tb.getBoundingClientRect();
      const needed = Math.max(76, Math.ceil(rect.bottom + 14));
      document.documentElement.style.setProperty("--top-clearance", needed + "px");
    }

    function initTopBarClearanceObserver() {
      if (_topBarResizeObsInit) return;
      const tb = document.getElementById("topBar");
      if (!tb || typeof ResizeObserver === "undefined") return;
      _topBarResizeObsInit = true;
      const ro = new ResizeObserver(() => {
        syncTopBarClearance();
        scheduleTreeStemRedraw();
      });
      ro.observe(tb);
    }

    function drawSingleBranchStem(svgId, parentSel, childBarId) {
      const svg = document.getElementById(svgId);
      const shell = document.getElementById("hierarchyTreeNav");
      const childBar = document.getElementById(childBarId);
      if (!svg || !shell || !childBar) return;

      const parentEl = document.querySelector(parentSel);
      const shellRect = shell.getBoundingClientRect();
      const childRect = childBar.getBoundingClientRect();
      if (!parentEl || shellRect.width < 16 || childRect.width < 16) {
        svg.innerHTML = "";
        return;
      }

      const pRect = parentEl.getBoundingClientRect();
      const w = Math.max(20, Math.round(shellRect.width));
      const h = 11;
      const x1 = Math.max(10, Math.min(w - 10, (pRect.left + pRect.width * 0.5) - shellRect.left));
      // Connect smoothly into the child bar's leaf tag / active pill
      const childAnchorEl = childBar.querySelector(".tree-pill.active") || childBar.querySelector(".tree-leaf-tag") || childBar;
      const caRect = childAnchorEl.getBoundingClientRect();
      const x2 = Math.max(10, Math.min(w - 10, (caRect.left + Math.min(caRect.width * 0.5, 42)) - shellRect.left));

      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      const strokeCol = svgId === "treeStem2" ? "rgba(45, 212, 191, 0.72)" : "rgba(56, 189, 248, 0.72)";
      svg.innerHTML = `
        <path d="M ${x1.toFixed(1)} 0 C ${x1.toFixed(1)} ${(h * 0.62).toFixed(1)}, ${x2.toFixed(1)} ${(h * 0.38).toFixed(1)}, ${x2.toFixed(1)} ${h}"
              fill="none" stroke="${strokeCol}" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="${x1.toFixed(1)}" cy="1.3" r="2.2" fill="${strokeCol}" />
        <circle cx="${x2.toFixed(1)}" cy="${(h - 1.2).toFixed(1)}" r="2.2" fill="${strokeCol}" />
      `;
    }

    function drawTreeBranchStems() {
      _treeStemRaf = 0;
      if (depth >= 1) {
        const parentSel = activeDept === "ALL"
          ? "#treeTierGroup .tree-pill.active"
          : `#treeTierDept .tree-pill.active`;
        drawSingleBranchStem("treeStem1", parentSel, "treeTierProj");
      } else {
        const s1 = document.getElementById("treeStem1");
        if (s1) s1.innerHTML = "";
      }

      if (depth >= 2) {
        drawSingleBranchStem("treeStem2", "#treeTierProj .tree-pill.active", "treeTierMs");
      } else {
        const s2 = document.getElementById("treeStem2");
        if (s2) s2.innerHTML = "";
      }
      syncTopBarClearance();
    }

    function scheduleTreeStemRedraw() {
      if (_treeStemRaf) return;
      _treeStemRaf = requestAnimationFrame(drawTreeBranchStems);
    }

    function renderHierarchyTreeNav() {
      initTopBarClearanceObserver();
      renderVaultTopPill();

      // Update Right Rail Group Node lock/crown state
      const gmNode = document.getElementById("dNodeGroup");
      const gmLbl = document.getElementById("dNodeGroupLbl");
      const gmAllowed = canAccessGroupLayer();
      if (gmNode && gmLbl) {
        gmNode.classList.toggle("gm-locked", !gmAllowed);
        gmLbl.innerHTML = gmAllowed
          ? `<span>集團</span><svg class="ic-sm" style="width:11px;height:11px;margin-left:3px;vertical-align:-1px;" viewBox="0 0 24 24"><polygon points="12 2 22 12 12 22 2 12"/><circle cx="12" cy="12" r="2.5"/></svg>`
          : `<span>集團</span><svg class="ic-sm" style="width:11px;height:11px;margin-left:3px;vertical-align:-1px;" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
      }

      // Unread top badge
      const totalUnread = typeof getDeptUnreadCount === "function" ? getDeptUnreadCount("ALL") : 0;
      const topUnrBtn = document.getElementById("unreadTopBtn");
      if (topUnrBtn) {
        if (totalUnread > 0) {
          topUnrBtn.style.display = "inline-flex";
          topUnrBtn.innerHTML = `<span class="unread-dot"></span><span>+${totalUnread} 新紀錄</span>`;
        } else {
          topUnrBtn.style.display = "none";
        }
      }

      const wrapGroup = document.getElementById("treeWrapGroup");
      const wrapDept = document.getElementById("treeWrapDept");
      const wrapProj = document.getElementById("treeWrapProj");
      const wrapMs = document.getElementById("treeWrapMs");
      const tierGroup = document.getElementById("treeTierGroup");
      const tierDept = document.getElementById("treeTierDept");
      const tierProj = document.getElementById("treeTierProj");
      const tierMs = document.getElementById("treeTierMs");
      if (!wrapDept || !tierDept) return;

      const inGroupContext = (depth === -1) || (activeDept === "ALL" && gmAllowed && depth >= 1);
      const showGroupBreadcrumb = (activeDept === "ALL" && gmAllowed && depth >= 1);

      // 0. Group Breadcrumb Tier (shown when diving into ALL projects from GM Command Console; hidden on depth -1 itself to keep HUD clean)
      if (wrapGroup && tierGroup) {
        wrapGroup.classList.toggle("collapsed", !showGroupBreadcrumb);
        if (showGroupBreadcrumb) {
          const allCount = projects.length;
          tierGroup.innerHTML = `
            <button type="button" class="tree-pill active" onclick="diveToDepth(-1)" title="返回總經理全域指揮台">
              <svg class="ic-sm" viewBox="0 0 24 24"><polygon points="12 2 22 12 12 22 2 12"/><circle cx="12" cy="12" r="2.5"/></svg>
              <span>總經理全域指揮台</span>
              <span class="dept-cnt mono">${allCount}</span>
            </button>
            <button type="button" class="tree-pill" onclick="openVaultStudio()" title="總經理專屬：檢視與修改自己及七大部門密碼">
              <svg class="ic-sm" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 3-9.2 9.2M15.5 7.5l3 3"/></svg>
              <span>密碼與鑰匙中樞</span>
            </button>
            <button type="button" class="tree-pill" onclick="onBrandLogoClick()" title="切換至七大部門視角">
              <svg class="ic-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span>切換七大部門 ›</span>
            </button>
          `;
        }
      }

      // 1. Row 1: 7 Departments
      wrapDept.classList.toggle("collapsed", inGroupContext);
      const svgTinyLock = `<svg class="ic-sm" style="width:11.5px;height:11.5px;opacity:0.75;" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
      const svgTinyCam = `<svg class="ic-sm" style="width:11.5px;height:11.5px;opacity:0.85;margin-left:2px;" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg>`;
      const deptItems = getDeptDeckItems();
      tierDept.innerHTML = deptItems.map(it => {
        const shortLbl = it.name.replace(/部$/, "").replace("數位發展", "數發");
        const cnt = it.visProjects.length;
        const deptLocked = typeof canAccessDepartment === "function" ? !canAccessDepartment(it.key) : false;
        const dUnr = (!deptLocked && typeof getDeptUnreadCount === "function") ? getDeptUnreadCount(it.key) : 0;
        const isAct = !inGroupContext && it.key === activeDept;
        return `
          <button type="button" class="tree-pill dept-btn ${isAct ? 'active' : ''}" data-dept="${esc(it.key)}" onclick="onTreeDeptPillClick('${esc(it.key)}')" title="${esc(it.name)}（${deptLocked ? '專屬鑰匙隔離保護中' : `共 ${cnt} 案${dUnr > 0 ? ` · ${dUnr} 筆未讀新紀錄` : ''}`}）">
            ${dUnr > 0 ? `<span class="dept-unread-dot" title="+${dUnr} 筆新紀錄"></span>` : ''}
            ${deptLocked ? svgTinyLock : ''}
            <span>${esc(shortLbl)}</span>
            <span class="dept-cnt mono ${cnt === 0 ? 'zero' : ''}">${cnt}</span>
          </button>
        `;
      }).join("");

      // 2. Row 2: Projects Leaf Branch (unfurls at depth >= 1)
      const showProjRow = depth >= 1;
      if (wrapProj && tierProj) {
        wrapProj.classList.toggle("collapsed", !showProjRow);
        if (showProjRow) {
          const vis = getVisibleProjects();
          const newDefaultDept = activeDept === "ALL" ? "工務部" : activeDept;
          const pjPills = vis.map((p, i) => {
            const fullLocked = !!(p._locked && p.secMode === "full");
            const shortLbl = fullLocked
              ? p.code
              : (p.shortName.replace(/食品廠|綜合宿舍案|工程/g, "") || p.shortName);
            const uCnt = (!fullLocked && typeof getProjectUnreadCount === "function") ? getProjectUnreadCount(p) : 0;
            const isShared = p.sharedDepts && p.sharedDepts.length > 0;
            return `
              <button type="button" class="tree-pill ${i === activePj ? 'active' : ''}" data-pjidx="${i}" onclick="onTreeProjPillClick(${i})" title="${esc(p.shortName)}">
                <span class="mono" style="font-size:10px;opacity:0.75;">${fmtSeq(i + 1)}</span>
                ${fullLocked ? svgTinyLock : ''}
                <span>${esc(shortLbl)}</span>
                ${uCnt > 0 ? `<span class="mono" style="font-size:10px;color:var(--teal);font-weight:700;">+${uCnt}</span>` : ''}
                ${isShared ? `<span style="color:var(--teal);font-size:10.5px;">⇄</span>` : ''}
              </button>
            `;
          }).join("");
          tierProj.innerHTML = `
            <span class="tree-leaf-tag" onclick="diveToDepth(1)" style="cursor:pointer;" title="點擊回到專案層">↳ 專案</span>
            ${pjPills || `<span style="font-size:11.5px;color:var(--t3);padding:0 8px;">尚無專案</span>`}
            <button type="button" class="tree-pill add-leaf" onclick="openProjectEditor(null, '${esc(newDefaultDept)}')" title="在此部門新增專案">＋</button>
          `;
        }
      }

      // 3. Row 3: Timeline Milestones Leaf Branch (unfurls at depth >= 2)
      const curP = getCurrentProject();
      const showMsRow = depth >= 2 && !!curP && !(curP._locked && curP.secMode === "full");
      if (wrapMs && tierMs) {
        tierMs.onscroll = scheduleTreeStemRedraw;
        wrapMs.classList.toggle("collapsed", !showMsRow);
        if (showMsRow) {
          const sorted = getSortedEvents(curP);
          const msPills = sorted.map((ev, idx) => {
            const hasPh = !ev._lockedEv && Array.isArray(ev.photos) && ev.photos.length > 0;
            const shortTitle = (ev.title || "").slice(0, 8);
            return `
              <button type="button" class="tree-pill ${idx === activeMs ? 'active' : ''}" data-msidx="${idx}" onclick="onTreeMsPillClick(${idx})" title="[${esc(ev.date)}] ${esc(ev.title)}">
                <span class="yr-dot ${ev.isKey ? 'piv' : ''}"></span>
                <span class="mono">${esc(ev.date)}</span>
                <span style="opacity:0.86;">${esc(shortTitle)}${(ev.title || '').length > 8 ? '…' : ''}</span>${hasPh ? svgTinyCam : ''}
              </button>
            `;
          }).join("");
          tierMs.innerHTML = `
            <span class="tree-leaf-tag" onclick="diveToDepth(2)" style="cursor:pointer;" title="點擊回到時間軸層">↳ 時間軸${depth === 3 ? ' · 詳情' : ''}</span>
            ${msPills || `<span style="font-size:11.5px;color:var(--t3);padding:0 8px;">尚無節點</span>`}
            <button type="button" class="tree-pill add-leaf" onclick="openFormSheet('${esc(curP.id)}')" title="新增大事紀節點">＋</button>
          `;
        }
      }

      requestAnimationFrame(() => {
        const actD = tierDept.querySelector(".tree-pill.active");
        if (actD) actD.scrollIntoView({ block: "nearest", inline: "nearest" });
        if (tierProj && showProjRow) {
          const actP = tierProj.querySelector(".tree-pill.active");
          if (actP) actP.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
        if (tierMs && showMsRow) {
          const actM = tierMs.querySelector(".tree-pill.active");
          if (actM) actM.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
        scheduleTreeStemRedraw();
        setTimeout(scheduleTreeStemRedraw, 220);
        setTimeout(syncTopBarClearance, 350);
      });
    }

    // Legacy compatibility alias
    function renderDeptBar() {
      renderHierarchyTreeNav();
    }
    function syncDeptGlider() {
      scheduleTreeStemRedraw();
    }

    function onTreeDeptPillClick(deptKey) {
      if (depth === 0 && activeDept === deptKey) {
        diveToDepth(1);
        return;
      }
      selectDepartment(deptKey, false);
    }

    function onTreeProjPillClick(idx) {
      selectProject(idx);
      if (depth >= 2) {
        const p = getCurrentProject();
        if (p && !(p._locked && p.secMode === "full")) {
          buildTimelineDOM();
          if (depth === 3) renderDetailLayer();
        } else {
          diveToDepth(1);
          return;
        }
        renderHierarchyTreeNav();
      }
    }

    function onTreeMsPillClick(idx) {
      const p = getCurrentProject();
      if (!p) return;
      const sorted = getSortedEvents(p);
      if (!sorted[idx]) return;
      if (sorted[idx]._lockedEv) {
        openUnlockModal(p.vaultDept || "財務部");
        return;
      }
      activeMs = idx;
      msTrack.goTo(idx, depth === 3);
      if (depth === 3) {
        detailTab = "event";
        renderDetailLayer();
      }
      renderHierarchyTreeNav();
    }

    function syncDeptPillsUI() {
      const items = getDeptDeckItems();
      document.querySelectorAll("#treeTierDept .tree-pill[data-dept]").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-dept") === activeDept);
      });
      document.querySelectorAll("#deptStrip .pjs-pill[data-didx]").forEach(btn => {
        btn.classList.toggle("active", Number(btn.getAttribute("data-didx")) === activeDeptIdx);
      });
      const curItem = items[activeDeptIdx];
      const diveTxt = document.getElementById("deptDiveTxt");
      if (diveTxt && curItem) {
        const dLocked = typeof canAccessDepartment === "function" && !canAccessDepartment(curItem.key);
        diveTxt.textContent = dLocked
          ? `🔑 輸入鑰匙解鎖進入「${curItem.name}」專案層（專屬隔離保護中）`
          : `進入「${curItem.name}」專案層（${curItem.visProjects.length} 案 · 點擊或滾輪向下）`;
      }
      scheduleTreeStemRedraw();

    function selectDepartment(deptKey, stayOnCurrentLayer = false) {
      if (deptKey === "ALL") {
        if (!canAccessGroupLayer()) {
          onGroupRailClick();
          return;
        }
        activeDept = "ALL";
        activePj = 0;
        activeMs = 0;
        closeSearch();
        buildProjectDeckDOM();
        renderHierarchyTreeNav();
        return;
      }
      if (depth !== 0 && typeof canAccessDepartment === "function" && !canAccessDepartment(deptKey)) {
        openUnlockModal(deptKey, () => {
          selectDepartment(deptKey, stayOnCurrentLayer);
        });
        return;
      }
      const items = getDeptDeckItems();
      const idx = Math.max(0, items.findIndex(x => x.key === deptKey));
      activeDeptIdx = idx;
      activeDept = items[idx].key;
      activePj = 0;
      activeMs = 0;
      closeSearch();

      if (depth === 0) {
        syncDeptPillsUI();
        if (viewMode === "card") deptTrack.goTo(idx, false);
        else renderDeptListView();
        buildProjectDeckDOM();
        renderHierarchyTreeNav();
      } else {

    function stepDeptCarousel(delta) {

    function onDeptCardClick(idx) {
      if (_gestureMoved) return;

    /* ==========================================================================
       LAYER 1 (L2): 3D PROJECT CARDS
       ========================================================================== */
    function renderPjStrip(vis) {
      if (!Array.isArray(vis)) vis = getVisibleProjects();
      const strip = document.getElementById("pjStrip");
      const newDefaultDept = activeDept === "ALL" ? "服務部" : activeDept;
      const backLbl = document.getElementById("backDeptLabel");
      if (backLbl) {
        backLbl.textContent = activeDept === "ALL" ? "返回集團戰情總覽" : `返回部門層（${activeDept}）`;
      }

      const canAddInDept = typeof canAccessDepartment !== "function" || canAccessDepartment(newDefaultDept);
      if (!vis.length) {
        strip.innerHTML = canAddInDept
          ? `<button class="pjs-pill pjs-add" onclick="openProjectEditor(null, '${esc(newDefaultDept)}')">＋ 新增${esc(newDefaultDept)}專案</button>`
          : `<button class="pjs-pill pjs-add" onclick="openUnlockModal('${esc(newDefaultDept)}')">🔑 解鎖${esc(newDefaultDept)}</button>`;
        return;
      }

      strip.innerHTML = vis.map((p, i) => {
        const isShared = p.sharedDepts && p.sharedDepts.length > 0;
        const uCnt = typeof getProjectUnreadCount === "function" ? getProjectUnreadCount(p) : 0;
        const shortLbl = (p._locked && p.secMode === "full") || p._deptLocked
          ? `🔒 ${p.code}`
          : (p.shortName.replace(/食品廠|綜合宿舍案|工程/g, "") || p.shortName);
        return `
          <button class="pjs-pill ${i === activePj ? 'active' : ''}" data-pjs="${i}" onclick="selectProject(${i})">
            <span class="mono" style="font-size:10.5px;opacity:0.75;">${fmtSeq(i + 1)}</span>
            <span>${esc(shortLbl)}</span>
            ${uCnt > 0 ? `<span class="mono" style="font-size:10px;color:var(--teal);font-weight:700;">+${uCnt}</span>` : ''}
            ${isShared ? `<span title="跨部門共用專案" style="color:var(--teal);font-size:11px;">⇄</span>` : ''}
          </button>
        `;
      }).join("") + (canAddInDept ? `
        <button class="pjs-pill pjs-add" onclick="openProjectEditor(null, '${esc(newDefaultDept)}')" title="在此部門新增專案">＋</button>
      ` : "");

    function syncPjStripActiveUI() {
      document.querySelectorAll("#pjStrip .pjs-pill[data-pjs]").forEach(btn => {
        btn.classList.toggle("active", Number(btn.getAttribute("data-pjs")) === activePj);
      });
    }

    function updateDivePromptForProject(p) {
      const diveTxt = document.getElementById("divePromptTxt");
      if (!diveTxt || !p) return;
      if (p._locked && p.secMode === "full") {
        diveTxt.textContent = `🔒 點擊輸入「${roleDisplayName(p.vaultDept)}」密碼解鎖本案`;
      } else {
        const pubCount = (p.events || []).filter(e => !e._lockedEv).length;
        const lockCount = (p.events || []).length - pubCount;
        diveTxt.textContent = lockCount > 0
          ? `探索 ${pubCount} 個公開節點（另有 ${lockCount} 筆加密 · 點擊或滾輪向下）`
          : `探索 ${p.shortName} ${p.events.length} 個時間節點（點擊或滾輪向下）`;
      }
    }

    function buildProjectDeckDOM() {
      renderDeptBar();

      if (activePj >= vis.length) activePj = Math.max(0, vis.length - 1);

          <article class="p-card is-front" style="align-items:center;justify-content:center;text-align:center;gap:18px;cursor:default;">

            <div>

      document.getElementById("projectCardsHost").innerHTML = vis.map((p, idx) => {
        const fullLocked = !!(p._locked && p.secMode === "full");
        const finLocked = !!(p._locked && p.secMode === "finance");
        const unlockedSecret = !p._locked && p.secMode && p.secMode !== "none" && store.vault && store.vault.enabled;

        const pct = fullLocked ? 0 : (typeof p.progressPct === "number" ? p.progressPct : Math.round(((p.stageIndex || 2) / 5) * 100));
        const offset = cLen * (1 - Math.max(0, Math.min(100, pct)) / 100);
        const ringColor = fullLocked ? "var(--violet)" : (ringStrokeMap[p.statusColor] || "var(--cyan)");
        const isShared = p.sharedDepts && p.sharedDepts.length > 0;
        const deptBadgeTxt = formatDeptBadgeText(p);

        const secPillHtml = unlockedSecret
          ? `<span class="sec-tag" onclick="event.stopPropagation();openVaultStudio()" title="已受 AES-256 保護，存檔時自動轉為密文">${p.secMode === 'full' ? '🔒 整案加密' : '💴 財務加密'}</span>`
          : "";

        const heroClickAction = (fullLocked || finLocked)
          ? `event.stopPropagation();openUnlockModal('${esc(p.vaultDept || '財務部')}')`
          : `event.stopPropagation();openProjectEditor('${esc(p.id)}')`;

        const editClickAction = fullLocked
          ? `event.stopPropagation();openUnlockModal('${esc(p.vaultDept || '僅總經理')}')`

        const printClickAction = fullLocked

        const dossierClickAction = fullLocked
