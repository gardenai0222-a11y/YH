        const uCnt = (!fullLocked && typeof getProjectUnreadCount === "function") ? getProjectUnreadCount(p) : 0;

        return `
          <article class="p-card ${fullLocked ? 'is-full-locked' : ''} ${uCnt > 0 ? 'has-unread' : ''}" id="pcard-${idx}" onclick="onProjectCardClick(${idx})">

                <span>${fullLocked ? '🔒 AES-256 加密鎖定' : `● ${esc(p.statusShort || p.status)}`}</span>

              <div style="display:flex;align-items:center;gap:6px;">

                ` : `
                  <button class="dossier-chip" style="padding:0 10px;" onclick="event.stopPropagation();openQuickIdModal('${esc(p.id)}')" title="速查身分證（地號/面積/文號/額度點一下直接複製）">🪪 身分證</button>
                  <button class="dossier-chip" style="padding:0 10px;" onclick="event.stopPropagation();openPivotEvolutionModal('${esc(p.id)}')" title="一鍵抽離歷次決策轉彎與預算演變">🧭 轉折</button>
                  <button class="dossier-chip" style="padding:0 10px;" onclick="${dossierClickAction}" title="檢視專案完整背景檔案">背景</button>

                    <svg viewBox="0 0 68 68">
                      <circle class="rm-bg" cx="34" cy="34" r="29"></circle>
                      <circle class="rm-fg" cx="34" cy="34" r="29" style="stroke:${ringColor};stroke-dasharray:${cLen.toFixed(1)};stroke-dashoffset:${offset.toFixed(1)};"></circle>
                    </svg>
                    <span class="rm-txt mono">${pct}%</span>
                  </div>
                `}
              </div>
            </div>
          </article>
        `;
      }).join("");

      _pjCardEls = Array.from(document.querySelectorAll("#projectCardsHost .p-card"));
      pjTrack.setCount(_pjCardEls.length, activePj);

      updateArrowButtons("pj", activePj, _pjCardEls.length);

      document.querySelectorAll("#projectCardsHost .p-card, #deptCardsHost .d-card").forEach(card => {
        card.addEventListener("pointermove", e => {
          if (!card.classList.contains("is-front")) return;
          const r = card.getBoundingClientRect();
          card.style.setProperty("--gx", `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`);
          card.style.setProperty("--gy", `${((e.clientY - r.top) / r.height * 100).toFixed(1)}%`);

      });

      if (viewMode === "list") renderProjectListView();

    function selectProject(idx) {
      const vis = getVisibleProjects();
      if (!vis.length) return;
      const clamped = Math.max(0, Math.min(vis.length - 1, idx));
      activePj = clamped;
      activeMs = 0;
      if (viewMode === "card") pjTrack.goTo(clamped, false);
      else renderProjectListView();
    }

    function stepProject(delta) {
      pjTrack.step(delta);
    }

    function onProjectCardClick(idx) {
      if (_gestureMoved) return;
      const vis = getVisibleProjects();
      if (idx !== activePj) {
        pjTrack.goTo(idx, false);
        return;
      }
      const p = vis[idx];
      if (p && p._locked && p.secMode === "full") {
        openUnlockModal(p.vaultDept || "僅總經理");
        return;
      }
      diveToDepth(2);
    }

    /* ==========================================================================
       LAYER 2 (L3): 3D MILESTONE TIMELINE + LASER SCRUBBER

    function buildTimelineDOM() {
      const p = getCurrentProject();

      const sorted = getSortedEvents(p);
      if (activeMs >= sorted.length) activeMs = Math.max(0, sorted.length - 1);

      const canEditCurPj = (typeof canAccessProjectByDept !== "function" || canAccessProjectByDept(p)) && !(p._locked && p.secMode === "full") && !p._deptLocked;
      const tlAddBtn = document.getElementById("tlAddNodeTopBtn");

        prevBtn.style.display = "none";

          <article class="ms-card is-front" style="align-items:center;justify-content:center;text-align:center;gap:14px;cursor:default;">

            ${canEditCurPj
              ? `<button class="cta-pill" onclick="openFormSheet('${esc(p.id)}')">＋ 新增第一筆里程碑節點</button>`
              : `<button class="cta-pill" onclick="openUnlockModal('${esc(p.leadDept || '僅總經理')}')">🔑 輸入鑰匙解鎖檢視</button>`}
          </article>

        const thumbSrc = phList.length && typeof resolvePhotoSrc === "function" ? resolvePhotoSrc(phList[phList.length - 1]) : "";
        return `
          <article class="ms-card ${ev.isKey ? 'is-piv' : ''} ${lockedEv ? 'is-sec-ev' : ''} ${isUnr ? 'is-unread' : ''}" id="mscard-${idx}" onclick="onMsCardClick(${idx}, '${esc(p.id)}', '${esc(ev.id)}')">

              <div>

                  ? `<span class="st-pill c-purple" style="padding:4px 10px;font-size:11.5px;">🔒 機密節點</span>`
                  : (ev.isKey ? `<span class="st-pill c-amber" style="padding:4px 10px;font-size:11.5px;">◆ 關鍵轉折</span>` : `<span class="mono" style="font-size:12px;color:var(--t3);">${fmtSeq(idx + 1)} / ${fmtSeq(sorted.length)}</span>`)

      document.getElementById("laserScrubber").innerHTML = sorted.map((ev, idx) => {
        const hasPh = !ev._lockedEv && Array.isArray(ev.photos) && ev.photos.length > 0;
        return `
          <button class="yr-chip ${idx === activeMs ? 'active' : ''}" onclick="selectMilestone(${idx})">

      msTrack.setCount(_msCardEls.length, activeMs);
      updateArrowButtons("ms", activeMs, _msCardEls.length);
      if (viewMode === "list") renderTimelineListView();
    }

    function selectMilestone(idx) {
      const sorted = getSortedEvents();
      if (!sorted.length) return;
      const clamped = Math.max(0, Math.min(sorted.length - 1, idx));
      activeMs = clamped;
      msTrack.goTo(clamped, false);
    }

    function stepMilestone(delta) {
      msTrack.step(delta);
    }

    function onMsCardClick(idx, pjId, evId) {
      if (_gestureMoved) return;
      if (idx !== activeMs) {
        msTrack.goTo(idx, false);
        return;
      }
      const p = projects.find(x => x.id === pjId);
      const ev = p && p.events.find(e => e.id === evId);
      if (ev && ev._lockedEv) {
        openUnlockModal(p.vaultDept || "財務部");
        return;
      }
      detailTab = "event";
      diveToDepth(3);
    }

    /* ==========================================================================
       INTERACTIVE EVIDENCE DOCUMENT CHIPS (`ev.docs` + `ev.docLinks`)
       ========================================================================== */
    function splitDocItems(docsStr) {
      if (!docsStr) return [];
      return String(docsStr)
        .split(/[、｜|;；\r\n]+/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function findBoundDocEntry(ev, token) {
      if (!ev || !ev.docLinks || typeof ev.docLinks !== "object") return null;
      if (ev.docLinks[token]) return { key: token, url: ev.docLinks[token] };
      for (const [k, v] of Object.entries(ev.docLinks)) {
        if (!v) continue;
        if (token.includes(k) || k.includes(token)) return { key: k, url: v };
      }
      return null;
    }

    function resolveDocLinkHref(rawUrl) {
      if (!rawUrl) return "";
      const u = String(rawUrl).trim();
      if (/^(https?:|file:|mailto:)/i.test(u)) return u;
      const cleanRel = u.replace(/\\/g, "/").replace(/^(\.\.\/)+/, "").replace(/^\.\//, "");
      if (location.protocol === "http:" || location.protocol === "https:") {
        return "/workspace_docs/" + cleanRel.split("/").map(encodeURIComponent).join("/");
      }
      return "./" + cleanRel.split("/").map(encodeURIComponent).join("/");
    }

    function renderDocChipsHtml(pjId, ev) {
      const items = splitDocItems(ev && ev.docs);
      if (!items.length) return `<span style="color:var(--t3);">—</span>`;
      return `<div class="doc-chips-wrap">` + items.map(tok => {
        const bound = findBoundDocEntry(ev, tok);
        const cls = bound ? "doc-chip has-link" : "doc-chip";
        const ico = bound ? "🔗" : "📄";
        const tip = bound
          ? `已掛載檔案連結（點擊直接開啟或檢視關聯節點）`
          : `點擊檢視跨節點關聯紀錄，或掛載 NAS／雲端檔案網址`;
        return `<button type="button" class="${cls}" data-pjid="${esc(pjId)}" data-evid="${esc(ev.id)}" data-doc="${esc(tok)}" onclick="event.stopPropagation();openDocInspectorFromChip(this)" title="${tip}"><span>${ico}</span><span>${esc(tok)}</span></button>`;
      }).join("") + `</div>`;
    }

    function stepDetailEvent(delta) {
      const p = getCurrentProject();
      if (!p) return;
      const sorted = getSortedEvents(p);
      const nextIdx = activeMs + delta;
      if (nextIdx < 0 || nextIdx >= sorted.length) return;
      if (sorted[nextIdx]._lockedEv) {
        openUnlockModal(p.vaultDept || "財務部");
        return;
      }
      activeMs = nextIdx;
      msTrack.goTo(nextIdx, true);
      detailTab = "event";
      renderDetailLayer();
      renderHierarchyTreeNav();
    }

    function openDetailForEvent(pjId, evId) {
      const p = projects.find(x => x.id === pjId);
      if (!p) return;
      if (p._locked && p.secMode === "full") {
        openUnlockModal(p.vaultDept || "僅總經理");
        return;
      }
      let vis = getVisibleProjects();
      let pIdx = vis.findIndex(x => x.id === pjId);
      if (pIdx < 0) {
        const targetDept = p.leadDept || (store.departments && store.departments[0]) || "工務部";
        activeDept = targetDept;
        const dItems = getDeptDeckItems();
        activeDeptIdx = Math.max(0, dItems.findIndex(x => x.key === targetDept));
        vis = getVisibleProjects(targetDept);
        pIdx = Math.max(0, vis.findIndex(x => x.id === pjId));
      }
      activePj = pIdx;
      const sorted = getSortedEvents(p);
      const eIdx = sorted.findIndex(e => e.id === evId);
      if (eIdx >= 0) {
        if (sorted[eIdx]._lockedEv) {
          openUnlockModal(p.vaultDept || "財務部");
          return;
        }
        activeMs = eIdx;
        detailTab = "event";
      } else {
        detailTab = "dossier";
      }
      closeSearch();
      closeSheet();
      refreshAllLayers();
      diveToDepth(3);
    }

    // Alias for search/legacy callers
    function openEventSheet(pjId, evId) {
      openDetailForEvent(pjId, evId);
    }

    /* ==========================================================================
       5-LAYER DEPTH TRANSITION (`diveToDepth(-1..3)`) & REFRESH
       - depth = -1: 集團 (GM Executive Overview — requires canAccessGroupLayer())
       - depth =  0: 部門 (7 Departments)
       - depth =  1: 專案 (Projects)
       - depth =  2: 時間軸 (Timeline)
       - depth =  3: 詳情 (Detail)
       ========================================================================== */
    const LAYER_DEFS = [
      { d: -1, id: "layerGroup", node: "dNodeGroup" },
      { d:  0, id: "layerDept", node: "dNode0" },
      { d:  1, id: "layerProjects", node: "dNode1" },
      { d:  2, id: "layerTimeline", node: "dNode2" },
      { d:  3, id: "layerDetail", node: "dNode3" }
    ];

    function getLayerElByDepth(d) {
      const def = LAYER_DEFS.find(x => x.d === d);
      return def ? document.getElementById(def.id) : null;
    }

    function syncSpatialLayerClasses() {
      LAYER_DEFS.forEach(def => {
        const el = document.getElementById(def.id);
        if (el) {
          el.style.transition = "";
          el.style.transform = "";
          el.style.opacity = "";
          el.className = "spatial-layer " + (def.d === depth ? "at-surface" : (def.d < depth ? "dived-past" : "below-surface"));
        }
        const node = document.getElementById(def.node);
        if (node) node.classList.toggle("active", def.d === depth);
      });
      const grid = document.getElementById("hudGrid");
      if (grid) {
        const curPos = depth === 0 ? deptTrack.pos : (depth === 1 ? pjTrack.pos : (depth >= 2 ? msTrack.pos : 0));
        grid.style.transform = `translate3d(${(-curPos * 12).toFixed(1)}px, ${(-(depth + 1) * 18).toFixed(1)}px, 0)`;
      }
    }

    function diveOneLayerUp() {
      if (depth === 3) {
        diveToDepth(2);
      } else if (depth === 2) {
        diveToDepth(1);
      } else if (depth === 1) {
        onBackFromProjectsClick();
      } else if (depth === 0) {
        if (canAccessGroupLayer()) {
          diveToDepth(-1);
        } else {
          toastMsg("🔒「集團」全公司戰情總覽僅限總經理開啟（可點右側『集團 🔒』輸入主控密碼）");
          syncSpatialLayerClasses();
        }
      }
    }

    function diveOneLayerDown() {
      if (depth === -1) {
        onBrandLogoClick();
      } else if (depth < 3) {
        diveToDepth(depth + 1);
      }
    }

    function diveToDepth(targetDepth) {
      const d = Math.max(-1, Math.min(3, targetDepth));

      if (d === -1) {
        if (!canAccessGroupLayer()) {
          onGroupRailClick();
          return;
        }
        activeDept = "ALL";
        renderGroupLayer();
      }

      if (d === 0 && activeDept === "ALL") {
        activeDept = (store.departments && store.departments[activeDeptIdx]) || (store.departments && store.departments[0]) || "工務部";
        buildDeptDeckDOM();
      }

      if (d >= 1 && activeDept !== "ALL" && typeof canAccessDepartment === "function" && !canAccessDepartment(activeDept)) {
        openUnlockModal(activeDept, () => {
          buildDeptDeckDOM();
          buildProjectDeckDOM();
          diveToDepth(d);
        });
        return;
      }

      if (d >= 1 && depth <= 0) {
        buildProjectDeckDOM();
      }

      if (d >= 2) {
        const curP = getCurrentProject();
        if (!curP) {
          toastMsg("當前部門尚無專案，請先新增專案");
          diveToDepth(1);
          return;
        }
        if (curP._locked && curP.secMode === "full") {
          openUnlockModal(curP.vaultDept || "僅總經理");
          return;
        }
        buildTimelineDOM();
      }

      if (d === 3) {
        const curP = getCurrentProject();
        const sorted = getSortedEvents(curP);
        if (sorted[activeMs] && sorted[activeMs]._lockedEv) {
          openUnlockModal(curP.vaultDept || "財務部");
          return;
        }
        renderDetailLayer();
      }

      depth = d;
      syncSpatialLayerClasses();
      applyViewModeVisibility();
      renderHierarchyTreeNav();
      if (typeof scheduleAutoMarkActiveMsSeen === "function") scheduleAutoMarkActiveMsSeen();
    }

    function refreshAllLayers() {
      if (depth === -1 && !canAccessGroupLayer()) {
        depth = 0;
        activeDept = (store.departments && store.departments[0]) || "工務部";
      }
      if (canAccessGroupLayer()) renderGroupLayer();
      buildDeptDeckDOM();
      buildProjectDeckDOM();
      if (getCurrentProject() && !(getCurrentProject()._locked && getCurrentProject().secMode === "full")) {
        buildTimelineDOM();
        if (depth === 3) renderDetailLayer();
      }
      syncSpatialLayerClasses();
      applyViewModeVisibility();
      renderHierarchyTreeNav();
      if (typeof refreshMobileWarRoomIfActive === "function") refreshMobileWarRoomIfActive();
    }

    /* ==========================================================================
       UNIFIED 120Hz 5-LAYER GESTURE CONTROLLER (Touch, Mouse Drag & Wheel)
       ========================================================================== */
    let _gestureMoved = false;

    (function initControlCenterGestures() {
      const world = document.getElementById("cameraWorld");
      let down = false, axis = null;
      let sx = 0, sy = 0, lastX = 0, lastY = 0, lastT = 0, vx = 0, vy = 0;

      function activeTrackForDepth() {
        if (depth === 0) return deptTrack;
        if (depth === 1) return pjTrack;
        if (depth === 2) return msTrack;
        return null;
      }

      world.addEventListener("pointerdown", e => {
        if (window._yxMobileMode) return;
        if (e.button !== 0) return;
        if (document.getElementById("sheetBg").classList.contains("open")) return;
        if (document.getElementById("coachBg").classList.contains("open")) return;
        if (e.target.closest("button, input, select, textarea, .laser-scrubber, .pj-strip, .list-stage-panel")) return;
        // Inside L4 Detail scroll body or GM command card, preserve native text selection
        if (depth === 3 && e.target.closest(".det-body")) return;
        if (depth === -1 && e.target.closest(".gm-command-card")) return;

        down = true;
        axis = null;
        _gestureMoved = false;
        sx = lastX = e.clientX;
        sy = lastY = e.clientY;
        lastT = performance.now();
        vx = vy = 0;
      });

      window.addEventListener("pointermove", e => {
        if (!down) return;
        const dx = e.clientX - sx;
        const dy = e.clientY - sy;
        const now = performance.now();
        const dt = Math.max(1, now - lastT);
        vx = 0.65 * ((e.clientX - lastX) / dt) + 0.35 * vx;
        vy = 0.65 * ((e.clientY - lastY) / dt) + 0.35 * vy;
        lastX = e.clientX;
        lastY = e.clientY;
        lastT = now;

        if (!axis) {
          if (Math.hypot(dx, dy) < 7) return;
          axis = Math.abs(dx) >= Math.abs(dy) * 0.92 ? "x" : "y";
          _gestureMoved = true;
          if (axis === "x") {
            const tr = activeTrackForDepth();
            if (tr && viewMode === "card") tr.startDrag();
          } else {
            LAYER_DEFS.forEach(def => {
              const el = document.getElementById(def.id);
              if (el) el.style.transition = "none";
            });
          }
        }

        if (axis === "x") {
          const tr = activeTrackForDepth();
          if (tr && viewMode === "card") {
            tr.moveDrag(dx, 215);
          }
        } else if (axis === "y" && viewMode === "card") {
          const curEl = getLayerElByDepth(depth);
          const p = Math.max(-1, Math.min(1, dy / 230));
          if (curEl) {
            curEl.style.transform = `translate3d(0, ${(dy * 0.38).toFixed(1)}px, 0) scale(${(1 - Math.abs(p) * 0.05).toFixed(3)})`;
            curEl.style.opacity = Math.max(0.28, 1 - Math.abs(p) * 0.65).toFixed(2);
          }
        }
      });

      function endPointerGesture(e) {
        if (!down) return;
        down = false;
        const dx = e.clientX - sx;
        const dy = e.clientY - sy;

        if (axis === "x") {
          const tr = activeTrackForDepth();
          if (tr && viewMode === "card") {
            tr.endDrag(dx, vx, 215);
          } else if (depth === 3) {
            if (dx < -40 || vx < -0.28) stepDetailEvent(1);
            else if (dx > 40 || vx > 0.28) stepDetailEvent(-1);
          }
        } else if (axis === "y" && viewMode === "card") {
          if ((dy < -30 || vy < -0.18) && depth < 3) {
            diveOneLayerDown();
          } else if ((dy > 30 || vy > 0.18) && depth > -1) {
            diveOneLayerUp();
          } else {
            syncSpatialLayerClasses();
          }
        }

        setTimeout(() => { _gestureMoved = false; }, 35);
        axis = null;
      }

      window.addEventListener("pointerup", endPointerGesture);
      window.addEventListener("pointercancel", endPointerGesture);

      // Smooth Wheel / Trackpad Support — including seamless scroll-up return from inside L4 Detail Card!
      let wheelLockUntil = 0;
      let wheelAccumX = 0;
      let wheelAccumReset = 0;
      let detInnerScrollGuardUntil = 0;

      world.addEventListener("wheel", e => {
        if (window._yxMobileMode || window._yxMap3DOpen || window._jarvisOpen) return;
        if (document.getElementById("sheetBg").classList.contains("open")) return;
        if (document.getElementById("coachBg").classList.contains("open")) return;
        if (e.target.closest(".lsp-body")) return;
        if (viewMode === "list") return;

        const now = performance.now();

        // L4 Detail Card (.det-body): allow native vertical scroll when content overflows,
        // AND smoothly return to Timeline (depth 2) when scrolling UP at top (or when card has no scrollbar)!
        const detBody = e.target.closest(".det-body");
        if (detBody && depth === 3) {
          const hasVScroll = detBody.scrollHeight > detBody.clientHeight + 4;
          if (Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.1 && Math.abs(e.deltaX) > 10) {
            // Horizontal trackpad swipe inside detail card steps milestone
          } else if (e.deltaY > 0) {
            if (hasVScroll && detBody.scrollTop + detBody.clientHeight < detBody.scrollHeight - 2) {
              detInnerScrollGuardUntil = now + 240;
              return;
            }
            e.preventDefault();
            return;
          } else if (e.deltaY < 0) {
            if (hasVScroll && detBody.scrollTop > 2) {
              detInnerScrollGuardUntil = now + 240;
              return;
            }
            if (now < detInnerScrollGuardUntil) {
              e.preventDefault();
              return;
            }
            // At top of .det-body (or non-scrollable): fall through to diveOneLayerUp()!
          } else {
            return;
          }
        }

        // GM Command Card (.gm-command-card) at depth -1: allow native scroll if tall, dive down at bottom
        const gmCard = e.target.closest(".gm-command-card");
        if (gmCard && depth === -1) {
          const gmHasScroll = gmCard.scrollHeight > gmCard.clientHeight + 4;
          if (e.deltaY < 0 && gmHasScroll && gmCard.scrollTop > 2) return;
          if (e.deltaY > 0 && gmHasScroll && gmCard.scrollTop + gmCard.clientHeight < gmCard.scrollHeight - 3) return;
        }

        e.preventDefault();

        if (Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.85 && Math.abs(e.deltaX) > 6) {
          wheelAccumX += e.deltaX;
          clearTimeout(wheelAccumReset);
          wheelAccumReset = setTimeout(() => { wheelAccumX = 0; }, 140);

          if (Math.abs(wheelAccumX) >= 55) {
            const steps = Math.trunc(wheelAccumX / 55);
            wheelAccumX -= steps * 55;
            const tr = activeTrackForDepth();
            if (tr) tr.step(steps);
            else if (depth === 3) stepDetailEvent(steps > 0 ? 1 : -1);
          }
        } else if (Math.abs(e.deltaY) > 22 && now > wheelLockUntil) {
          wheelLockUntil = now + 420;
          if (e.deltaY > 0 && depth < 3) diveOneLayerDown();
          else if (e.deltaY < 0 && depth > -1) diveOneLayerUp();
        }
      }, { passive: false });

      window.addEventListener("resize", () => {
        syncTopBarClearance();
        scheduleTreeStemRedraw();
        if (_deptCardEls.length) applyLinearCoverFlow(_deptCardEls, deptTrack.pos, 305, 175);
        if (_pjCardEls.length) applyLinearCoverFlow(_pjCardEls, pjTrack.pos, 308, 178);
        if (_msCardEls.length) applyLinearCoverFlow(_msCardEls, msTrack.pos, 295, 168);
      });
    })();

    /* ==========================================================================
       VIEW MODE TOGGLE: 🎴 3D SPATIAL CARDS <-> 📋 STRUCTURED CONTROL TABLES
       ========================================================================== */
    function setViewMode(mode) {
      viewMode = mode === "list" ? "list" : "card";
      document.getElementById("modeBtnCard").classList.toggle("active", viewMode === "card");
      document.getElementById("modeBtnList").classList.toggle("active", viewMode === "list");

      if (viewMode === "list" && depth === 3) {
        depth = 2;
        syncSpatialLayerClasses();
      }
      applyViewModeVisibility();
    }

    function applyViewModeVisibility() {
      const isList = viewMode === "list";

      const gCard = document.getElementById("groupCardView");
      const gList = document.getElementById("groupListView");
      if (gCard && gList) {
        gCard.style.display = isList ? "none" : "flex";
        gList.style.display = isList ? "flex" : "none";
        if (isList && depth === -1) renderGroupListView();
      }

      const dCard = document.getElementById("deptCardView");
      const dList = document.getElementById("deptListView");
      if (dCard && dList) {
        dCard.style.display = isList ? "none" : "flex";
        dList.style.display = isList ? "flex" : "none";
        if (isList && depth === 0) renderDeptListView();
      }

      const pCard = document.getElementById("pjCardView");
      const pList = document.getElementById("pjListView");
      if (pCard && pList) {
        pCard.style.display = isList ? "none" : "flex";
        pList.style.display = isList ? "flex" : "none";
        if (isList && depth === 1) renderProjectListView();
      }

      const mCard = document.getElementById("msCardView");
      const mList = document.getElementById("msListView");
      if (mCard && mList) {
        mCard.style.display = isList ? "none" : "flex";
        mList.style.display = isList ? "flex" : "none";
        if (isList && depth === 2) renderTimelineListView();
      }
    }

                <span>返回專案層</span>

    /* ==========================================================================

         3. `portfolio` — 《跨部門專案履歷執行彙總表》（部門／總覽預設）

    let _prState = {
      mode: "project",
      pjId: "",
      evId: "",
      withSign: true,
      onlyKeyEvents: false

    function todayPrintStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}/${m}/${day}（民國 ${y - 1911}/${m}/${day}）`;
    }

    function openContextPrint() {
      const curP = getCurrentProject();
      if (depth === 3 && curP) {
        const sorted = getSortedEvents(curP);
        if (detailTab === "event" && sorted[activeMs] && !sorted[activeMs]._lockedEv) {
          openPrintModal("event", curP.id, sorted[activeMs].id);
        } else {
          openPrintModal("project", curP.id);
        }
      } else if (depth === 2 && curP) {
        openPrintModal("project", curP.id);
      } else {
        openPrintModal("portfolio", curP ? curP.id : "");
      }
    }

    function openTimelinePrint() {
      const curP = getCurrentProject();
      if (!curP) return;
      openPrintModal("project", curP.id);
    }

    /* ==========================================================================
       SYNOLOGY NAS MULTI-USER REAL-TIME SYNC ENGINE (V13)
       - Zero-config auto-detection of `./api/state` & SSE `./api/events`
       - Record-level atomic operations (`upsert_project`, `upsert_event`, `update_matrix`, ...)
       - Preserves client-side AES-256 Vault RAM decryption across live multi-user updates!
       ========================================================================== */
    const MY_CLIENT_ID = "yx-" + Math.random().toString(36).slice(2, 10) + "-" + Date.now().toString(36);
    let nasServerActive = false;
    let nasConnected = false;
    let nasRev = 0;
    let nasOnlineCount = 1;
    let nasEventSource = null;
    let _nasFlashTimer = 0;
    let _nasDeferredSync = false;

    function updateNasTopBarUI(flashText = "") {
      const btn = document.getElementById("nasSyncBtn");
      const studioLbl = document.getElementById("studioBtnLabel");
      const dot = document.getElementById("unsavedDot");
      if (!btn) return;

      if (!nasServerActive) {
        btn.style.display = "none";
        if (studioLbl) studioLbl.textContent = "控制 / 存檔";
        return;
      }

      btn.style.display = "inline-flex";
      if (studioLbl) studioLbl.textContent = "控制中心";
      if (dot) dot.classList.remove("show");
      hasUnsavedFileChanges = false;

      if (flashText) {
        btn.className = "nas-sync-pill is-online";
        btn.innerHTML = `<span>${esc(flashText)}</span>`;
        clearTimeout(_nasFlashTimer);
        _nasFlashTimer = setTimeout(() => updateNasTopBarUI(""), 2000);
        return;
      }

      if (nasConnected) {
        btn.className = "nas-sync-pill is-online";
        btn.innerHTML = `<span class="nas-dot"></span><span>NAS 同步 · ${nasOnlineCount} 人</span>`;
      } else {
        btn.className = "nas-sync-pill is-reconnecting";
        btn.innerHTML = `<span class="nas-dot warn"></span><span>NAS 重連中...</span>`;
      }
    }

    function syncVerNumbersFromServer(srvStore) {
      if (!srvStore || !Array.isArray(srvStore.projects)) return;
      const srvMap = {};
      srvStore.projects.forEach(sp => { srvMap[sp.id] = sp; });
      projects.forEach(lp => {
        const sp = srvMap[lp.id];
        if (!sp) return;
        lp._ver = sp._ver || 1;
        lp._metaVer = sp._metaVer || 1;
        if (Array.isArray(sp.events) && Array.isArray(lp.events)) {
          const evMap = {};
          sp.events.forEach(se => { evMap[se.id] = se._ver || 1; });
          lp.events.forEach(le => {
            if (evMap[le.id]) le._ver = evMap[le.id];
          });
        }
      });
    }

    function applyIncomingServerStore(srvStore) {
      if (!srvStore || !Array.isArray(srvStore.projects)) return;
      const curProjObj = getCurrentProject();
      const prevPjId = curProjObj ? curProjObj.id : "";
      const sortedBefore = curProjObj ? getSortedEvents(curProjObj) : [];
      const prevEvId = sortedBefore[activeMs] ? sortedBefore[activeMs].id : "";

      store = JSON.parse(JSON.stringify(srvStore));
      nasRev = store.rev || nasRev;
      if (!Array.isArray(store.departments) || !store.departments.length) {
        store.departments = DEFAULT_DEPTS.slice();
      }
      ensureVaultStruct(store);
      normalizeProjects(store.projects);
      markEncryptedStoreFlags(store);
      projects = store.projects;

      if (hasAnyUnlockedKey()) {
        decryptAuthorizedItemsInMemory();
      }

      const visAfter = getVisibleProjects();
      if (prevPjId) {
        const nPjIdx = visAfter.findIndex(x => x.id === prevPjId);
        if (nPjIdx >= 0) activePj = nPjIdx;
        else activePj = Math.max(0, Math.min(activePj, visAfter.length - 1));
      }

      const afterProj = getCurrentProject();
      if (afterProj && prevEvId) {
        const sortedAfter = getSortedEvents(afterProj);
        const nEvIdx = sortedAfter.findIndex(e => e.id === prevEvId);
        if (nEvIdx >= 0) activeMs = nEvIdx;
        else activeMs = Math.max(0, Math.min(activeMs, sortedAfter.length - 1));
      }

      refreshAllLayers();
      renderVaultTopPill();
      updateNasTopBarUI();

      // If A4 Print Preview is currently open, refresh it immediately so printed output is 100% live!
      const shBg = document.getElementById("sheetBg");
      const bs = document.getElementById("bottomSheet");
      if (shBg && shBg.classList.contains("open") && bs && bs.classList.contains("wide-print")) {
        renderPrintModalInner();
      }
    }

    async function fetchLatestNasState(showToastSummary = "") {
      try {
        const authHdr = typeof getActiveAuthTokensMap === "function"
          ? encodeURIComponent(JSON.stringify(getActiveAuthTokensMap()))
          : "";
        const r = await fetch("./api/state?t=" + Date.now(), {
          cache: "no-store",
          headers: authHdr ? { "X-YX-Auth": authHdr } : {}
        });
        if (!r.ok) return false;
        const data = await r.json();
        if (!data || !data.ok || !data.store) return false;
        nasServerActive = true;
        nasConnected = true;
        nasOnlineCount = data.onlineCount || 1;

        const shBg = document.getElementById("sheetBg");
        const activeFormOpen = shBg && shBg.classList.contains("open") && !!document.querySelector("#bottomSheet form");

        if (!activeFormOpen) {
          _nasDeferredSync = false;
          applyIncomingServerStore(data.store);
        } else {
          // User is actively typing in a form modal — defer full DOM swap until form closes or submits
          _nasDeferredSync = true;
          updateNasTopBarUI();
        }
        if (showToastSummary) toastMsg("同仁同步：" + showToastSummary);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function nasSendOp(payload) {
      if (!nasServerActive) return { ok: true, offline: true };
      try {
        payload.clientId = MY_CLIENT_ID;
        if (!payload.actor && typeof getViewerNickname === "function") {
          payload.actor = getViewerNickname();
        }
        if (payload.authTokensOverride) {
          payload.authTokens = payload.authTokensOverride;
          delete payload.authTokensOverride;
        } else if (typeof getActiveAuthTokensMap === "function") {
          payload.authTokens = getActiveAuthTokensMap();
        }
        const resp = await fetch("./api/op", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (resp.status === 403) {
          toastMsg("權限拒絕：" + ((data && data.error) || "您無權限執行此變更"));
          return { ok: false, forbidden: true };
        }
        if (resp.status === 409 && data && data.conflict) {
          if (data.store) applyIncomingServerStore(data.store);
          alert("防覆蓋保護啟動：\n" + (data.message || "另一位同仁剛更新了此筆資料，畫面已為您同步最新版本！"));
          return { ok: false, conflict: true };
        }
        if (!resp.ok || !data.ok) {
          toastMsg("NAS 同步失敗：" + ((data && data.error) || resp.status));
          return { ok: false };
        }
        nasRev = data.rev || nasRev;
        if (data.store) {
          const shBg = document.getElementById("sheetBg");
          const stillInForm = shBg && shBg.classList.contains("open") && !!document.querySelector("#bottomSheet form");

    function connectNasSSE() {
      if (nasEventSource) {
        try { nasEventSource.close(); } catch (e) {}
      }
      const es = new EventSource("./api/events?clientId=" + encodeURIComponent(MY_CLIENT_ID));
      nasEventSource = es;

      es.onopen = () => {
        nasConnected = true;
        updateNasTopBarUI();
      };

      es.onmessage = ev => {
        try {
          const msg = JSON.parse(ev.data);
          if (typeof msg.onlineCount === "number") {
            nasOnlineCount = msg.onlineCount;
            updateNasTopBarUI();
          }
          if (msg.type === "sync" && msg.clientId !== MY_CLIENT_ID && (msg.rev || 0) > nasRev) {
            fetchLatestNasState(msg.summary || "資料已更新");
          }
        } catch (e) {}
      };

      es.onerror = () => {
        nasConnected = false;
        updateNasTopBarUI();
      };
    }

    const _CRC32_TABLE = (function() {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c >>> 0;
      }
      return t;
    })();

    function crc32Bytes(u8) {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < u8.length; i++) {
        c = _CRC32_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
      }
      return (c ^ 0xFFFFFFFF) >>> 0;
    }

    function buildZipFromEntries(entries) {
      const enc = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      const now = new Date();
      const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() >> 1) & 31);
      const dosDate = (((Math.max(1980, now.getFullYear()) - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

      for (const item of entries) {
        const nameBytes = enc.encode(item.name);
        const dataBytes = item.data instanceof Uint8Array ? item.data : enc.encode(String(item.data));
        const crc = crc32Bytes(dataBytes);
        const size = dataBytes.length;

        const lh = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(lh.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(6, 0x0800, true); // UTF-8 filename flag
        lv.setUint16(8, 0, true);      // Store method (0) — universal Excel & browser compatibility
        lv.setUint16(10, dosTime, true);
        lv.setUint16(12, dosDate, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, size, true);
        lv.setUint32(22, size, true);
        lv.setUint16(26, nameBytes.length, true);
        lv.setUint16(28, 0, true);
        lh.set(nameBytes, 30);

        const ch = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(ch.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0x0800, true);
        cv.setUint16(10, 0, true);
        cv.setUint16(12, dosTime, true);
        cv.setUint16(14, dosDate, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, size, true);
        cv.setUint32(24, size, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint16(30, 0, true);
        cv.setUint16(32, 0, true);
        cv.setUint16(34, 0, true);
        cv.setUint16(36, 0, true);
        cv.setUint32(38, 0, true);
        cv.setUint32(42, offset, true);
        ch.set(nameBytes, 46);

        localParts.push(lh, dataBytes);
        centralParts.push(ch);
        offset += lh.length + dataBytes.length;
      }

      const cdSize = centralParts.reduce((s, a) => s + a.length, 0);
      const eocd = new Uint8Array(22);
      const ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(4, 0, true);
      ev.setUint16(6, 0, true);
      ev.setUint16(8, entries.length, true);
      ev.setUint16(10, entries.length, true);
      ev.setUint32(12, cdSize, true);
      ev.setUint32(16, offset, true);
      ev.setUint16(20, 0, true);

      const totalLen = offset + cdSize + 22;
      const out = new Uint8Array(totalLen);
      let pos = 0;
      for (const p of localParts) { out.set(p, pos); pos += p.length; }
      for (const p of centralParts) { out.set(p, pos); pos += p.length; }
      out.set(eocd, pos);
      return out;
    }

    function xmlEsc(s) {
      if (s === null || s === undefined) return "";
      return String(s)
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function xlsxColName(colIdx1Based) {
      let n = colIdx1Based;
      let s = "";
      while (n > 0) {
        const rem = (n - 1) % 26;
        s = String.fromCharCode(65 + rem) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    }

    function sanitizeSheetTitle(raw, usedSet) {
      let base = String(raw || "Sheet").replace(/[\\/*?:\[\]]/g, "_").trim() || "Sheet";
      if (base.length > 28) base = base.slice(0, 28);
      let cand = base;
      let n = 2;
      while (usedSet.has(cand)) {
        cand = base.slice(0, 25) + "_" + n;
        n++;
      }
      usedSet.add(cand);
      return cand;
    }

    class XlsxSheetBuilder {
      constructor(colWidths, freezeRow = 0) {
        this.colWidths = colWidths || [];
        this.freezeRow = freezeRow;
        this.rows = new Map();
        this.rowHeights = new Map();
        this.merges = [];
      }
      setRowHeight(r, h) {
        this.rowHeights.set(r, h);
      }
      _ensureRow(r) {
        if (!this.rows.has(r)) this.rows.set(r, new Map());
        return this.rows.get(r);
      }
      setStr(r, c, val, style = 5) {
        this._ensureRow(r).set(c, { type: "str", val: String(val === undefined || val === null ? "" : val), style });
      }
      setNum(r, c, num, style = 7) {
        this._ensureRow(r).set(c, { type: "num", val: Number(num) || 0, style });
      }
      setFormula(r, c, formula, cachedNum = 0, style = 7) {
        this._ensureRow(r).set(c, { type: "f", f: formula, val: cachedNum, style });
      }
      merge(r1, c1, r2, c2, fillEmptyStyle = null) {
        this.merges.push(`${xlsxColName(c1)}${r1}:${xlsxColName(c2)}${r2}`);
        if (fillEmptyStyle !== null) {
          for (let r = r1; r <= r2; r++) {
            const rm = this._ensureRow(r);
            for (let c = c1; c <= c2; c++) {
              if (!rm.has(c)) rm.set(c, { type: "empty", style: fillEmptyStyle });
            }
          }
        }
      }
      toXml() {
        const freezeXml = this.freezeRow > 0
          ? `<sheetViews><sheetView workbookViewId="0"><pane ySplit="${this.freezeRow}" topLeftCell="A${this.freezeRow + 1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
          : `<sheetViews><sheetView workbookViewId="0"/></sheetViews>`;

        const colsXml = this.colWidths.length
          ? `<cols>` + this.colWidths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("") + `</cols>`
          : "";

        const sortedRows = Array.from(this.rows.keys()).sort((a, b) => a - b);
        const rowsXml = sortedRows.map(r => {
          const ht = this.rowHeights.get(r);
          const htAttr = ht ? ` ht="${ht}" customHeight="1"` : "";
          const rm = this.rows.get(r);
          const sortedCols = Array.from(rm.keys()).sort((a, b) => a - b);
          const cellsXml = sortedCols.map(c => {
            const cell = rm.get(c);
            const ref = `${xlsxColName(c)}${r}`;
            const sAttr = cell.style ? ` s="${cell.style}"` : "";
            if (cell.type === "empty") return `<c r="${ref}"${sAttr}/>`;
            if (cell.type === "num") return `<c r="${ref}"${sAttr}><v>${cell.val}</v></c>`;
            if (cell.type === "f") return `<c r="${ref}"${sAttr}><f>${xmlEsc(cell.f)}</f><v>${cell.val}</v></c>`;
            return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell.val)}</t></is></c>`;
          }).join("");
          return `<row r="${r}"${htAttr}>${cellsXml}</row>`;
        }).join("");

        const mergesXml = this.merges.length

    function exportXLSX() {
      if (store.vault && store.vault.enabled && !hasAnyUnlockedKey()) {
        openUnlockModal("", () => exportXLSX());
        return;
      }
      try {
        const exportableCount = projects.filter(p => (typeof canAccessProjectByDept !== "function" || canAccessProjectByDept(p)) && !(p._locked && p.secMode === "full") && !p._deptLocked).length;
        if (exportableCount === 0 && store.vault && store.vault.enabled) {
          openUnlockModal("", () => exportXLSX());
          return;
        }
        const roleTag = (typeof isMasterUnlocked === "function" && isMasterUnlocked()) ? "總經理全區" : ((typeof sessionUnlockedBy !== "undefined" && sessionUnlockedBy) ? sessionUnlockedBy : "公開範圍");
        const bytes = generateXlsxBytes();
        const blob = new Blob([bytes], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `有興國際_專案履歷匯出_${roleTag}.xlsx`;
        a.click();
        URL.revokeObjectURL(url);
        toastMsg(`✓ 已依「${roleTag}」權限匯出 ${exportableCount} 案 Excel（未授權部門與加密金額已嚴格排除）`);
      } catch (err) {
        alert("Excel 匯出失敗：" + (err && err.message ? err.message : err));
      }
    }

    /* ==========================================================================
       IMPORT DIFF PREVIEW & SMART MERGE ENGINE (Protects Web Edits from Stale Excel/JSON!)
       ========================================================================== */
    let _pendingImportCtx = null;

    function parseQuickStatsCellStr(rawStr) {
      if (!rawStr) return null;
      const pairs = String(rawStr)
        .split(/[｜|;；\r\n]+/)
        .map(seg => {
          const idx = seg.search(/[:：]/);
          if (idx <= 0) return null;
          return { k: seg.slice(0, idx).trim(), v: seg.slice(idx + 1).trim() };
        })
        .filter(x => x && x.k);
      return pairs.length ? pairs : null;
    }

    function matchProjectKey(a, b) {
      if (!a || !b) return false;
      if (a.id && b.id && a.id === b.id) return true;
      if (a.code && b.code && a.code === b.code) return true;
      if (a.shortName && b.shortName && a.shortName === b.shortName) return true;
      return false;
    }

    function matchEventKey(e1, e2) {
      if (!e1 || !e2) return false;
      if (e1.id && e2.id && e1.id === e2.id) return true;
      const t1 = String(e1.title || "").trim();
      const t2 = String(e2.title || "").trim();
      const d1 = String(e1.date || "").trim();
      const d2 = String(e2.date || "").trim();
      if (t1 && t1 === t2 && d1 === d2) return true;
      if (t1 && t1.length >= 8 && t1 === t2) return true;
      return false;
    }

    function hasEventContentDiff(curEv, incEv) {
      const fields = ["date", "rocDate", "phase", "title", "summary", "metrics", "docs", "note"];
      for (const f of fields) {
        if (String(curEv[f] || "").trim() !== String(incEv[f] || "").trim()) return true;
      }
      if (!!curEv.isKey !== !!incEv.isKey) return true;
      return false;
    }

    function hasProjectMetaDiff(curP, incP) {
      const fields = [
        "shortName", "fullName", "leadDept", "statusShort", "statusColor",
        "heroNum", "heroUnit", "tagLoc", "microTag", "location", "scale",
        "budget", "finance", "partners", "pivotSummary", "nextSteps"
      ];
      for (const f of fields) {
        if (incP[f] !== undefined && String(curP[f] || "").trim() !== String(incP[f] || "").trim()) return true;
      }
      if ((curP.progressPct || 0) !== (incP.progressPct || 0)) return true;
      if (JSON.stringify(curP.quickStats || []) !== JSON.stringify(incP.quickStats || [])) return true;
      if (JSON.stringify((curP.sharedDepts || []).slice().sort()) !== JSON.stringify((incP.sharedDepts || []).slice().sort())) return true;
      return false;
    }

    function computeProjectsImportDiff(currentProjects, incomingProjects) {
      const addedProjects = [];
      const webOnlyProjects = [];
      const projectDiffs = [];

      let addedEventsCount = 0;
      let modifiedEventsCount = 0;
      let webOnlyEventsCount = 0;
      let metaChangedCount = 0;

      (incomingProjects || []).forEach(incP => {
        const curP = (currentProjects || []).find(cp => matchProjectKey(cp, incP));
        if (!curP) {
          addedProjects.push(incP);
          addedEventsCount += (incP.events || []).length;
          return;
        }
        if (curP._locked && curP.secMode === "full") return;

        const metaChanged = hasProjectMetaDiff(curP, incP);
        if (metaChanged) metaChangedCount++;

        const curEvs = curP.events || [];
        const incEvs = incP.events || [];
        const addedEvs = [];
        const modEvs = [];
        const webOnlyEvs = [];

        incEvs.forEach(ie => {
          const ce = curEvs.find(x => matchEventKey(x, ie));
          if (!ce) addedEvs.push(ie);
          else if (!ce._lockedEv && hasEventContentDiff(ce, ie)) modEvs.push({ cur: ce, inc: ie });
        });

        curEvs.forEach(ce => {
          if (ce._lockedEv) return;
          const ie = incEvs.find(x => matchEventKey(ce, x));
          if (!ie) webOnlyEvs.push(ce);
        });

        addedEventsCount += addedEvs.length;
        modifiedEventsCount += modEvs.length;
        webOnlyEventsCount += webOnlyEvs.length;

        if (metaChanged || addedEvs.length || modEvs.length || webOnlyEvs.length) {
          projectDiffs.push({
            code: curP.code,
            shortName: incP.shortName || curP.shortName,
            metaChanged,
            addedEvs,
            modEvs,
            webOnlyEvs
          });
        }
      });

      (currentProjects || []).forEach(curP => {
        const incP = (incomingProjects || []).find(ip => matchProjectKey(curP, ip));
        if (!incP) {
          webOnlyProjects.push(curP);
          webOnlyEventsCount += (curP.events || []).length;
        }
      });

      return {
        addedProjects,
        webOnlyProjects,
        projectDiffs,
        addedEventsCount,
        modifiedEventsCount,
        webOnlyEventsCount,
        metaChangedCount,
        hasAnyDiff: !!(addedProjects.length || webOnlyProjects.length || projectDiffs.length)
      };
    }

    /* Smart Merge: Keeps ALL web-only projects & web-only milestones while merging incoming additions & updates! */
    function mergeProjectListsSmart(baseProjects, incomingProjects) {
      const result = JSON.parse(JSON.stringify(baseProjects || []));

      (incomingProjects || []).forEach(incRaw => {
        const incP = JSON.parse(JSON.stringify(incRaw));
        const curIdx = result.findIndex(cp => matchProjectKey(cp, incP));
        if (curIdx < 0) {
          result.push(incP);
          return;
        }
        const curP = result[curIdx];
        if (curP._locked && curP.secMode === "full") return;

        // Update project metadata with incoming non-empty values while keeping curP.id & locked payloads safe
        const keepId = curP.id;
        const curLocked = curP._locked;
        const curEnc = curP.encPayload;
        const keepQuickIds = Array.isArray(incP.quickIds) && incP.quickIds.length ? incP.quickIds : (curP.quickIds || []);
        const mergedEvents = JSON.parse(JSON.stringify(curP.events || []));

        (incP.events || []).forEach(ie => {
          const matchIdx = mergedEvents.findIndex(ce => matchEventKey(ce, ie));
          if (matchIdx < 0) {
            mergedEvents.push(ie);
          } else if (!mergedEvents[matchIdx]._lockedEv) {
            const prevEv = mergedEvents[matchIdx];
            const existingId = prevEv.id;
            const existingVer = (prevEv._ver || 1) + 1;
            const mergedLinks = Object.assign({}, prevEv.docLinks || {}, ie.docLinks || {});
            const mergedPhotos = (Array.isArray(ie.photos) && ie.photos.length) ? ie.photos : (prevEv.photos || []);
            const mergedPivot = ie.pivotMeta || prevEv.pivotMeta || null;
            const mergedTouch = Math.max(Number(prevEv._touchedAt) || 0, Number(ie._touchedAt) || 0);
            mergedEvents[matchIdx] = Object.assign({}, prevEv, ie, {
              id: existingId,
              _ver: existingVer,
              _touchedAt: mergedTouch,
              docLinks: mergedLinks,
              photos: mergedPhotos,
              pivotMeta: mergedPivot
            });
          }
        });

        mergedEvents.sort((a, b) => String(a.date).localeCompare(String(b.date)));

        if (!curLocked) {
          Object.assign(curP, incP);
          curP.quickIds = keepQuickIds;
        } else {
          curP.statusShort = incP.statusShort || curP.statusShort;
          curP.status = curP.statusShort;
          curP.statusColor = incP.statusColor || curP.statusColor;
          if (typeof incP.progressPct === "number") curP.progressPct = incP.progressPct;
          if (incP.tagLoc) curP.tagLoc = incP.tagLoc;
        }
        curP.id = keepId;
        if (curLocked) { curP._locked = true; curP.encPayload = curEnc; }
        curP.events = mergedEvents;
      });

      normalizeProjects(result);
      return result;
    }

    async function confirmPendingImport(mode) {
      if (!_pendingImportCtx || !_pendingImportCtx.payload) return;
      const { payload, sourceFileName } = _pendingImportCtx;
      _pendingImportCtx = null;

      if (mode === "overwrite") {
        // Auto-backup current state before full overwrite!
        if (!nasServerActive) {
          try {
            const bakTxt = JSON.stringify(serializeStoreForDisk("encrypted"), null, 2);
            localStorage.setItem(STORAGE_KEY + "_pre_overwrite_backup", bakTxt);
          } catch (e) {}
        }
        if (payload.fullStore) {
          store = payload.fullStore;
        } else {
          store.projects = payload.projects;
        }
      } else {
        // Smart Merge!
        store.projects = mergeProjectListsSmart(store.projects, payload.projects);
      }

      delete store.groupCapex;
      delete store._groupCapexLocked;
      normalizeProjects(store.projects);
      markEncryptedStoreFlags(store);
      projects = store.projects;
      if (hasAnyUnlockedKey()) decryptAuthorizedItemsInMemory();

      (projects || []).forEach(p => {
        if (p.leadDept && !store.departments.includes(p.leadDept)) store.departments.push(p.leadDept);
        (p.sharedDepts || []).forEach(d => {
          if (d && !store.departments.includes(d)) store.departments.push(d);
        });
      });

      const anyNeedsVault = projects.some(p => p.secMode === "finance" || p.secMode === "full");
      commitStore(true);
      if (activeDept === "ALL" && !canAccessGroupLayer()) {
        activeDept = store.departments[0] || "工務部";
      }
      activeDeptIdx = Math.max(0, getDeptDeckItems().findIndex(x => x.key === activeDept));
      activePj = 0;
      refreshAllLayers();

      if (anyNeedsVault && !(store.vault && store.vault.enabled)) {
        openVaultStudio();
        toastMsg(`✓ 已${mode === 'merge' ? '智慧合併' : '覆蓋匯入'} ${projects.length} 案！請設定金庫密碼以啟動加密`);
      } else {
        if (nasServerActive) await nasPushFullStore(`${mode === 'merge' ? '智慧合併' : '覆蓋匯入'}：${sourceFileName}`);
        closeSheet();
        toastMsg(mode === "merge"
          ? `🔀 已完成智慧合併（保留網頁新進度並併入 ${sourceFileName}）！`
          : `✓ 已備份原狀態並以「${sourceFileName}」覆蓋更新！`);
      }
    }

    /* ==========================================================================
       V15 MODULE 1: ✨ 零打擾「上次看過後，哪裡有新履歷」微光標記 (Ambient Unread Glow)
       ========================================================================== */
    const VIEWER_ID_KEY = "youxing_viewer_id_v15";
    const VIEWER_NAME_KEY = "youxing_viewer_name_v15";
    const SEEN_STATE_KEY = "youxing_seen_state_v15";
    const LOCAL_REV_KEY = "youxing_local_revs_v15";

    // Initial baseline watermark for a brand-new executive opening V15:
    // Marks historical items <= Nov 4 as already read so ONLY the latest Nov 5+ progress
    // (or any new milestone added afterwards) gently glows +1 until viewed!
    const INITIAL_DEFAULT_WATERMARK_MS = 1793800000000;

    function getViewerId() {
      let vid = "";
      try { vid = localStorage.getItem(VIEWER_ID_KEY) || ""; } catch (e) {}
      if (!vid) {
        vid = "vw-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
        try { localStorage.setItem(VIEWER_ID_KEY, vid); } catch (e) {}
      }
      return vid;
    }

    function getViewerNickname() {
      try { return localStorage.getItem(VIEWER_NAME_KEY) || ""; } catch (e) { return ""; }
    }

    function setViewerNickname(name) {
      const clean = String(name || "").trim().slice(0, 24);
      try { localStorage.setItem(VIEWER_NAME_KEY, clean); } catch (e) {}
      scheduleSyncViewerSeen();
      toastMsg(clean ? `✓ 已記住您的留痕顯示名稱：${clean}` : "已清除留痕名稱");
    }

    function loadSeenState() {
      try {
        const raw = localStorage.getItem(SEEN_STATE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            if (!parsed.seenEvMap || typeof parsed.seenEvMap !== "object") parsed.seenEvMap = {};
            if (!parsed.baselineMs) parsed.baselineMs = INITIAL_DEFAULT_WATERMARK_MS;
            return parsed;
          }
        }
      } catch (e) {}
      const safeBaseline = Math.min(INITIAL_DEFAULT_WATERMARK_MS, Date.now() - 60000);
      const init = { baselineMs: safeBaseline, lastOpenAt: Date.now(), seenEvMap: {} };
      try { localStorage.setItem(SEEN_STATE_KEY, JSON.stringify(init)); } catch (e) {}
      return init;
    }

    let _viewerSeen = loadSeenState();
    let _seenSyncTimer = null;
    let _dwellReadTimer = null;

    function saveSeenStateLocal() {
      try { localStorage.setItem(SEEN_STATE_KEY, JSON.stringify(_viewerSeen)); } catch (e) {}
    }

    function scheduleSyncViewerSeen() {
      saveSeenStateLocal();
      if (typeof nasServerActive === "undefined" || !nasServerActive) return;
      if (_seenSyncTimer) clearTimeout(_seenSyncTimer);
      _seenSyncTimer = setTimeout(async () => {
        try {
          await fetch("/api/viewer_seen", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              viewerId: getViewerId(),
              nickname: getViewerNickname(),
              lastOpenAt: Date.now(),
              seenEvMap: _viewerSeen.seenEvMap || {}
            })
          });
        } catch (e) {}
      }, 450);
    }

    async function pullViewerSeenFromNas() {
      if (typeof nasServerActive === "undefined" || !nasServerActive) return;
      try {
        const res = await fetch("/api/viewer?viewerId=" + encodeURIComponent(getViewerId()), { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.ok && data.viewer && data.viewer.seenEvMap) {
          const srvMap = data.viewer.seenEvMap;
          Object.keys(srvMap).forEach(eid => {
            _viewerSeen.seenEvMap[eid] = Math.max(_viewerSeen.seenEvMap[eid] || 0, Number(srvMap[eid]) || 0);
          });
          if (data.viewer.nickname && !getViewerNickname()) {
            try { localStorage.setItem(VIEWER_NAME_KEY, data.viewer.nickname); } catch (e) {}
          }
          saveSeenStateLocal();
          refreshUnreadBadgesInDom();
        } else {
          scheduleSyncViewerSeen();
        }
      } catch (e) {}
    }

    function getEventTouchMs(ev) {
      return Number(ev && ev._touchedAt) || 0;
    }

    function isEventUnread(p, ev) {
      if (!ev || !ev.id) return false;
      if (p && p._locked && p.secMode === "full") return false;
      if (ev._lockedEv) return false;
      const tMs = getEventTouchMs(ev);
      if (!tMs || tMs <= (_viewerSeen.baselineMs || INITIAL_DEFAULT_WATERMARK_MS)) return false;
      const seenMs = Number((_viewerSeen.seenEvMap || {})[ev.id]) || 0;
      return tMs > seenMs;
    }

    function getProjectUnreadEvents(p) {
      if (!p || (p._locked && p.secMode === "full")) return [];
      return (p.events || []).filter(ev => isEventUnread(p, ev));
    }

    function getProjectUnreadCount(p) {
      return getProjectUnreadEvents(p).length;
    }

    function getDeptUnreadCount(deptName) {
      const list = deptName === "ALL" ? projects : getVisibleProjects(deptName);
      return list.reduce((acc, p) => acc + getProjectUnreadCount(p), 0);
    }

    function markEventSeen(pjId, evId, quiet = false) {
      if (!evId) return false;
      const p = projects.find(x => x.id === pjId) || projects.find(x => (x.events || []).some(e => e.id === evId));
      const ev = p && (p.events || []).find(e => e.id === evId);
      const stamp = Math.max(Date.now(), getEventTouchMs(ev) + 1);
      const prev = Number((_viewerSeen.seenEvMap || {})[evId]) || 0;
      const wasUnread = ev ? isEventUnread(p, ev) : false;
      _viewerSeen.seenEvMap[evId] = Math.max(prev, stamp);
      scheduleSyncViewerSeen();
      if (wasUnread && !quiet) {
        refreshUnreadBadgesInDom();
      }
      return wasUnread;
    }

    function markAllUnreadSeen() {

      projects.forEach(p => {

            cleared++;
          }
        });
      });
      scheduleSyncViewerSeen();
      refreshAllLayers();
      toastMsg(cleared ? `✓ 已將 ${cleared} 筆新進展標記為已讀` : "目前已無未讀新紀錄");

    /* ==========================================================================
       V15 MODULE 2: ⚡「丟一句大白話／貼截圖」1 秒拆解自動填完 8 格表單
       ========================================================================== */
    function parseColloquialDraftToFields(rawInput) {
      const raw = String(rawInput || "").trim();
      if (!raw) return null;

      // Clean LINE chat headers e.g. "14:22 陳建築師：" or "[2026/11/06] 王工務:"
      const cleanedLines = raw.split(/\r?\n/).map(l =>
        l.replace(/^\s*[\[\(]?\d{1,2}:\d{2}[\]\)]?\s*/, "")
         .replace(/^\s*(?:上午|下午|晚間)\s*\d{1,2}:\d{2}\s*/, "")
         .trim()
      ).filter(Boolean);
      const joined = cleanedLines.join("；");

      // 1. Detect Target Project (#f_pj)
      let matchedPjId = "";
      const pjAliasMap = [
        { id: "gangshan", kws: ["岡山", "鹽埔", "典寶溪", "400床", "團膳央廚", "81-2"] },
        { id: "machouhou", kws: ["馬稠後", "食品廠", "朴子", "調理包", "介護食", "急凍庫", "1-2-2", "7-30"] },
        { id: "daliao", kws: ["大寮", "上寮", "頂樓", "五樓", "5F", "世峯", "齊鑫", "高輔", "台科電"] },
        { id: "renyi", kws: ["仁怡", "余公館", "仁武", "危老", "老屋翻修", "拆除新建", "循續"] }
      ];
      for (const item of pjAliasMap) {
        if (item.kws.some(kw => joined.includes(kw)) && projects.some(p => p.id === item.id)) {
          matchedPjId = item.id;
          break;
        }
      }
      if (!matchedPjId) {
        for (const p of projects) {
          if (p._locked && p.secMode === "full") continue;
          const nameKey = (p.shortName || "").slice(0, 3);
          if ((nameKey && joined.includes(nameKey)) || (p.code && joined.toUpperCase().includes(p.code.toUpperCase()))) {
            matchedPjId = p.id;
            break;
          }
        }
      }

      // 2. Extract Date (AD / ROC / Relative)
      const now = new Date();
      let dtObj = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let explicitDateStr = "";

      const mAdFull = joined.match(/\b(20\d{2})[\/\-\.年](\d{1,2})[\/\-\.月](\d{1,2})日?/);
      const mRocFull = joined.match(/(?:民國\s*)?(1\d{2})[\/\-\.年](\d{1,2})[\/\-\.月](\d{1,2})日?/);
      const mAdYm = !mAdFull && joined.match(/\b(20\d{2})[\/\-\.年](\d{1,2})月?(?![\d\/\-])/);
      const mMdOnly = !mAdFull && !mRocFull && joined.match(/(?:^|[^\d])(0?[1-9]|1[0-2])[\/月](0?[1-9]|[12]\d|3[01])(?:日|號|\b)/);

      if (mAdFull) {
        explicitDateStr = `${mAdFull[1]}-${mAdFull[2].padStart(2, "0")}-${mAdFull[3].padStart(2, "0")}`;
      } else if (mRocFull) {
        const y = parseInt(mRocFull[1], 10) + 1911;
        explicitDateStr = `${y}-${mRocFull[2].padStart(2, "0")}-${mRocFull[3].padStart(2, "0")}`;
      } else if (mAdYm) {
        explicitDateStr = `${mAdYm[1]}-${mAdYm[2].padStart(2, "0")}`;
      } else if (/前天/.test(joined)) {
        dtObj.setDate(dtObj.getDate() - 2);
      } else if (/昨天|昨日/.test(joined)) {
        dtObj.setDate(dtObj.getDate() - 1);
      } else if (mMdOnly) {
        explicitDateStr = `${now.getFullYear()}-${mMdOnly[1].padStart(2, "0")}-${mMdOnly[2].padStart(2, "0")}`;
      }

      if (!explicitDateStr) {
        explicitDateStr = `${dtObj.getFullYear()}-${String(dtObj.getMonth() + 1).padStart(2, "0")}-${String(dtObj.getDate()).padStart(2, "0")}`;
      }
      const rocDateStr = convertAdToRocStr(explicitDateStr) || getTodayAdAndRoc().rocDate;

      // 3. Classify Stage (#f_ph) across Engineering + Migrant Agency domains
      const phaseRules = [
        { ph: "招募許可與配額", kws: ["招募許可", "初次招募", "重新招募", "核配", "配額", "求才登記", "無違反勞工法令"] },
        { ph: "國外選工與認證", kws: ["選工", "國外仲介", "認證", "簽證", "挑工", "越籍", "印籍", "菲籍", "泰籍"] },
        { ph: "入境接機與生照", kws: ["入境", "接機", "體檢", "居留證", "生照", "生活照顧", "宿舍檢查", "外國人通報"] },
        { ph: "仲介評鑑整備", kws: ["仲介評鑑", "評鑑A級", "勞動部評鑑", "顧客滿意"] },
        { ph: "立項與購地", kws: ["購地", "買賣契約", "過戶", "權狀", "鑑界", "選址", "購屋"] },
        { ph: "規劃與設計", kws: ["建築師", "圖說", "建築線", "下水道", "出流管制", "都審", "建照", "掛件", "變更設計", "鑽探", "結構", "平面圖", "3D", "危老"] },
        { ph: "發包與合約", kws: ["發包", "報價", "比價", "議價", "決標", "簽約", "承攬", "合約", "標單", "直購", "追加減", "鄰房鑑定"] },
        { ph: "施工與驗收", kws: ["開工", "開挖", "灌漿", "鋼構", "上樑", "吊裝", "泥作", "防水", "隔間", "水電", "消防", "驗收", "竣工", "使照", "交屋"] },
        { ph: "財務與決策", kws: ["土融", "建融", "授信", "核貸", "撥款", "利率", "預算", "估價", "鑑價", "拍板", "定案", "訴訟", "履保金"] }
      ];
      let detectedPhase = "規劃與設計";
      let bestScore = 0;
      for (const rule of phaseRules) {
        const sc = rule.kws.reduce((acc, kw) => acc + (joined.includes(kw) ? (kw.length >= 3 ? 2 : 1) : 0), 0);
        if (sc > bestScore) { bestScore = sc; detectedPhase = rule.ph; }
      }

      // 4. Extract Quantitative Metrics (#f_mt)
      const metricMatches = [];
      const metricPatterns = [
        /(?:節省|省下?|核減|追減|減少|增加|追加|總價|預算|造價|合約價?|申貸|核貸|撥款|自備|估值|單價)?\s*\d[\d,]*(?:\.\d+)?\s*(?:~|～|\-)?\s*\d*[\d,]*(?:\.\d+)?\s*(?:億元|億|萬元|萬|元\/坪|元)/g,
        /(?:未滿|未達|超過|核配|容納|規劃|共)?\s*\d[\d,]*(?:\.\d+)?\s*(?:人|床|戶|間|單元|名|組|噸|t|坪|㎡|m³|kW|個月|日曆天|工作天|天|%)/g
      ];
      metricPatterns.forEach(re => {
        let m;
        while ((m = re.exec(joined)) !== null) {
          const cleanM = m[0].trim();
          if (cleanM.length >= 2 && !/^(20\d{2}|11\d)/.test(cleanM) && !metricMatches.some(x => x.includes(cleanM) || cleanM.includes(x))) {
            metricMatches.push(cleanM);
          }
        }
      });
      const metricsStr = metricMatches.slice(0, 4).join("｜");

      // 5. Extract Related Depts / Partners / Evidence Docs (#f_dc)
      const docTokens = [];
      const bookMatches = joined.match(/《([^》]+)》/g) || [];
      bookMatches.forEach(bm => docTokens.push(bm.replace(/[《》]/g, "").trim()));

      const docSuffixMatches = joined.match(/[\u4e00-\u9fa5A-Za-z0-9_\-]{2,14}(?:報告|網圖|圖說|契約書?|合約書?|報價單|標單|計畫書|紀錄表?|申請書|核准函|公文|會勘紀錄|驗收單|請款單)/g) || [];
      docSuffixMatches.forEach(dm => {
        if (!docTokens.some(x => x.includes(dm) || dm.includes(x))) docTokens.push(dm);
      });

      const actorKeywords = [
        ["建築師", "建築師事務所"], ["結構技師", "結構技師"], ["營造廠", "營造廠"],
        ["欣陽", "欣陽管理顧問"], ["世峯", "世峯開發"], ["齊鑫", "齊鑫工程"],
        ["高輔", "高輔水電"], ["台科電", "台科電"], ["合庫", "合作金庫"], ["銀行", "融資銀行"],
        ["工務", "工務部"], ["宿服", "宿服總務部"], ["總務", "宿服總務部"], ["人資", "人資部"], ["服務部", "服務部"], ["財務", "財務部"], ["行政", "行政部"]
      ];
      actorKeywords.forEach(([kw, label]) => {
        if (joined.includes(kw) && !docTokens.includes(label) && docTokens.length < 4) {
          docTokens.push(label);
        }
      });
      const docsStr = docTokens.slice(0, 4).join("、");

      // 6. Compose Clean Headline (#f_tt)
      let coreClause = cleanedLines[0] || joined;
      coreClause = coreClause
        .replace(/^(?:今天|今日|昨天|昨日|前天|剛剛|剛才|目前|最新進度|回報|報告|跟老闆報告|通知)[，、：\s]*/g, "")
        .replace(/^(?:\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}|1\d{2}[\/\-]\d{1,2}[\/\-]\d{1,2})\s*/g, "")
        .replace(/^[，、；：\s]+/, "");
      const clauses = coreClause.split(/[。；！？!?]/).map(s => s.trim()).filter(Boolean);
      let headline = clauses[0] || coreClause;
      if (headline.length > 30) {
        const subParts = headline.split(/[，,]/).map(s => s.trim()).filter(Boolean);
        headline = subParts.slice(0, 2).join("，").slice(0, 32);
      }
      if (!headline) headline = "專案重要進度紀錄";

      // 7. Extract Impact / Note (#f_nt)
      let impactStr = "";
      const impactMatch = joined.match(/(?:改採|因此|預計|預估|可省|省下?|節省|免除|避免|後續|確保|加速|縮短)[^。；\n]{3,38}/);
      if (impactMatch) {
        impactStr = impactMatch[0].trim();
      } else if (metricMatches.some(x => /省|減/.test(x))) {
        impactStr = `達成成本優化（${metricMatches.find(x => /省|減/.test(x))}）並推進後續排程`;
      } else {
        impactStr = `完成「${detectedPhase}」階段重要節點確認，銜接後續作業`;
      }

      // 8. Compose Structured Summary (#f_sm)
      let formalSummary = joined;
      if (!/[。]$/.test(formalSummary)) formalSummary += "。";
      if (formalSummary.length < 45 && metricMatches.length) {
        formalSummary = `完成本階段重要進度確認：${formalSummary.replace(/^(?:今天|今日|昨天|昨日|剛剛)[，、\s]*/, "")}`;
      }

      // 9. Detect Pivot & Auto-build Structured Pivot Causal Meta (#f_ky + pivotMeta)
      const isPivot = /改採|改為|取消|免辦|免除|暫緩|拍板|轉為|變更|核減|省下?|省\s*\d|終止|解約/.test(joined);
      let pivotMeta = null;
      if (isPivot) {
        const fromM = joined.match(/(?:原(?:本|先|方案)?|由|免辦|免除|取消)([^，。；]{2,24})/);
        const toM = joined.match(/(?:改採?|轉為|拍板|定案|調整為)([^，。；]{2,26})/);
        pivotMeta = {
          fromPlan: fromM ? fromM[0].trim() : "原規劃評估方案",
          trigger: joined.slice(0, 36) + (joined.length > 36 ? "…" : ""),
          toDecision: toM ? toM[0].trim() : headline,
          delta: metricsStr || impactStr,
          budgetTag: metricMatches.find(x => /億|萬/.test(x)) || "",
          isBudgetStep: metricMatches.some(x => /億|萬/.test(x))
        };
      }
      const isSecret = /利率|成數|底價|內帳|訴訟|扣款|違約|私宅/.test(joined);

      return {
        pjId: matchedPjId,
        date: explicitDateStr,
        rocDate: rocDateStr,
        phase: detectedPhase,
        title: headline,
        metrics: metricsStr,
        summary: formalSummary,
        docs: docsStr,
        note: impactStr,
        isKey: isPivot,
        isSecret,
        pivotMeta
      };
    }

    function compressImageFileToDataUrl(fileOrBlob, maxDim = 1280, quality = 0.80) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("讀取圖片失敗"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("解析圖片失敗"));
          img.onload = () => {
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (w > maxDim || h > maxDim) {
              const ratio = Math.min(maxDim / w, maxDim / h);
              w = Math.max(1, Math.round(w * ratio));
              h = Math.max(1, Math.round(h * ratio));
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#0F172A";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(fileOrBlob);
      });
    }

    async function uploadOrStorePhoto(fileOrBlob, opts = {}) {
      const dataUrl = await compressImageFileToDataUrl(fileOrBlob, 1280, 0.80);
      let nasUrl = "";
      let ocrText = "";
      let ocrMode = "";
      if (typeof nasServerActive !== "undefined" && nasServerActive) {
        try {
          const res = await fetch("/api/media", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dataUrl, runOcr: !!opts.runOcr })
          });
          if (res.ok) {
            const rj = await res.json();
            if (rj && rj.ok && rj.url) {
              nasUrl = rj.url;
              ocrText = rj.ocrText || "";
              ocrMode = rj.ocrMode || "";
            }
          }
        } catch (e) {}
      }
      const id = "ph-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
      const entry = {
        id,
        nasUrl: nasUrl || "",
        dataUrl: nasUrl ? "" : dataUrl,
        caption: opts.caption || (fileOrBlob.name ? fileOrBlob.name.replace(/\.[^.]+$/, "") : "現場紀錄照片"),
        stageLabel: opts.stageLabel || ""
      };
      return { entry, ocrText, ocrMode };
    }

    async function onFormPhotoInputSelected(ev) {
      const files = Array.from((ev.target && ev.target.files) || []);

      toastMsg("📸 正在壓縮並處理照片...");
      for (const f of files.slice(0, 4)) {

          _formPhotosDraft.push(entry);

      ev.target.value = "";
      renderFormPhotosHost();
      toastMsg(`✓ 已附加 ${files.length} 張壓縮現場照！`);

    async function attachPhotoDirectlyToEvent(pjId, evId, fileOrBlob) {
      const p = projects.find(x => x.id === pjId);
      const ev = p && (p.events || []).find(e => e.id === evId);
      if (!p || !ev) return;
      if ((p._locked && p.secMode === "full") || ev._lockedEv) {
        openUnlockModal(p.vaultDept || "財務部");
        return;
      }
      toastMsg("📸 正在壓縮現場照並寫入資料庫...");
      try {
        const { entry } = await uploadOrStorePhoto(fileOrBlob, {
          caption: `${ev.date} ${ev.title.slice(0, 14)}`,
          stageLabel: `${ev.date} ${ev.phase}`
        });
        if (!Array.isArray(ev.photos)) ev.photos = [];
        ev.photos.push(entry);
        ev._touchedAt = Date.now();
        markEventSeen(p.id, ev.id, true);
        const baseEvVer = ev._ver || 1;
        recordLocalItemRevision("event", "附加現場照片", p, ev, ev);
        commitStore(true);
        if (typeof nasServerActive !== "undefined" && nasServerActive) {
          const diskSafe = serializeStoreForDisk("encrypted");
          const dp = diskSafe.projects.find(x => x.id === p.id);
          const de = dp && (dp.events || []).find(x => x.id === ev.id);
          if (de) await nasSendOp({ op: "upsert_event", pjId: p.id, baseEvVer, event: de });
        }
        refreshAllLayers();
        toastMsg("📸 已貼上現場照並自動壓縮存檔！（免設任何 NAS 資料夾路徑）");
      } catch (err) {
        toastMsg("貼上圖片失敗，請確認剪貼簿內容為圖片格式");
      }
    }

    async function promptUploadPhotoForEvent(pjId, evId) {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "image/*";
      inp.onchange = async e => {
        const f = e.target.files && e.target.files[0];
        if (f) await attachPhotoDirectlyToEvent(pjId, evId, f);
      };
      inp.click();
    }

    function removePhotoFromDetailEvent(pjId, evId, photoIdx) {

      if (!p || !ev || !Array.isArray(ev.photos)) return;
      const beforeSnap = JSON.parse(JSON.stringify(ev));
      ev.photos.splice(photoIdx, 1);
      ev._touchedAt = Date.now();
      const baseEvVer = ev._ver || 1;
      recordLocalItemRevision("event", "移除節點照片", p, beforeSnap, ev);
      commitStore(true);
      if (typeof nasServerActive !== "undefined" && nasServerActive) {

        const dp = diskSafe.projects.find(x => x.id === p.id);
        const de = dp && (dp.events || []).find(x => x.id === ev.id);
        if (de) nasSendOp({ op: "upsert_event", pjId: p.id, baseEvVer, event: de });
      }
      refreshAllLayers();
      toastMsg("已移除該張照片（可隨時由「單筆留痕」一鍵救回）");

    function stepPhotoLightbox(delta) {
      if (!sheetCtx || sheetCtx.type !== "photo_lightbox") return;
      const p = projects.find(x => x.id === sheetCtx.pjId);
      const ev = p && (p.events || []).find(e => e.id === sheetCtx.evId);
      if (!ev || !Array.isArray(ev.photos) || !ev.photos.length) return;
      const len = ev.photos.length;
      sheetCtx.idx = (sheetCtx.idx + delta + len) % len;
      renderPhotoLightboxSheet();
    }

      if (!sheetCtx || sheetCtx.type !== "photo_lightbox") return;
      const p = projects.find(x => x.id === sheetCtx.pjId);

      if (!p || !ev || !Array.isArray(ev.photos) || !ev.photos.length) return;
      const idx = Math.max(0, Math.min(ev.photos.length - 1, sheetCtx.idx || 0));

      const fb = ph.relPath ? `onerror="if(this.dataset.fb&&this.src!==this.dataset.fb){this.src=this.dataset.fb;}else{this.style.display='none';}"` : `onerror="this.style.display='none'"`;

    async function copyQuickIdText(valText, labelText) {
      const txt = String(valText || "").trim();
      if (!txt || txt.includes("🔒")) {
        toastMsg("🔒 此欄位受財務／權限密碼保護，請先點擊解鎖");
        return;
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(txt);
        } else {
          const ta = document.createElement("textarea");
          ta.value = txt;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        toastMsg(`📋 已複製【${labelText}】：${txt.slice(0, 34)}${txt.length > 34 ? '…' : ''}`);
      } catch (e) {

        revs.unshift({

          kind,
          action,
          actor: getViewerNickname() || "本機操作",
          pjId: p ? p.id : "",
          pjName: p ? p.shortName : "",
          evId: (afterEv && afterEv.id) || (beforeEv && beforeEv.id) || "",
          title,
          summaryDiff: `${action}：${title}`,
          beforeEv: beforeEv ? JSON.parse(JSON.stringify(beforeEv)) : null,
          afterEv: afterEv ? JSON.parse(JSON.stringify(afterEv)) : null,
          canRollback: true
        });
        localStorage.setItem(LOCAL_REV_KEY, JSON.stringify(revs.slice(0, 80)));
      } catch (e) {}
    }

    async function executeItemRollback(revId, filterPjId = "", filterEvId = "") {
      const isNas = typeof nasServerActive !== "undefined" && nasServerActive;
      if (isNas) {
        try {
          const res = await fetch("/api/rollback_item", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              revId,
              clientId: typeof MY_CLIENT_ID !== "undefined" ? MY_CLIENT_ID : "",
              actor: getViewerNickname() || ""
            })
          });
          const data = await res.json();
          if (res.ok && data.ok && data.store) {
            applyIncomingServerStore(data.store);
            openRevisionHistoryModal(filterPjId, filterEvId);
            toastMsg(`⏪ ${data.summary || '已完成單筆還原！'}`);
          } else {
            toastMsg((data && data.error) || "單筆還原失敗");
          }
        } catch (e) {
          toastMsg("連線 NAS 還原失敗");
        }
        return;
      }

      // Offline standalone single-item rollback
      const revs = loadLocalRevisions();
      const r = revs.find(x => x.revId === revId);
      if (!r) return;
      const p = projects.find(x => x.id === r.pjId) || projects[0];
      if (!p) return;
      if (!Array.isArray(p.events)) p.events = [];
      if (r.beforeEv === null && r.afterEv) {
        p.events = p.events.filter(e => e.id !== r.evId);
      } else if (r.beforeEv) {
        const idx = p.events.findIndex(e => e.id === r.evId);
        const restored = JSON.parse(JSON.stringify(r.beforeEv));
        restored._touchedAt = Date.now();
        if (idx >= 0) p.events[idx] = restored;
        else p.events.push(restored);
        p.events.sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
      }
      commitStore(true);
      refreshAllLayers();
      openRevisionHistoryModal(filterPjId, filterEvId);
      toastMsg(`⏪ 已還原「${r.title}」！`);
    }
